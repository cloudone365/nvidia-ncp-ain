<g><title>oob-mgmt-server (control node)</title><rect x="48" y="160" width="330" height="320" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="64" y="187" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">oob-mgmt-server (control node)</text>
<text x="64" y="216" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ansible-core 2.14+</text>
<text x="64" y="234" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ansible-galaxy collection install</text>
<text x="64" y="252" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  nvidia.nvue</text>
<text x="64" y="270" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">inventory.ini:</text>
<text x="64" y="288" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  [spines] spine01 spine02</text>
<text x="64" y="306" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  [leaves] leaf01 leaf02</text>
<text x="64" y="324" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  [cumulus:children] + vars</text>
<text x="64" y="342" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">group_vars/spines.yml, leaves.yml</text>
<text x="64" y="360" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">host_vars: loopback, bgp_asn,</text>
<text x="64" y="378" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  router_id, server_if, server_ip</text>
</g>
<path d="M378,300 L400,300 L400,250 L420,250" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" fill="none"/>
<path d="M400,300 L400,470 L420,470" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" fill="none"/>
<path d="M400,300 L400,140 L1010,140 L1010,200" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" fill="none"/>
<path d="M400,470 L400,560 L1010,560 L1010,520" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" fill="none"/>
<text x="410" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start" xml:space="preserve">mgmt network (eth0 / VRF mgmt)</text>
<g><title>Two transports</title><rect x="48" y="520" width="330" height="200" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="64" y="547" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Two transports</text>
<text x="64" y="576" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">REST: nvidia.nvue modules -&gt;</text>
<text x="64" y="594" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  https://&lt;switch&gt;:8765/nvue_v1/</text>
<text x="64" y="612" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  PATCH + revision apply</text>
<text x="64" y="630" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">CLI: ansible.builtin.command</text>
<text x="64" y="648" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  nv set ... ; nv config apply -y</text>
<text x="64" y="666" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  idempotent via nv config diff</text>
</g>
<g><title>On each switch</title><rect x="1200" y="160" width="350" height="200" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1216" y="187" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">On each switch</text>
<text x="1216" y="216" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv show system api  (REST enabled)</text>
<text x="1216" y="234" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nvued renders -&gt; /etc/nvue.d/</text>
<text x="1216" y="252" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  startup.yaml</text>
<text x="1216" y="270" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv config diff = dry run (check mode)</text>
<text x="1216" y="288" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv config save persists</text>
</g>
<g><title>Playbook result = Lab 1 config</title><rect x="1200" y="400" width="350" height="200" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="1216" y="427" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Playbook result = Lab 1 config</text>
<text x="1216" y="456" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">hostname, lo, swp51/52 up</text>
<text x="1216" y="474" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">BGP unnumbered peer-group</text>
<text x="1216" y="492" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">server-facing swp1 IP</text>
<text x="1216" y="510" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv set qos roce (leaves only)</text>
<text x="1216" y="528" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">run twice: changed=0 the 2nd time</text>
</g>
<g><title>Verify with Ansible, not by hand</title><rect x="48" y="760" width="1500" height="90" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="64" y="787" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Verify with Ansible, not by hand</text>
<text x="64" y="817" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ansible cumulus -m command -a 'nv show router bgp'  |  ansible leaves -m command -a 'nv show qos roce'  |  nv config diff empty on every node</text>
</g>
