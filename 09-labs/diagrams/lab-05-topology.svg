<text x="1216" y="486" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Trigger a drop (Task 5)</text>
<text x="1216" y="514" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">server01: ping an address with</text>
<text x="1216" y="532" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">no route -&gt; Router 'routing table</text>
<text x="1216" y="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">unicast miss' on leaf01 (hardware</text>
<text x="1216" y="568" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">records; Air shows the commands)</text>
</g>
<path d="M720,660 L800,660 L800,600 L1200,560" stroke="#d93025" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Break / fix faults you will inject</title><rect x="48" y="800" width="1500" height="110" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="64" y="827" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Break / fix faults you will inject</text>
<text x="64" y="856" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">1 shut a fabric link (netq check interfaces, events type link)   2 MTU mismatch on one side (netq check mtu)   3 roce mode lossy on leaf02 (netq show roce-config drift)</text>
<text x="64" y="874" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Local toolbox when NetQ is absent: nv show interface swp51 counters, nv show qos roce, cl-resource-query, sudo cl-support, /var/log/switchd.log</text>
</g>
