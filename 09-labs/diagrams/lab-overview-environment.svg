<g><title>Which lab uses what</title><rect x="48" y="830" width="1500" height="200" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="64" y="858" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Which lab uses what</text>
<text x="64" y="889" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Lab 1  Air leaf-spine: NVUE hostnames, loopbacks, BGP unnumbered, server ports, nv set qos roce (lossless profile)</text>
<text x="64" y="909" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Lab 2  Hosts (+ switch): ibstat states, opensm, LIDs, ibhosts / iblinkinfo, ibping, ibdiagnet, PKey 0x8001 + IPoIB child</text>
<text x="64" y="929" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Lab 3  Hosts: ib_write_bw / ib_write_lat / ib_read_bw / ib_send_bw, -R / -x on RoCE, --use_cuda, nccl-tests</text>
<text x="64" y="949" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Lab 4  Air: Ansible from oob-mgmt-server -&gt; NVUE REST (TCP 8765) or nv CLI over SSH, idempotent, nv config diff</text>
<text x="64" y="969" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Lab 5  Air (+ hardware for WJH records): netq check / show / trace, roce-config, nv set system wjh, nv-wjh-cli, cl-resource-query</text>
<text x="64" y="989" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Lab 6  Kubernetes: Helm install Network Operator, NicClusterPolicy, MacvlanNetwork -&gt; NAD, rdma/rdma_shared_device_a pods</text>
</g>
