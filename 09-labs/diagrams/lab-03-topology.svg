<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Lab 3 topology: two hosts running perftest and nccl-tests</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Lab 3 topology: two hosts running perftest and nccl-tests</text><text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">hostA is the server, hostB the client; the same commands work on ConnectX (IB or RoCE) and on Soft-RoCE (rxe0), only the numbers change</text><g><title>hostA  (server side)</title><rect x="60" y="180" width="560" height="420" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="340.0" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">hostA  (server side)</text>
</g>
<g><title>RDMA device</title><rect x="90" y="230" width="500" height="120" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/>
<text x="106" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">RDMA device</text>
<text x="106" y="284" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Option A: ConnectX-6/7 mlx5_0 (IB: LIDs; RoCE: GID index)</text>
<text x="106" y="302" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Option B: rxe0 = rdma_rxe over eth0 (RoCEv2 in software)</text>
<text x="106" y="320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ibv_devinfo -d &lt;dev&gt;: PORT_ACTIVE, link_layer</text>
</g>
<g><title>perftest servers (no address argument)</title><rect x="90" y="370" width="500" height="100" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="106" y="396" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">perftest servers (no address argument)</text>
<text x="106" y="424" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ib_write_bw -d mlx5_0 -i 1 -F --report_gbits -a</text>
<text x="106" y="442" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ib_write_lat -d mlx5_0 -i 1 -F -s 8 -n 20000</text>
</g>
<g><title>GPU (optional, Task 5-6)</title><rect x="90" y="490" width="500" height="90" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="106" y="516" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">GPU (optional, Task 5-6)</text>
<text x="106" y="544" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">--use_cuda=0 puts the MR in GPU memory (nvidia-peermem)</text>
<text x="106" y="562" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nccl-tests rank 0-7</text>
</g>
<g><title>hostB  (client side)</title><rect x="980" y="180" width="560" height="420" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="1260.0" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">hostB  (client side)</text>
</g>
<g><title>RDMA device</title><rect x="1010" y="230" width="500" height="120" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/>
<text x="1026" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">RDMA device</text>
<text x="1026" y="284" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">same type as hostA</text>
<text x="1026" y="302" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">RoCE: -x &lt;gid-index&gt; on BOTH sides, or -R (rdma_cm)</text>
<text x="1026" y="320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Soft-RoCE: -d rxe0 -R</text>
</g>
<g><title>perftest clients (+ hostA IP)</title><rect x="1010" y="370" width="500" height="100" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1026" y="396" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">perftest clients (+ hostA IP)</text>
<text x="1026" y="424" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ib_write_bw -d mlx5_0 -i 1 -F --report_gbits -a &lt;hostA-ip&gt;</text>
<text x="1026" y="442" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ib_write_lat -d mlx5_0 -i 1 -F -s 8 -n 20000 &lt;hostA-ip&gt;</text>
</g>
<g><title>GPU (optional)</title><rect x="1010" y="490" width="500" height="90" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="1026" y="516" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">GPU (optional)</text>
<text x="1026" y="544" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">mpirun -np 16 -H hostA:8,hostB:8 ./all_reduce_perf -b 8 -e 8G -f 2 -g 1</text>
<text x="1026" y="562" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">NCCL_DEBUG=INFO, NCCL_IB_HCA, NCCL_IB_GID_INDEX / NCCL_IB_TC (RoCE)</text>
</g>
<line x1="620" y1="300" x2="980" y2="300" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)" fill="none"/>
<text x="800" y="290" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle" xml:space="preserve">TCP 18515: QP / GID / rkey exchange</text>
<line x1="980" y1="420" x2="620" y2="420" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" fill="none"/>
<text x="800" y="400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2f6fdb" text-anchor="middle" xml:space="preserve">RDMA WRITE / READ / SEND traffic (IB, or RoCEv2 = UDP 4791)</text>
<text x="800" y="460" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle" xml:space="preserve">back to back, or through a Quantum / Spectrum switch</text>
<g><title>What to record</title><rect x="60" y="640" width="1090" height="200" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="76" y="667" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">What to record</text>
<text x="76" y="697" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Task 1  message size at which BW reaches ~95% of line rate; small-message MsgRate (Mpps)</text>
<text x="76" y="717" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Task 2  t_typical / t_avg / 99.9% latency at -s 8  (NDR ~1-1.3 us; RoCE ~1.5-2.5 us; Soft-RoCE tens of us)</text>
<text x="76" y="737" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Task 3  ib_read_bw vs ib_write_bw; -q 1 vs -q 4 at 64 KiB; -D 10 vs -n iterations</text>
<text x="76" y="757" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Task 4  -b bidirectional; -S &lt;sl&gt; on IB, --tclass on RoCE (must match the lossless class, Lab 1 / Module 8.4)</text>
<text x="76" y="777" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Task 5-6  --use_cuda bandwidth vs host memory; all_reduce_perf busbw at 8 GB vs per-GPU NIC rate</text>
</g>
<g><title>Legend</title><rect x="1190" y="640" width="350" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<line x1="1206" y1="666" x2="1260" y2="666" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1274" y="671" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Control (TCP)</text>
<line x1="1206" y1="696" x2="1260" y2="696" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="1274" y="701" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Measured RDMA data</text>
</g></svg>
