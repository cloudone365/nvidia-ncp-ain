<text x="556" y="458" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">kube-multus-ds, whereabouts, cni-plugins-ds</text>
