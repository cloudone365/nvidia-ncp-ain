<text x="556" y="525" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Host</text>
<text x="556" y="552" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">/dev/infiniband/* exposed to pods</text>
<text x="556" y="570" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">allocatable rdma/rdma_shared_device_a: 63</text>
<text x="556" y="588" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">/etc/cni/net.d/00-multus.conf, /opt/cni/bin/macvlan</text>
</g>
