<text x="556" y="690" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">annotation k8s.v1.cni.cncf.io/networks: rdma-net</text>
<text x="556" y="708" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">net1 (macvlan on the RDMA NIC); ib_write_bw</text>
