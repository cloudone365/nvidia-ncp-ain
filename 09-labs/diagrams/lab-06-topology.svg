<text x="1096" y="645" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">pod perftest-client</text>
<text x="1096" y="672" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">limits: rdma/rdma_shared_device_a: 1</text>
<text x="1096" y="690" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">annotation k8s.v1.cni.cncf.io/networks: rdma-net</text>
<text x="1096" y="708" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">net1 (macvlan on the RDMA NIC); ib_write_bw &lt;server net1 ip&gt;</text>
