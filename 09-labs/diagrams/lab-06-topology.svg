<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Lab 6 topology: Kubernetes cluster with the NVIDIA Network Operator</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Lab 6 topology: Kubernetes cluster with the NVIDIA Network Operator</text><text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Operator -&gt; NicClusterPolicy -&gt; driver / device-plugin / Multus DaemonSets on NIC nodes -&gt; pods with an RDMA resource and a macvlan net1</text><g><title>control plane  (kind / minikube OK)</title><rect x="48" y="150" width="400" height="330" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="248.0" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">control plane  (kind / minikube OK)</text>
</g>
<g><title>network-operator (Helm)</title><rect x="70" y="200" width="356" height="120" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="86" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">network-operator (Helm)</text>
<text x="86" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ns nvidia-network-operator</text>
<text x="86" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">controller pod + NFD + SR-IOV</text>
<text x="86" y="290" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">network operator (optional)</text>
</g>
<g><title>CRDs</title><rect x="70" y="340" width="356" height="120" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="86" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">CRDs</text>
<text x="86" y="394" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nicclusterpolicies.mellanox.com</text>
<text x="86" y="412" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">macvlannetworks / hostdevicenetworks /</text>
<text x="86" y="430" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ipoibnetworks.mellanox.com; NAD (Multus)</text>
</g>
<g><title>NicClusterPolicy  nic-cluster-policy  (state: ready)</title><rect x="520" y="150" width="1030" height="120" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="536" y="177" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">NicClusterPolicy  nic-cluster-policy  (state: ready)</text>
<text x="536" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ofedDriver (mofed container, optional if host OFED kept)  |  rdmaSharedDevicePlugin: resourceName rdma_shared_device_a, selectors ifNames</text>
<text x="536" y="224" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">secondaryNetwork: multus, cniPlugins, ipamPlugin whereabouts  |  nvIpam / sriovDevicePlugin for the SR-IOV variant</text>
</g>
