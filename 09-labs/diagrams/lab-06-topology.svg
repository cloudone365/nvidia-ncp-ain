<text x="765.0" y="347" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">node-a  (ConnectX-6/7, NFD label pci-15b3.present)</text>
