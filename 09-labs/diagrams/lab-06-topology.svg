<text x="1096" y="395" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">DaemonSet pods from the policy</text>
<text x="1096" y="422" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">mofed-ubuntu22.04-ds (driver)</text>
<text x="1096" y="440" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">rdma-shared-dp-ds (device plugin)</text>
<text x="1096" y="458" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">kube-multus-ds, whereabouts, cni-plugins-ds</text>
</g>
<g><title>Host</title><rect x="1080" y="500" width="450" height="100" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1096" y="525" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Host</text>
<text x="1096" y="552" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">/dev/infiniband/* exposed to pods</text>
<text x="1096" y="570" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">allocatable rdma/rdma_shared_device_a: 63</text>
<text x="1096" y="588" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">/etc/cni/net.d/00-multus.conf, /opt/cni/bin/macvlan</text>
</g>
