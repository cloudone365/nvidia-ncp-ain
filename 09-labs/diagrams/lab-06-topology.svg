<path d="M1305,270 L1305,320" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" fill="none"/>
<line x1="1010" y1="680" x2="1060" y2="680" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" fill="none"/>
<text x="1035" y="662" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2f6fdb" text-anchor="middle" xml:space="preserve">RDMA</text>
<g><title>MacvlanNetwork rdma-net -&gt; NAD</title><rect x="48" y="520" width="400" height="220" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="64" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">MacvlanNetwork rdma-net -&gt; NAD</text>
<text x="64" y="574" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">kind: MacvlanNetwork</text>
<text x="64" y="592" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">spec: master &lt;rdma netdev&gt;</text>
<text x="64" y="610" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  mode bridge, mtu 9000</text>
<text x="64" y="628" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  ipam whereabouts 192.168.100.0/24</text>
<text x="64" y="646" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">status: rendered</text>
<text x="64" y="664" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">NetworkAttachmentDefinition</text>
<text x="64" y="682" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  in the pod namespace</text>
</g>
<g><title>Verify</title><rect x="48" y="780" width="1500" height="120" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="64" y="807" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Verify</text>
<text x="64" y="836" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">kubectl get nicclusterpolicy -o yaml (status conditions)  |  kubectl get node &lt;nic-node&gt; -o jsonpath='{.status.allocatable}'  |  kubectl exec perftest-client -- ibv_devinfo</text>
<text x="64" y="854" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Break/fix: wrong ifNames selector -&gt; allocatable 0, pods Pending 'Insufficient rdma/rdma_shared_device_a'; mechanics tier: DaemonSets 0 desired, policy notReady (read conditions)</text>
</g>
