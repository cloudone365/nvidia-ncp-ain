<g><title>step 1</title><circle cx="90.0" cy="240.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="90.0" y="246.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<text x="90.0" y="272.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2f6fdb" text-anchor="middle">reduce</text>
<text x="90.0" y="290.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2f6fdb" text-anchor="middle">up</text>
<g><title>step 2</title><circle cx="90.0" cy="330.0" r="16" fill="#6b7280" stroke="#ffffff" stroke-width="2"/><text x="90.0" y="336.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<text x="90.0" y="362.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5f6b7a" text-anchor="middle">broadcast</text>
<text x="90.0" y="380.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5f6b7a" text-anchor="middle">down</text>
<g><title>Half the buffer goes through each tree → every rank sends/receives ~S total, like ring, but in</title><rect x="48" y="650" width="740" height="81" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/></g>
<text x="60.0" y="677.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Half the buffer goes through each tree → every rank sends/receives ~S total, like ring, but in</text>
<text x="60.0" y="696.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">2·log₂(N) steps instead of 2·(N−1): at N = 1,024 that is 20 latency steps versus 2,046.</text>
<text x="60.0" y="715.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Leaves only send; roots only receive then send; interior ranks do both — the mirror tree balances it.</text>
<g><title>NCCL's tuner picks tree for small/medium messages and large rank counts (latency-bound),</title><rect x="812" y="650" width="740" height="81" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/></g>
<text x="824.0" y="677.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">NCCL's tuner picks tree for small/medium messages and large rank counts (latency-bound),</text>
<text x="824.0" y="696.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ring for large messages (bandwidth-bound). Log line:  Trees [0] 1/8/-1-&gt;0-&gt;-1 [1] 1/-1/-1-&gt;0-&gt;8</text>
<text x="824.0" y="715.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">= rank 0's children/parent per tree. NCCL_ALGO=Tree|Ring forces it — for testing only.</text>
<rect x="1100" y="790" width="452" height="92" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1116.0" y="818.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Legend</text>
<path d="M1116,846.0 L1162,846.0" fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="1176.0" y="852.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">① reduce: child → parent (partial sums)</text>
<path d="M1116,870.0 L1162,870.0" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1176.0" y="876.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">② broadcast: parent → child (result)</text>
<text x="800.0" y="765.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">Inter-node tree edges still ride NET/IB on rail n (PXN applies); intra-node edges use NVLink. SHARP moves this tree's reductions into the switch ASICs (Figure 1.3-5).</text>
</svg>
