<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Tree AllReduce: NCCL's double binary tree over 8 ranks">
<title>Tree AllReduce: NCCL's double binary tree over 8 ranks</title>
