<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="GPUDirect RDMA data path versus host bounce-buffer path">
<title>GPUDirect RDMA data path versus host bounce-buffer path</title>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a9c8a"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">GPUDirect RDMA data path versus host bounce-buffer path</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Same PCIe topology as a DGX H100: GPU and ConnectX-7 under one PCIe Gen5 switch; CPU root complex and DRAM above</text>
<g><title>CPU root complex (Xeon)</title><rect x="600" y="150" width="400" height="60" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/><text x="800.0" y="176.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">CPU root complex (Xeon)</text><text x="800.0" y="197.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">PCIe Gen5 root ports · IOMMU / ACS</text></g>
<g><title>Host DRAM</title><rect x="1100" y="150" width="300" height="60" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/><text x="1250.0" y="176.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Host DRAM</text><text x="1250.0" y="197.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">pinned bounce buffer</text></g>
<text x="1050.0" y="230.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">DDR5</text>
<g><title>PCIe Gen5 switch</title><rect x="600" y="300" width="400" height="60" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/><text x="800.0" y="326.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">PCIe Gen5 switch</text><text x="800.0" y="347.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">x16 up · x16 to GPU · x16 to NIC</text></g>
<path d="M800.0,210.0 L800.0,300.0" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g><title>GPU (H100, HBM3 80 GB)</title><rect x="250" y="460" width="360" height="80" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="430.0" y="496.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">GPU (H100, HBM3 80 GB)</text><text x="430.0" y="517.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">HBM pinned via nvidia-peermem / DMA-BUF</text></g>
<g><title>ConnectX-7 HCA</title><rect x="990" y="460" width="360" height="80" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/><text x="1170.0" y="496.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">ConnectX-7 HCA</text><text x="1170.0" y="517.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_n · DMA engine · 400G NDR port</text></g>
<path d="M430.0,460.0 L700.0,360.0" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1170.0,460.0 L900.0,360.0" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g><title>Leaf n QM9700</title><rect x="1420" y="460" width="130" height="80" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/><text x="1485.0" y="495.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Leaf n</text><text x="1485.0" y="514.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">QM9700</text></g>
<path d="M1350.0,500.0 L1420.0,500.0" fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M520.0,460.0 L520.0,420.0 L700.0,420.0 L700.0,360.0" fill="none" stroke="#2f6fdb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M900.0,360.0 L900.0,420.0 L1080.0,420.0 L1080.0,460.0" fill="none" stroke="#2f6fdb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<g><title>step 1</title><circle cx="610.0" cy="420.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="610.0" y="426.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<text x="800.0" y="450.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6fdb" text-anchor="middle">GDR: HCA DMAs HBM via the switch — 1 crossing, 0 copies</text>
<path d="M330.0,460.0 L330.0,330.0 L600.0,330.0" fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/>
<path d="M650.0,300.0 L650.0,210.0" fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/>
<path d="M1000.0,165.0 L1100.0,165.0" fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<path d="M1100.0,195.0 L1000.0,195.0" fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/>
<path d="M950.0,210.0 L950.0,300.0" fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/>
<path d="M1000.0,330.0 L1250.0,330.0 L1250.0,460.0" fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<g><title>step 2</title><circle cx="330.0" cy="400.0" r="16" fill="#d93025" stroke="#ffffff" stroke-width="2"/><text x="330.0" y="406.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<g><title>step 3</title><circle cx="650.0" cy="255.0" r="16" fill="#d93025" stroke="#ffffff" stroke-width="2"/><text x="650.0" y="261.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>step 4</title><circle cx="1050.0" cy="140.0" r="16" fill="#d93025" stroke="#ffffff" stroke-width="2"/><text x="1050.0" y="146.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<g><title>step 5</title><circle cx="1250.0" cy="400.0" r="16" fill="#d93025" stroke="#ffffff" stroke-width="2"/><text x="1250.0" y="406.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<text x="1290.0" y="405.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#d93025" text-anchor="start">bounce: 2 crossings + memcpy</text>
<g><title>Path A — GPUDirect RDMA (what you want)</title><rect x="48" y="590" width="740" height="260" rx="14" fill="#dbe8ff" fill-opacity="0.15" stroke="#2f6fdb" stroke-width="2.5" stroke-dasharray="10 6"/></g>
<text x="62.0" y="616.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2f6fdb" text-anchor="start">Path A — GPUDirect RDMA (what you want)</text>
<text x="70.0" y="640.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">① HCA reads/writes GPU HBM through the PCIe switch; the switch forwards peer-to-peer</text>
<text x="70.0" y="666.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   without the root complex ever seeing the TLPs (ACS must be OFF on the switch ports).</text>
<text x="70.0" y="692.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Requirements: nvidia-peermem loaded (or DMA-BUF: kernel ≥ 5.12, open GPU driver, rdma-core),</text>
<text x="70.0" y="718.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   GPU↔NIC distance ≤ NCCL_NET_GDR_LEVEL (PIX default on DGX), NCCL_NET_GDR_READ for sends.</text>
<text x="70.0" y="744.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Evidence: log line  via NET/IB/n/GDRDMA ;  busbw ≈ 93 % of 8 × 50 GB/s;  nvidia-smi topo -m = PIX.</text>
<text x="70.0" y="770.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">PCIe Gen5 x16 ≈ 64 GB/s per direction &gt; 50 GB/s NIC → the link, not PCIe, is the bottleneck.</text>
<g><title>Path B — bounce buffer (fallback, silently)</title><rect x="812" y="590" width="740" height="260" rx="14" fill="#ffd9d9" fill-opacity="0.12" stroke="#d93025" stroke-width="2.5" stroke-dasharray="10 6"/></g>
<text x="826.0" y="616.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#d93025" text-anchor="start">Path B — bounce buffer (fallback, silently)</text>
<text x="834.0" y="640.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">② GPU DMAs (cudaMemcpy) up through the switch to the root complex ③ into pinned host DRAM;</text>
<text x="834.0" y="666.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">④ CPU proxy thread posts the send; ⑤ HCA DMAs DRAM → root complex → switch → NIC.</text>
<text x="834.0" y="692.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Cost: 2 PCIe crossings per byte, CPU copies, extra latency; GPU↔NIC traffic now competes on the</text>
<text x="834.0" y="718.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   root-port x16 with everything else. Observed busbw ≈ half (≈ 190 GB/s instead of ≈ 370).</text>
<text x="834.0" y="744.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Triggers: nvidia_peermem missing, GPU/NIC pairing SYS or NODE, ACS enabled, container lacking</text>
<text x="834.0" y="770.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">   /dev/infiniband, or NCCL_NET_GDR_LEVEL too low. Log shows  via NET/IB/n  with no GDRDMA suffix.</text>
<rect x="48" y="150" width="380" height="116" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="64.0" y="178.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Legend</text>
<path d="M64,206.0 L110,206.0" fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="124.0" y="212.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Path A: GPUDirect RDMA</text>
<path d="M64,230.0 L110,230.0" fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="124.0" y="236.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Path B: host bounce buffer</text>
<path d="M64,254.0 L110,254.0" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-dark)"/>
<text x="124.0" y="260.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">PCIe links</text>
</svg>
