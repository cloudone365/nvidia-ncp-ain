<text x="267.4" y="568.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">c</text>
<path d="M246.1,359.7 L329.7,276.1" fill="none" stroke="#76b900" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="267.4" y="303.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">d</text>
<g><title>step 1</title><circle cx="400.0" cy="400.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="400.0" y="406.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><title>step 2</title><circle cx="400.0" cy="438.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="400.0" y="444.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<g><title>step 3</title><circle cx="400.0" cy="476.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="400.0" y="482.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<text x="400.0" y="686.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">each step: send 1 chunk right, receive 1 from the left, ADD into own copy</text>
<text x="1200.0" y="150.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Phase B — AllGather: 3 steps, chunk sent = S/4</text>
<g><title>GPU 0  (rank 0)</title><rect x="1130.0" y="208.0" width="140" height="64" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="1200.0" y="235.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GPU 0  (rank 0)</text><text x="1200.0" y="255.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_0 / NVLink</text></g>
<g><title>GPU 1  (rank 1)</title><rect x="1320.0" y="398.0" width="140" height="64" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="1390.0" y="425.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GPU 1  (rank 1)</text><text x="1390.0" y="445.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_1 / NVLink</text></g>
<g><title>GPU 2  (rank 2)</title><rect x="1130.0" y="588.0" width="140" height="64" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="1200.0" y="615.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GPU 2  (rank 2)</text><text x="1200.0" y="635.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_2 / NVLink</text></g>
<g><title>GPU 3  (rank 3)</title><rect x="940.0" y="398.0" width="140" height="64" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="1010.0" y="425.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GPU 3  (rank 3)</text><text x="1010.0" y="445.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_3 / NVLink</text></g>
<path d="M1270.3,276.1 L1353.9,359.7" fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1332.6" y="303.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">Σa</text>
<path d="M1353.9,500.3 L1270.3,583.9" fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1332.6" y="568.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">Σb</text>
<path d="M1129.7,583.9 L1046.1,500.3" fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1067.4" y="568.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">Σc</text>
<path d="M1046.1,359.7 L1129.7,276.1" fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1067.4" y="303.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">Σd</text>
<g><title>step 4</title><circle cx="1200.0" cy="400.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="1200.0" y="406.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<g><title>step 5</title><circle cx="1200.0" cy="438.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="1200.0" y="444.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<g><title>step 6</title><circle cx="1200.0" cy="476.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="1200.0" y="482.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<text x="1200.0" y="686.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">each step: forward the fully reduced chunk you just received</text>
<g><title>State after each step (GPU 0's buffer; Σ = sum over all 4 ranks)</title><rect x="48" y="700" width="1504" height="200" rx="14" fill="#fff5cc" fill-opacity="0.2" stroke="#c9a400" stroke-width="2.5" stroke-dasharray="10 6"/></g>
<text x="62.0" y="726.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#c9a400" text-anchor="start">State after each step (GPU 0's buffer; Σ = sum over all 4 ranks)</text>
<text x="70.0" y="740.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Step</text>
<text x="200.0" y="740.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">GPU0 holds</text>
<text x="520.0" y="740.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">What moved on every link</text>
<text x="1160.0" y="740.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Running total per GPU</text>
<text x="70.0" y="766.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">start</text>
<text x="200.0" y="766.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">a0 b0 c0 d0</text>
<text x="520.0" y="766.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">—</text>
<text x="1160.0" y="766.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">0</text>
<text x="70.0" y="790.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">① RS-1</text>
<text x="200.0" y="790.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">a0 b0 c0 d0+d3</text>
<text x="520.0" y="790.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">chunk d3→GPU0, a0→GPU1, b1→GPU2, c2→GPU3</text>
<text x="1160.0" y="790.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">S/4</text>
<text x="70.0" y="814.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">② RS-2</text>
<text x="200.0" y="814.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">a0 b0 c0+c2+c3 d0+d3</text>
<text x="520.0" y="814.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">2-way partial sums move one hop</text>
<text x="1160.0" y="814.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">2·S/4</text>
<text x="70.0" y="838.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">③ RS-3</text>
<text x="200.0" y="838.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">a0 Σb c0+c2+c3 d0+d3</text>
<text x="520.0" y="838.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">each GPU now owns ONE fully reduced chunk (GPU0: Σb)</text>
<text x="1160.0" y="838.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">3·S/4</text>
<text x="70.0" y="862.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">④–⑥ AG</text>
<text x="200.0" y="862.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Σa Σb Σc Σd</text>
<text x="520.0" y="862.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Σ-chunks forwarded around the ring</text>
<text x="1160.0" y="862.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">6·S/4 = 2·S·(N−1)/N</text>
<text x="800.0" y="925.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5f6b7a" text-anchor="middle">Bandwidth-optimal (every link busy both directions, busbw = algbw × 2(N−1)/N) but latency grows linearly: 2(N−1) steps — at N = 1,024 that is 2,046 hops of latency.</text>
<text x="800.0" y="950.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">NCCL runs many rings in parallel (one or more per NIC/NVLink lane); on a rail-optimized fabric PXN keeps each ring's inter-node hop on one rail.</text>
<rect x="665" y="360" width="270" height="92" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="681.0" y="388.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Legend</text>
<path d="M681,416.0 L727,416.0" fill="none" stroke="#76b900" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<text x="741.0" y="422.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">NVLink hop (intra-node)</text>
<path d="M681,440.0 L727,440.0" fill="none" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="741.0" y="446.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">NET/IB hop on rail n</text>
</svg>
