<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" role="img" aria-label="Ring AllReduce on 4 GPUs = ReduceScatter (steps 1–3) + AllGather (steps 4–6)">
<title>Ring AllReduce on 4 GPUs = ReduceScatter (steps 1–3) + AllGather (steps 4–6)</title>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a9c8a"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs>
<rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Ring AllReduce on 4 GPUs = ReduceScatter (steps 1–3) + AllGather (steps 4–6)</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Buffer split into N = 4 chunks a, b, c, d; each step every GPU sends one chunk right and receives one from the left</text>
<text x="400.0" y="150.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Phase A — ReduceScatter: 3 steps, chunk sent = S/4</text>
<g><title>GPU 0  (rank 0)</title><rect x="330.0" y="208.0" width="140" height="64" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="400.0" y="235.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GPU 0  (rank 0)</text><text x="400.0" y="255.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_0 / NVLink</text></g>
<g><title>GPU 1  (rank 1)</title><rect x="520.0" y="398.0" width="140" height="64" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="590.0" y="425.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GPU 1  (rank 1)</text><text x="590.0" y="445.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_1 / NVLink</text></g>
<g><title>GPU 2  (rank 2)</title><rect x="330.0" y="588.0" width="140" height="64" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="400.0" y="615.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GPU 2  (rank 2)</text><text x="400.0" y="635.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_2 / NVLink</text></g>
<g><title>GPU 3  (rank 3)</title><rect x="140.0" y="398.0" width="140" height="64" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/><text x="210.0" y="425.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">GPU 3  (rank 3)</text><text x="210.0" y="445.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">mlx5_3 / NVLink</text></g>
<path d="M470.3,276.1 L553.9,359.7" fill="none" stroke="#76b900" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="532.6" y="303.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">a</text>
<path d="M553.9,500.3 L470.3,583.9" fill="none" stroke="#76b900" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="532.6" y="568.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#1f2937" text-anchor="middle">b</text>
