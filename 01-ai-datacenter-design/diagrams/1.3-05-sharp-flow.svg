<text x="196.0" y="731.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2f6fdb" text-anchor="start">each rank receives the final Σ  (1 × S per link)</text>
<text x="800.0" y="790.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6fdb" text-anchor="middle">Data per link ≈ 1 × S instead of ≈ 2 × S (ring), and the number of steps does not grow with rank count.</text>
<text x="800.0" y="815.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">Streaming aggregation (SAT) on Quantum-2 handles large buffers; small-message latency gain is the headline. Does nothing for AllToAll.</text>
<g><title>Four pieces must all be present: sharp_am running with the SM (UFM), sharpd on every node, the CollNet plugin found by NCCL, and NCCL_COLLNET_ENABLE=1.</title><rect x="48" y="840" width="1504" height="62" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/></g>
<text x="60.0" y="867.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Four pieces must all be present: sharp_am running with the SM (UFM), sharpd on every node, the CollNet plugin found by NCCL, and NCCL_COLLNET_ENABLE=1.</text>
<text x="60.0" y="886.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Observe: NCCL log 'NET/Plugin: Loaded net plugin SHARP' and CollNet channels &gt; 0;  sharp_hello / sharp_benchmark.sh;  UFM shows the job's tree and AN usage.</text>
