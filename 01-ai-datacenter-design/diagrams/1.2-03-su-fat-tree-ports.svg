<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Every leaf: 32 × 400G down, 32 × 400G up (8 uplinks to each spine). Spine: 64 × 400G, all facing down</text>
