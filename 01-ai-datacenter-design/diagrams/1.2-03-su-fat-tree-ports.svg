<g><title>Oversubscription per leaf = downlink bw ÷ uplink bw = (32 × 400G) ÷ (32 × 400G) = 1 : 1  →  non-blocking.  Injection per SU = 256 × 400 Gb/s = 102.4 Tb/s = bisection through the 4 spines.</title><rect x="70" y="695" width="1460" height="81" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/></g>
<text x="82.0" y="722.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Oversubscription per leaf = downlink bw ÷ uplink bw = (32 × 400G) ÷ (32 × 400G) = 1 : 1  →  non-blocking.  Injection per SU = 256 × 400 Gb/s = 102.4 Tb/s = bisection through the 4 spines.</text>
<text x="82.0" y="741.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Scale-out: 2 SUs → 16 leaves, 512 uplinks ÷ 64 = 8 spines (4 uplinks per leaf per spine);  3–4 SUs → 768 / 1,024 uplinks → 16 spines (2 per leaf per spine at 4 SUs).</text>
<text x="82.0" y="760.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Two-tier limit with P-port switches = P²/2 = 64²/2 = 2,048 endpoints; the H100 RA stops at 4 SUs (1,024 compute ports) and adds a core tier beyond that.</text>
</svg>
