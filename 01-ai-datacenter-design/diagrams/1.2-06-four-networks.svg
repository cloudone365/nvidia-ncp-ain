<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="The four networks of a SuperPOD and what plugs into each">
<title>The four networks of a SuperPOD and what plugs into each</title>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a9c8a"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">The four networks of a SuperPOD and what plugs into each</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Per SU (as built: 31 DGX + 2 UFM). Separate switches, separate cables, separate failure domains</text>
<g><rect x="48" y="140" width="358" height="700" rx="14" fill="#dbe8ff" fill-opacity="0.18" stroke="#2f6fdb" stroke-width="2.5" stroke-dasharray="10 6"/></g>
<text x="227.0" y="178.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2f6fdb" text-anchor="middle">COMPUTE</text>
<g><title>QM9700 × 8 leaves + spines</title><rect x="64" y="196" width="326" height="66" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/><text x="227.0" y="224.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">QM9700 × 8 leaves + spines</text><text x="227.0" y="244.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">NDR 400G IB (or Spectrum-X SN5600)</text></g>
<text x="64.0" y="296.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Endpoints</text>
<path d="M227.0,378.0 L227.0,262.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
<g><title>31 DGX × 8 ConnectX-7</title><rect x="64" y="312" width="326" height="56" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/><text x="227.0" y="335.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">31 DGX × 8 ConnectX-7</text><text x="227.0" y="354.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">248 ports</text></g>
<g><title>2 × UFM appliances</title><rect x="64" y="378" width="326" height="56" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/><text x="227.0" y="401.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">2 × UFM appliances</text><text x="227.0" y="420.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">4 ports (the 32nd slot)</text></g>
<text x="64.0" y="560.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Carries</text>
<text x="64.0" y="584.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• NCCL / RDMA only</text>
<text x="64.0" y="608.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Lossless, 1:1, rail-optimized</text>
<text x="64.0" y="632.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• SM assigns LIDs; PKey partitions</text>
<text x="64.0" y="680.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Design rules</text>
<text x="64.0" y="704.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Failure domain = one rail per leaf</text>
<text x="64.0" y="728.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Optics + fiber (10–50 m runs)</text>
<text x="64.0" y="752.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Validate: iblinkinfo, ibdiagnet, nccl-tests</text>
<g><title>step 1</title><circle cx="227.0" cy="820.0" r="16" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="227.0" y="826.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><rect x="430" y="140" width="358" height="700" rx="14" fill="#d9f3f0" fill-opacity="0.18" stroke="#1a9c8a" stroke-width="2.5" stroke-dasharray="10 6"/></g>
<text x="609.0" y="178.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a9c8a" text-anchor="middle">STORAGE</text>
<g><title>QM9700 (IB) or SN5600 (RoCE)</title><rect x="446" y="196" width="326" height="66" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5"/><text x="609.0" y="224.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">QM9700 (IB) or SN5600 (RoCE)</text><text x="609.0" y="244.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">400G leaf-spine, ≈ 4:3 on DGX side</text></g>
<text x="446.0" y="296.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Endpoints</text>
<path d="M609.0,378.0 L609.0,262.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
<g><title>31 DGX × BlueField-3 port</title><rect x="446" y="312" width="326" height="56" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/><text x="609.0" y="335.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">31 DGX × BlueField-3 port</text><text x="609.0" y="354.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">31–62 ports</text></g>
<g><title>Storage servers (OSS/NSD)</title><rect x="446" y="378" width="326" height="56" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5"/><text x="609.0" y="401.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">Storage servers (OSS/NSD)</text><text x="609.0" y="420.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">sized for &gt; 40 GB/s per node</text></g>
<text x="446.0" y="560.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Carries</text>
<text x="446.0" y="584.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Lustre, GPFS, WEKA, VAST, NFS-RDMA</text>
<text x="446.0" y="608.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• GPUDirect Storage lands in HBM</text>
<text x="446.0" y="632.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Checkpoint bursts isolated here</text>
<text x="446.0" y="680.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Design rules</text>
<text x="446.0" y="704.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Many clients, normal flow mix</text>
<text x="446.0" y="728.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Modest oversubscription tolerated</text>
<text x="446.0" y="752.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Validate: fio / gdsio, mount, counters</text>
<g><title>step 2</title><circle cx="609.0" cy="820.0" r="16" fill="#1a9c8a" stroke="#ffffff" stroke-width="2"/><text x="609.0" y="826.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<g><rect x="812" y="140" width="358" height="700" rx="14" fill="#eeeeee" fill-opacity="0.18" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="10 6"/></g>
<text x="991.0" y="178.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#6b7280" text-anchor="middle">IN-BAND MGMT</text>
<g><title>SN4600C × 2 (64 × 100G)</title><rect x="828" y="196" width="326" height="66" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/><text x="991.0" y="224.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">SN4600C × 2 (64 × 100G)</text><text x="991.0" y="244.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">Routed Ethernet to the corporate network</text></g>
<text x="828.0" y="296.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Endpoints</text>
<path d="M991.0,444.0 L991.0,262.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
<g><title>31 DGX × BlueField-3 port</title><rect x="828" y="312" width="326" height="56" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/><text x="991.0" y="335.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">31 DGX × BlueField-3 port</text><text x="991.0" y="354.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">31 ports</text></g>
<g><title>BCM head nodes, login nodes</title><rect x="828" y="378" width="326" height="56" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/><text x="991.0" y="401.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">BCM head nodes, login nodes</text><text x="991.0" y="420.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">HA pair + logins</text></g>
<g><title>UFM web/API, storage mgmt</title><rect x="828" y="444" width="326" height="56" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/><text x="991.0" y="467.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">UFM web/API, storage mgmt</text><text x="991.0" y="486.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">a few ports</text></g>
<text x="828.0" y="560.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Carries</text>
<text x="828.0" y="584.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• PXE/BCM imaging, Slurm/K8s control</text>
<text x="828.0" y="608.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• SSH, Jupyter, registry pulls, Prometheus</text>
<text x="828.0" y="632.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Home directories over NFS</text>
<text x="828.0" y="680.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Design rules</text>
<text x="828.0" y="704.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Can be reconfigured without touching jobs</text>
<text x="828.0" y="728.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• NCCL bootstrap TCP rides here</text>
<text x="828.0" y="752.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Validate: cmsh device status, ping</text>
<g><title>step 3</title><circle cx="991.0" cy="820.0" r="16" fill="#6b7280" stroke="#ffffff" stroke-width="2"/><text x="991.0" y="826.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><rect x="1194" y="140" width="358" height="700" rx="14" fill="#eeeeee" fill-opacity="0.18" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="10 6"/></g>
<text x="1373.0" y="178.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#6b7280" text-anchor="middle">OOB MGMT</text>
<g><title>SN2201 × 3 (48 × 1G RJ45)</title><rect x="1210" y="196" width="326" height="66" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/><text x="1373.0" y="224.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">SN2201 × 3 (48 × 1G RJ45)</text><text x="1373.0" y="244.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">Isolated 1 GbE; never routed to users</text></g>
<text x="1210.0" y="296.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Endpoints</text>
<path d="M1373.0,444.0 L1373.0,262.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
<g><title>31 DGX BMCs</title><rect x="1210" y="312" width="326" height="56" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/><text x="1373.0" y="335.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">31 DGX BMCs</text><text x="1373.0" y="354.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">31 ports</text></g>
<g><title>Switch mgmt ports, all 4 fabrics</title><rect x="1210" y="378" width="326" height="56" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/><text x="1373.0" y="401.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">Switch mgmt ports, all 4 fabrics</text><text x="1373.0" y="420.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">≈ 20–30 ports</text></g>
<g><title>PDUs, storage controllers, UFM BMC</title><rect x="1210" y="444" width="326" height="56" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/><text x="1373.0" y="467.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">PDUs, storage controllers, UFM BMC</text><text x="1373.0" y="486.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5f6b7a" text-anchor="middle">≈ 20 ports</text></g>
<text x="1210.0" y="560.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Carries</text>
<text x="1210.0" y="584.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• IPMI / Redfish power &amp; console</text>
<text x="1210.0" y="608.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Switch CLI / NVUE / MLNX-OS mgmt</text>
<text x="1210.0" y="632.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• First network you bring up</text>
<text x="1210.0" y="680.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Design rules</text>
<text x="1210.0" y="704.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Separate PDU circuits from nodes</text>
<text x="1210.0" y="728.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Survives any compute/in-band outage</text>
<text x="1210.0" y="752.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">• Validate: ipmitool chassis power status</text>
<g><title>step 4</title><circle cx="1373.0" cy="820.0" r="16" fill="#6b7280" stroke="#ffffff" stroke-width="2"/><text x="1373.0" y="826.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<text x="800.0" y="870.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5f6b7a" text-anchor="middle">Bring-up order: ④ OOB → fabric switches + SM → ③ in-band / BCM → nodes → ① compute validation. Compute and storage never share a NIC or a switch buffer.</text>
</svg>
