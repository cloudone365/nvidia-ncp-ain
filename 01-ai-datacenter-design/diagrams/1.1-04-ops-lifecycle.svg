<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Operations lifecycle: bring-up → validate → monitor → remediate">
<title>Operations lifecycle: bring-up → validate → monitor → remediate</title>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a9c8a"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Operations lifecycle: bring-up → validate → monitor → remediate</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Bottom-up ordering is testable: OOB first, SM before nodes, physical layer before collectives</text>
<g><rect x="48" y="160" width="360" height="430" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="3"/></g>
<text x="228.0" y="200.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">1  BRING-UP</text>
<line x1="68" y1="218" x2="388" y2="218" stroke="#6b7280" stroke-width="2"/>
<text x="64.0" y="250.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">① OOB first: SN2201, BMCs, switch mgmt, PDUs</text>
<text x="64.0" y="278.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">② Switch OS + firmware at RA versions</text>
<text x="64.0" y="306.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">③ Fabric manager: UFM/opensm → LIDs, routes</text>
<text x="64.0" y="334.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">     (Spectrum-X: BGP underlay, PFC/ECN, AR)</text>
<text x="64.0" y="362.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">④ BCM: PXE, DGX OS, CUDA, DOCA-OFED, NCCL</text>
<text x="64.0" y="390.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">⑤ mlxconfig: LINK_TYPE, SRIOV_EN, NUM_OF_VFS</text>
<text x="64.0" y="440.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Tools (exam names)</text>
<g><title>ipmitool</title><rect x="64" y="458" width="92" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">ipmitool</text></g>
<g><title>cmsh</title><rect x="166" y="458" width="56" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="194.0" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">cmsh</text></g>
<g><title>sminfo</title><rect x="232" y="458" width="74" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="269.0" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">sminfo</text></g>
<g><title>mlxconfig</title><rect x="64" y="498" width="101" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="114.5" y="517.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">mlxconfig</text></g>
<g><title>nv config apply</title><rect x="175" y="498" width="155" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="252.5" y="517.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">nv config apply</text></g>
<path d="M408.0,410.0 L429.0,410.0" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
<g><title>step 1</title><circle cx="228.0" cy="630.0" r="18" fill="#6b7280" stroke="#ffffff" stroke-width="2"/><text x="228.0" y="636.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><rect x="429" y="160" width="360" height="430" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="3"/></g>
<text x="609.0" y="200.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">2  VALIDATE</text>
<line x1="449" y1="218" x2="769" y2="218" stroke="#2f6fdb" stroke-width="2"/>
<text x="445.0" y="250.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Physical: mlxlink -e (BER, eye), mlxcables</text>
<text x="445.0" y="278.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Topology: ibnetdiscover, ibdiagnet, NetQ</text>
<text x="445.0" y="306.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">P2P RDMA: ib_write_bw ≥ ~390 Gb/s,</text>
<text x="445.0" y="334.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">     ib_write_lat ≈ 2 µs one hop</text>
<text x="445.0" y="362.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Collectives: all_reduce_perf busbw ≥ 85 %</text>
<text x="445.0" y="390.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Full stack: CVT / HPL 24 h, nodes within ±5 %</text>
<text x="445.0" y="440.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Tools (exam names)</text>
<g><title>mlxlink</title><rect x="445" y="458" width="83" height="30" rx="6" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><text x="486.5" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">mlxlink</text></g>
<g><title>ibdiagnet</title><rect x="538" y="458" width="101" height="30" rx="6" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><text x="588.5" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">ibdiagnet</text></g>
<g><title>ib_write_bw</title><rect x="649" y="458" width="119" height="30" rx="6" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><text x="708.5" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">ib_write_bw</text></g>
<g><title>all_reduce_perf</title><rect x="445" y="498" width="155" height="30" rx="6" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><text x="522.5" y="517.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">all_reduce_perf</text></g>
<g><title>CVT</title><rect x="610" y="498" width="47" height="30" rx="6" fill="#ffffff" stroke="#2f6fdb" stroke-width="1.5"/><text x="633.5" y="517.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">CVT</text></g>
<path d="M789.0,410.0 L810.0,410.0" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
<g><title>step 2</title><circle cx="609.0" cy="630.0" r="18" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="609.0" y="636.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<g><rect x="810" y="160" width="360" height="430" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="3"/></g>
<text x="990.0" y="200.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">3  MONITOR</text>
<line x1="830" y1="218" x2="1150" y2="218" stroke="#e07b00" stroke-width="2"/>
<text x="826.0" y="250.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">UFM: link errors, congestion, SM events</text>
<text x="826.0" y="278.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">NetQ + WJH: drop reason, buffers, ECN marks</text>
<text x="826.0" y="306.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">DCGM: GPU / NVLink / NIC counters</text>
<text x="826.0" y="334.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">BCM dashboards, Prometheus, Slurm metrics</text>
<text x="826.0" y="362.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Scheduled ibdiagnet diffed against baseline</text>
<text x="826.0" y="390.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Alert on BER / symbol errors, not link state</text>
<text x="826.0" y="440.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Tools (exam names)</text>
<g><title>UFM</title><rect x="826" y="458" width="47" height="30" rx="6" fill="#ffffff" stroke="#e07b00" stroke-width="1.5"/><text x="849.5" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">UFM</text></g>
<g><title>NetQ / WJH</title><rect x="883" y="458" width="110" height="30" rx="6" fill="#ffffff" stroke="#e07b00" stroke-width="1.5"/><text x="938.0" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">NetQ / WJH</text></g>
<g><title>dcgmi</title><rect x="1003" y="458" width="65" height="30" rx="6" fill="#ffffff" stroke="#e07b00" stroke-width="1.5"/><text x="1035.5" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">dcgmi</text></g>
<g><title>ibdiagnet</title><rect x="826" y="498" width="101" height="30" rx="6" fill="#ffffff" stroke="#e07b00" stroke-width="1.5"/><text x="876.5" y="517.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">ibdiagnet</text></g>
<path d="M1170.0,410.0 L1191.0,410.0" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
<g><title>step 3</title><circle cx="990.0" cy="630.0" r="18" fill="#e07b00" stroke="#ffffff" stroke-width="2"/><text x="990.0" y="636.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><rect x="1191" y="160" width="360" height="430" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="3"/></g>
<text x="1371.0" y="200.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">4  REMEDIATE</text>
<line x1="1211" y1="218" x2="1531" y2="218" stroke="#d93025" stroke-width="2"/>
<text x="1207.0" y="250.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Straggler hunt: ibstat Rate ≠ 400, mlxlink BER</text>
<text x="1207.0" y="278.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Bisect with 2-node all_reduce_perf</text>
<text x="1207.0" y="306.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Reseat / replace optic; recable wrong rail</text>
<text x="1207.0" y="334.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Firmware roll, mlxconfig fix, driver pin</text>
<text x="1207.0" y="362.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">A slow (high-BER) link is worse than a dead</text>
<text x="1207.0" y="390.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">     link: the SM routes around dead only</text>
<text x="1207.0" y="440.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Tools (exam names)</text>
<g><title>ibstat</title><rect x="1207" y="458" width="74" height="30" rx="6" fill="#ffffff" stroke="#d93025" stroke-width="1.5"/><text x="1244.0" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">ibstat</text></g>
<g><title>mlxlink</title><rect x="1291" y="458" width="83" height="30" rx="6" fill="#ffffff" stroke="#d93025" stroke-width="1.5"/><text x="1332.5" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">mlxlink</text></g>
<g><title>mlxcables</title><rect x="1384" y="458" width="101" height="30" rx="6" fill="#ffffff" stroke="#d93025" stroke-width="1.5"/><text x="1434.5" y="477.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">mlxcables</text></g>
<g><title>nccl-tests</title><rect x="1207" y="498" width="110" height="30" rx="6" fill="#ffffff" stroke="#d93025" stroke-width="1.5"/><text x="1262.0" y="517.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">nccl-tests</text></g>
<g><title>step 4</title><circle cx="1371.0" cy="630.0" r="18" fill="#d93025" stroke="#ffffff" stroke-width="2"/><text x="1371.0" y="636.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<text x="418.5" y="146.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">gate: SM master, all nodes UP</text>
<text x="799.5" y="146.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">gate: CVT clean, baseline saved</text>
<text x="1180.5" y="146.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">trigger: alert or busbw drop</text>
<path d="M1371.0,660.0 L1371.0,700.0 L609.0,700.0 L609.0,652.0" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="986.0" y="688.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6b7280" text-anchor="middle">re-run the validation ladder after every fix</text>
<text x="800.0" y="790.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#5f6b7a" text-anchor="middle">Pass criteria are numbers or states (Rate 400, 4X, Effective Physical Errors 0, GDRDMA, busbw ≥ 85 %) — never "looks fine".</text>
<text x="800.0" y="820.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">Order is the exam trap: OOB → switches/SM → BCM → NIC config → validation. Monitoring feeds remediation; remediation re-enters validation.</text>
</svg>
