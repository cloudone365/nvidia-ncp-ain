<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" role="img">
<title>BFB install over RShim: host → /dev/rshim0/boot → BlueField boot → Arm OS + NIC firmware</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">BFB install over RShim: host → /dev/rshim0/boot → BlueField boot → Arm OS + NIC firmware</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">bfb-install streams the BFB (bootloader + kernel + rootfs + optional firmware) into the card; bf.cfg customises first boot; console shows progress</text>
<g><title>Host (x86) rshim driver, bfb-install</title><rect x="70" y="150" width="300" height="70" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="220.0" y="179.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Host (x86)</text>
<text x="220.0" y="200.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">rshim driver, bfb-install</text>
</g>
<g><title>/dev/rshim0 boot · console · misc</title><rect x="470" y="150" width="260" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="600.0" y="179.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">/dev/rshim0</text>
<text x="600.0" y="200.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">boot · console · misc</text>
</g>
<g><title>BlueField-3 boot ROM / ATF / UEFI BL2 → BL31 → UEFI</title><rect x="850" y="150" width="300" height="70" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1000.0" y="179.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">BlueField-3 boot ROM / ATF / UEFI</text>
<text x="1000.0" y="199.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">BL2 → BL31 → UEFI</text>
</g>
<g><title>Arm OS (Ubuntu BSP) eMMC / NVMe</title><rect x="1250" y="150" width="260" height="70" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1380.0" y="179.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Arm OS (Ubuntu BSP)</text>
<text x="1380.0" y="200.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">eMMC / NVMe</text>
</g>
<line x1="220" y1="220" x2="220" y2="930" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="600" y1="220" x2="600" y2="930" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1000" y1="220" x2="1000" y2="930" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1380" y1="220" x2="1380" y2="930" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>
<g><title>mst status -v → /dev/mst/mt41692_pciconf0 · cat /dev/rshim0/misc (BOOT_MODE, DEV_NAME)</title><rect x="20" y="256" width="400" height="48" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="220.0" y="283.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">mst status -v → /dev/mst/mt41692_pciconf0 · cat /dev/rshim0/misc (BOOT_MODE, DEV_NAME)</text>
</g>
<g><title>Step 1</title><circle cx="-5" cy="280" r="16" fill="#1f2937"/><text x="-5" y="286" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><title>bf.cfg: ubuntu_PASSWORD='&lt;sha-512 hash&gt;' (+ cloud-init user-data, BMC/OOB options)</title><rect x="20" y="326" width="400" height="48" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="220.0" y="353.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">bf.cfg: ubuntu_PASSWORD='&lt;sha-512 hash&gt;' (+ cloud-init user-data, BMC/OOB options)</text>
</g>
<g><title>Step 2</title><circle cx="-5" cy="350" r="16" fill="#1f2937"/><text x="-5" y="356" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<line x1="220" y1="420" x2="600" y2="420" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="410.0" y="442.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">bfb-install --bfb DOCA_2.x_BSP_4.x_Ubuntu_22.04.prod.bfb --config bf.cfg --rshim rshim0</text>
<g><title>Step 3</title><circle cx="250" cy="396" r="16" fill="#1f2937"/><text x="250" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<line x1="600" y1="490" x2="1000" y2="490" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="800.0" y="512.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">'Pushing bfb' 1.12 GiB over PCIe tmfifo → card reset into rshim boot (BOOT_MODE 0)</text>
<g><title>Step 4</title><circle cx="630" cy="466" r="16" fill="#1f2937"/><text x="630" y="472" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<line x1="1000" y1="560" x2="600" y2="560" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="800.0" y="582.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">console: INFO[BL2]: start · INFO[BL31]: start · INFO[UEFI]: eMMC init</text>
<g><title>Step 5</title><circle cx="970" cy="536" r="16" fill="#1f2937"/><text x="970" y="542" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<line x1="1000" y1="630" x2="1380" y2="630" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1190.0" y="652.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">INFO[MISC]: Ubuntu installation started → Installing OS image → writes rootfs to eMMC, applies bf.cfg</text>
<g><title>Step 6</title><circle cx="1030" cy="606" r="16" fill="#1f2937"/><text x="1030" y="612" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<g><title>INFO[MISC]: Updating NIC firmware… → NIC firmware update done (if BFB carries it)</title><rect x="1180" y="676" width="400" height="48" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1380.0" y="703.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">INFO[MISC]: Updating NIC firmware… → NIC firmware update done (if BFB carries it)</text>
</g>
<g><title>Step 7</title><circle cx="1155" cy="700" r="16" fill="#1f2937"/><text x="1155" y="706" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<line x1="1380" y1="770" x2="220" y2="770" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="800.0" y="792.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">INFO[MISC]: Installation finished → Rebooting… (now BOOT_MODE 1 = eMMC)</text>
<g><title>Step 8</title><circle cx="1350" cy="746" r="16" fill="#1f2937"/><text x="1350" y="752" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g>
<line x1="220" y1="840" x2="1380" y2="840" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="800.0" y="862.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">ssh ubuntu@192.168.100.2 over tmfifo_net0 (host 192.168.100.1) · cat /etc/mlnx-release · ip -br link</text>
<g><title>Step 9</title><circle cx="250" cy="816" r="16" fill="#1f2937"/><text x="250" y="822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">9</text></g>
<g><title>Note</title><rect x="60" y="905" width="1000" height="80" rx="6" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="72" y="927" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Alternatives: BMC Redfish (no host cooperation; works in restricted mode) · RShim over USB-C · DPF at scale (discovers BMCs, installs BFBs, applies flavors).</text>
<text x="72" y="945" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Gotcha: no /dev/rshim0 → driver not loaded or host is restricted; 'Installation finished' + firmware lines = what good looks like.</text>
<g><title>Legend</title><rect x="1110" y="905" width="430" height="82" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="931" x2="1184" y2="931" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1198" y="937" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Management / telemetry</text>
<line x1="1124" y1="961" x2="1184" y2="961" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1198" y="967" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (BGP / EVPN / REST / Ansible)</text>
</g>
</svg>
