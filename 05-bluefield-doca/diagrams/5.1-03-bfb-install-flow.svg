<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="100%" role="img">
<title>BFB install over RShim: host → /dev/rshim0/boot → Arm</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1160" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">BFB install over RShim: host → /dev/rshim0/boot → Arm</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">bfb-install streams one file (bootloaders + kernel + rootfs + optional NIC firmware); bf.cfg customises first boot</text>
<g><title>Host (x86)</title>
<rect x="50.0" y="150" width="340" height="80" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="220" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Host (x86)</text>
<text x="220" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">rshim driver, bfb-install</text>
</g>
<line x1="220" y1="230" x2="220" y2="1000" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
<g><title>/dev/rshim0</title>
<rect x="470.0" y="150" width="300" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="620" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">/dev/rshim0</text>
<text x="620" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">boot · console · misc</text>
</g>
<line x1="620" y1="230" x2="620" y2="1000" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
<g><title>BlueField boot chain</title>
<rect x="840.0" y="150" width="320" height="80" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1000" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">BlueField boot chain</text>
<text x="1000" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">BL2 → BL31 → UEFI</text>
</g>
<line x1="1000" y1="230" x2="1000" y2="1000" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
<g><title>Arm OS (BSP)</title>
<rect x="1220.0" y="150" width="320" height="80" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1380" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Arm OS (BSP)</text>
<text x="1380" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">eMMC / NVMe</text>
</g>
<line x1="1380" y1="230" x2="1380" y2="1000" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
<g><title>mst status -v → mt41692</title>
<rect x="40" y="262" width="360" height="64" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="220" y="288" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">mst status -v → mt41692</text>
<text x="220" y="310" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">cat /dev/rshim0/misc (DEV_NAME)</text>
</g>
<g><title>Step 1</title><circle cx="426" cy="294" r="16" fill="#1f2937"/>
<text x="426" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><title>bf.cfg: ubuntu_PASSWORD hash,</title>
<rect x="40" y="342" width="360" height="64" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="220" y="368" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">bf.cfg: ubuntu_PASSWORD hash,</text>
<text x="220" y="390" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">cloud-init user-data, OOB / BMC</text>
</g>
<g><title>Step 2</title><circle cx="426" cy="374" r="16" fill="#1f2937"/>
<text x="426" y="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<polyline points="220,470 620,470" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>Step 3</title><circle cx="244" cy="446" r="16" fill="#1f2937"/>
<text x="244" y="452" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<text x="270" y="458" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">--config bf.cfg --rshim rshim0</text>
<text x="270" y="458" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">--config bf.cfg --rshim rshim0</text>
<text x="270" y="436" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">bfb-install --bfb &lt;x&gt;.bfb</text>
<text x="270" y="436" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">bfb-install --bfb &lt;x&gt;.bfb</text>
<polyline points="620,550 1000,550" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>Step 4</title><circle cx="644" cy="526" r="16" fill="#1f2937"/>
<text x="644" y="532" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<text x="670" y="538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">SW reset → boot from RShim</text>
<text x="670" y="538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">SW reset → boot from RShim</text>
<text x="670" y="516" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">stream ≈1.1 GiB over PCIe;</text>
<text x="670" y="516" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">stream ≈1.1 GiB over PCIe;</text>
<polyline points="1000,620 620,620" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>Step 5</title><circle cx="644" cy="596" r="16" fill="#1f2937"/>
<text x="644" y="602" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<text x="670" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">console: BL2 · BL31 · UEFI start</text>
<text x="670" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">console: BL2 · BL31 · UEFI start</text>
<polyline points="1000,700 1380,700" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>Step 6</title><circle cx="1024" cy="676" r="16" fill="#1f2937"/>
<text x="1024" y="682" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<text x="1050" y="688" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">write rootfs, apply bf.cfg</text>
<text x="1050" y="688" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">write rootfs, apply bf.cfg</text>
<text x="1050" y="666" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">installer: partition eMMC,</text>
<text x="1050" y="666" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">installer: partition eMMC,</text>
<g><title>Updating NIC firmware…</title>
<rect x="1200" y="730" width="352" height="64" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1376" y="756" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">Updating NIC firmware…</text>
<text x="1376" y="778" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">NIC firmware update done</text>
</g>
<g><title>Step 7</title><circle cx="1174" cy="762" r="16" fill="#1f2937"/>
<text x="1174" y="768" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<polyline points="1380,860 220,860" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>Step 8</title><circle cx="244" cy="836" r="16" fill="#1f2937"/>
<text x="244" y="842" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g>
<text x="270" y="848" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">Installation finished → Rebooting (BOOT_MODE 1 = eMMC)</text>
<text x="270" y="848" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Installation finished → Rebooting (BOOT_MODE 1 = eMMC)</text>
<polyline points="220,940 1380,940" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>Step 9</title><circle cx="244" cy="916" r="16" fill="#1f2937"/>
<text x="244" y="922" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">9</text></g>
<text x="270" y="928" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">ssh ubuntu@192.168.100.2 over tmfifo_net0 · cat /etc/mlnx-release</text>
<text x="270" y="928" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ssh ubuntu@192.168.100.2 over tmfifo_net0 · cat /etc/mlnx-release</text>
<g><title>Alternatives: BMC Redfish push (no host needed; works in restricted mode) · RShim over USB</title>
<rect x="48" y="1020" width="1000" height="110" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="62" y="1058" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Alternatives: BMC Redfish push (no host needed; works in restricted mode) · RShim over USB</text>
<text x="62" y="1080" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">At scale: DPF discovers BMCs, installs BFBs, applies flavors declaratively</text>
<text x="62" y="1102" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">No /dev/rshim0 → driver not loaded, or host restricted by mlxprivhost</text>
</g>
<g><title>Legend</title><rect x="1100" y="1030" width="452" height="84" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1116" y1="1056" x2="1176" y2="1056" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1192" y="1062" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Management (RShim / console)</text>
<line x1="1116" y1="1086" x2="1176" y2="1086" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1192" y="1092" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control (SSH)</text>
</g>
