<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img">
<title>HBN (Host-Based Networking) on the DPU: a Cumulus-like leaf inside the server</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">HBN (Host-Based Networking) on the DPU: a Cumulus-like leaf inside the server</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">FRR + NVUE in a DOCA container on the Arm; BGP unnumbered to the real leaf; VXLAN/EVPN terminates on the DPU; the host just sees a NIC</text>
<g><title>DGX / GPU server</title><rect x="60" y="150" width="760" height="620" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="74" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">DGX / GPU server</text>
<g><title>Host OS ens3f0np0 = plain NIC</title><rect x="90" y="200" width="320" height="90" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="250.0" y="229.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Host OS</text>
<text x="250.0" y="250.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">ens3f0np0 = plain NIC</text>
<text x="250.0" y="275.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">10.100.1.10/24 or /32 routed; no BGP, no VXLAN here</text>
</g>
<g><title>BlueField-3 (DPU mode)</title><rect x="90" y="330" width="700" height="410" rx="12" fill="#e9ddff" fill-opacity="0.55" stroke="#7a3fd1" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="104" y="358" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">BlueField-3 (DPU mode)</text>
<g><title>pf0hpf (host PF rep) + pf0vfN</title><rect x="120" y="380" width="300" height="90" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="270.0" y="419.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">pf0hpf (host PF rep)</text>
<text x="270.0" y="439.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">+ pf0vfN</text>
</g>
<g><title>p0_sf / p1_sf SFs the HBN bf.cfg creates</title><rect x="470" y="380" width="300" height="90" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="620.0" y="419.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">p0_sf / p1_sf</text>
<text x="620.0" y="439.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">SFs the HBN bf.cfg creates</text>
</g>
<g><title>HBN container (doca_hbn, kubelet-managed) nv set … — same NVUE as a Spectrum switch</title><rect x="120" y="510" width="650" height="200" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="445.0" y="570.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">HBN container (doca_hbn, kubelet-managed)</text>
<text x="445.0" y="590.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">nv set … — same NVUE as a Spectrum switch</text>
<text x="445.0" y="614.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv set interface lo ip address 10.0.1.11/32 · nv set router bgp autonomous-system 65111</text>
<text x="445.0" y="630.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv set vrf default router bgp neighbor p0_sf remote-as external  (unnumbered to the leaf)</text>
<text x="445.0" y="646.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv set nve vxlan source address 10.0.1.11 · nv set vrf tenantA evpn vni 100100</text>
<text x="445.0" y="662.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">FRR decisions → DOCA Flow / OVS → ConnectX eswitch: forwarding at line rate</text>
</g>
<line x1="250" y1="290" x2="250" y2="380" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
<g><title>Step 1</title><circle cx="215" cy="335" r="16" fill="#1f2937"/><text x="215" y="341" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<line x1="270" y1="470" x2="270" y2="510" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<g><title>Step 2</title><circle cx="235" cy="490" r="16" fill="#1f2937"/><text x="235" y="496" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<line x1="620" y1="470" x2="620" y2="510" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<g><title>Step 3</title><circle cx="585" cy="490" r="16" fill="#1f2937"/><text x="585" y="496" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>leaf01 (SN5600, Cumulus) AS 65011 · BGP unnumbered on swp1s0</title><rect x="900" y="330" width="420" height="130" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1110.0" y="371.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">leaf01 (SN5600, Cumulus)</text>
<text x="1110.0" y="392.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">AS 65011 · BGP unnumbered on swp1s0</text>
<text x="1110.0" y="417.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">sees the DPU as a BGP peer</text>
<text x="1110.0" y="433.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">learns 10.0.1.11/32 (+ tenant Type-5 routes)</text>
</g>
<line x1="770" y1="420" x2="900" y2="400" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<rect x="748" y="357" width="173" height="23" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="835" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">eBGP unnumbered · EVPN</text>
<line x1="770" y1="440" x2="900" y2="440" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
<rect x="795" y="455" width="80" height="23" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="835" y="470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">p0 · 400G</text>
<g><title>spines AS 65000</title><rect x="1380" y="330" width="160" height="130" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1460.0" y="389.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">spines</text>
<text x="1460.0" y="409.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">AS 65000</text>
</g>
<line x1="1320" y1="395" x2="1380" y2="395" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<g><title>Why HBN in AI clouds </title><rect x="900" y="520" width="640" height="110" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5"/>
<text x="1220.0" y="552.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Why HBN in AI clouds</text>
<text x="1220.0" y="598.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">L3 boundary moves into the server: each node advertises its /32, no L2/MLAG on leaves</text>
<text x="1220.0" y="613.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">tenant VRF/VNI starts at the DPU; host cannot tamper (restricted mode); one NVUE skill set</text>
</g>
<g><title>Verify (inside the container) nv show vrf default router bgp neighbor → Established to leaf01</title><rect x="900" y="660" width="640" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1220.0" y="694.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Verify (inside the container)</text>
<text x="1220.0" y="714.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">nv show vrf default router bgp neighbor → Established to leaf01</text>
</g>
<g><title>Legend</title><rect x="1110" y="780" width="430" height="82" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="806" x2="1184" y2="806" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1198" y="812" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
<line x1="1124" y1="836" x2="1184" y2="836" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1198" y="842" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (BGP / EVPN / REST / Ansible)</text>
</g>
<text x="60" y="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">1 host PF frames land on the representor   2 HBN routes/encapsulates them (VRF, VXLAN)   3 egress via the SF to p0; FRR routes are offloaded to the eswitch</text>
</svg>
