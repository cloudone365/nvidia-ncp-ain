<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" role="img">
<title>The SuperNIC's role in Spectrum-X: the NIC half of a pair</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">The SuperNIC's role in Spectrum-X: the NIC half of a pair</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Switch sprays (AR) and stamps telemetry; SuperNIC places out-of-order packets (DDP) and sets rate (DPA CC)</text>
<g><title>DGX node: 8× BlueField-3 SuperNIC</title>
<rect x="48" y="150" width="560" height="170" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="328" y="205" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">DGX node: 8× BlueField-3 SuperNIC</text>
<text x="328" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">NIC mode · 400G each · rail n → leaf n</text>
<text x="328" y="257" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">INTERNAL_CPU_OFFLOAD_ENGINE=1</text>
<text x="328" y="279" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">CNP_DSCP_P1=48 CNP_802P_PRIO_P1=6</text>
</g>
<g><title>SN5600 leaf / spine (Spectrum-4)</title>
<rect x="1000" y="150" width="552" height="170" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1276" y="205" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">SN5600 leaf / spine (Spectrum-4)</text>
<text x="1276" y="234" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv set qos roce</text>
<text x="1276" y="257" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv set router adaptive-routing enable on</text>
<text x="1276" y="279" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">per-uplink AR, threshold 70 %</text>
</g>
<polyline points="608,205 1000,205" fill="none" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 1</title><circle cx="632" cy="181" r="16" fill="#1f2937"/>
<text x="632" y="187" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<text x="658" y="193" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">RoCEv2 UDP 4791, DSCP 26 → SP3</text>
<text x="658" y="193" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">RoCEv2 UDP 4791, DSCP 26 → SP3</text>
<polyline points="1000,285 608,285" fill="none" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 2</title><circle cx="632" cy="261" r="16" fill="#1f2937"/>
<text x="632" y="267" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<text x="658" y="273" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">same flow returns out of order (AR)</text>
<text x="658" y="273" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">same flow returns out of order (AR)</text>
<g><title>Direct Data Placement</title>
<rect x="48" y="380" width="355" height="160" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="226" y="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Direct Data Placement</text>
<text x="226" y="459" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">each packet written to its</text>
<text x="226" y="482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">final GPU / host address;</text>
<text x="226" y="504" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">no reorder buffer, no NAK</text>
</g>
<g><title>DPA congestion control</title>
<rect x="427" y="380" width="355" height="160" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="604" y="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">DPA congestion control</text>
<text x="604" y="459" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Spectrum-X CC on DPA cores;</text>
<text x="604" y="482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">rate per flow from in-band</text>
<text x="604" y="504" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">switch telemetry</text>
</g>
<g><title>Performance isolation</title>
<rect x="806" y="380" width="355" height="160" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="984" y="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Performance isolation</text>
<text x="984" y="459" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">per-QP / per-flow rate limits</text>
<text x="984" y="482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">throttle the noisy flow,</text>
<text x="984" y="504" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">not the shared port</text>
</g>
<g><title>GPUDirect RDMA</title>
<rect x="1185" y="380" width="355" height="160" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="1362" y="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">GPUDirect RDMA</text>
<text x="1362" y="459" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">NIC DMA into GPU memory;</text>
<text x="1362" y="482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">NCCL_IB_TC=106 marks</text>
<text x="1362" y="504" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">DSCP 26 (TOS = DSCP×4+ECT)</text>
</g>
<g><title>Step 3</title><circle cx="70" cy="358" r="16" fill="#1f2937"/>
<text x="70" y="364" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>Step 4</title><circle cx="449" cy="358" r="16" fill="#1f2937"/>
<text x="449" y="364" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<g><title>Without a SuperNIC (ConnectX-6 / third-party)</title>
<rect x="48" y="590" width="740" height="170" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="418" y="645" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Without a SuperNIC (ConnectX-6 / third-party)</text>
<text x="418" y="674" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">AR reordering looks like loss → NAK → go-back-N</text>
<text x="418" y="697" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ethtool -S: out_of_sequence climbs, bandwidth drops</text>
<text x="418" y="719" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Fix: disable AR on those uplinks, or replace the NIC</text>
</g>
<g><title>With a SuperNIC (Spectrum-X)</title>
<rect x="812" y="590" width="740" height="170" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5"/>
<text x="1182" y="645" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">With a SuperNIC (Spectrum-X)</text>
<text x="1182" y="674" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">out_of_sequence rises with NO throughput loss</text>
<text x="1182" y="697" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">PFC rarely fires; ib_write_bw ≈ 390 Gb/s at 400G</text>
<text x="1182" y="719" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Verify: nv show router adaptive-routing on the switch</text>
</g>
<g><title>Same silicon as the DPU: SuperNICs run NIC mode on the east-west GPU fabric,</title>
<rect x="48" y="800" width="980" height="160" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="62" y="852" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Same silicon as the DPU: SuperNICs run NIC mode on the east-west GPU fabric,</text>
<text x="62" y="874" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">while DPUs in the same servers handle north-south / storage (OVS, HBN, SNAP).</text>
<text x="62" y="896" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Host: doca-ofed, mlnx_qos trust dscp + PFC 3, ECN sysfs, CNP firmware params.</text>
<text x="62" y="918" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Switch: RoCE profile + AR. Telemetry: DTS on the card, NetQ / WJH on the switch.</text>
</g>
<g><title>Legend</title><rect x="1060" y="800" width="492" height="144" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1076" y1="826" x2="1136" y2="826" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1152" y="832" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
<rect x="1076" y="846" width="60" height="20" rx="4" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2"/>
<text x="1152" y="862" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">SuperNIC function</text>
<rect x="1076" y="876" width="60" height="20" rx="4" fill="#ffd9d9" stroke="#d93025" stroke-width="2"/>
<text x="1152" y="892" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Mismatched pair</text>
<rect x="1076" y="906" width="60" height="20" rx="4" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2"/>
<text x="1152" y="922" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Matched pair</text>
</g>
</svg>
