<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" role="img">
<title>DOCA Telemetry Service (DTS): NIC / RoCE / DPA counters exported from the Arm</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">DOCA Telemetry Service (DTS): NIC / RoCE / DPA counters exported from the Arm</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">DTS collects on the card and exports via Prometheus, Fluent Bit, OpenTelemetry or to NetQ — the NIC end of the same congestion story NetQ/WJH tell on the switch</text>
<g><title>ConnectX-7 engine + DPA on the SuperNIC</title><rect x="50" y="150" width="300" height="70" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="200.0" y="179.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">ConnectX-7 engine + DPA</text>
<text x="200.0" y="200.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">on the SuperNIC</text>
</g>
<g><title>DTS container (Arm) doca-telemetry</title><rect x="410" y="150" width="300" height="70" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="560.0" y="179.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">DTS container (Arm)</text>
<text x="560.0" y="200.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">doca-telemetry</text>
</g>
<g><title>Exporters Prometheus :9100 · Fluent Bit · OTLP</title><rect x="810" y="150" width="300" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="960.0" y="179.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Exporters</text>
<text x="960.0" y="200.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Prometheus :9100 · Fluent Bit · OTLP</text>
</g>
<g><title>NetQ / Grafana fleet view</title><rect x="1230" y="150" width="260" height="70" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1360.0" y="179.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">NetQ / Grafana</text>
<text x="1360.0" y="200.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">fleet view</text>
</g>
<line x1="200" y1="220" x2="200" y2="900" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="560" y1="220" x2="560" y2="900" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="960" y1="220" x2="960" y2="900" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1360" y1="220" x2="1360" y2="900" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6"/>
<g><title>config: /opt/mellanox/doca/services/telemetry/config/dts_config.ini (enable providers, export targets)</title><rect x="330" y="266" width="460" height="48" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="560.0" y="293.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">config: /opt/mellanox/doca/services/telemetry/config/dts_config.ini (enable providers, export targets)</text>
</g>
<g><title>Step 1</title><circle cx="305" cy="290" r="16" fill="#1f2937"/><text x="305" y="296" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<line x1="200" y1="360" x2="560" y2="360" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="380.0" y="382.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">providers poll: port counters, rx/tx_prio3_pause, np_cnp_sent, rp_cnp_handled, ECN, DPA metrics, thermal/power</text>
<g><title>Step 2</title><circle cx="230" cy="336" r="16" fill="#1f2937"/><text x="230" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<line x1="200" y1="430" x2="560" y2="430" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="380.0" y="452.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">DOCA Telemetry API: applications (e.g. HBN) publish their own counters/events</text>
<g><title>Step 3</title><circle cx="230" cy="406" r="16" fill="#1f2937"/><text x="230" y="412" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>aggregate into IPC/binary schema; optional on-card buffering (disk)</title><rect x="330" y="476" width="460" height="48" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="560.0" y="503.7" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">aggregate into IPC/binary schema; optional on-card buffering (disk)</text>
</g>
<g><title>Step 4</title><circle cx="305" cy="500" r="16" fill="#1f2937"/><text x="305" y="506" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<line x1="560" y1="570" x2="960" y2="570" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="760.0" y="592.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">scrape: curl http://localhost:9100/metrics | grep -iE 'pfc|ecn|cnp'  ·  or push via Fluent Bit / OTLP</text>
<g><title>Step 5</title><circle cx="590" cy="546" r="16" fill="#1f2937"/><text x="590" y="552" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<line x1="960" y1="640" x2="1360" y2="640" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1160.0" y="662.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">NetQ ingests host/NIC RoCE counters; Grafana dashboards per rail / per tenant</text>
<g><title>Step 6</title><circle cx="990" cy="616" r="16" fill="#1f2937"/><text x="990" y="622" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<g><title>correlate: switch PFC tx on swp12 ↔ NIC rx_prio3_pause on dgx01 at the same second</title><rect x="1160" y="696" width="400" height="48" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1360.0" y="723.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">correlate: switch PFC tx on swp12 ↔ NIC rx_prio3_pause on dgx01 at the same second</text>
</g>
<g><title>Step 7</title><circle cx="1135" cy="720" r="16" fill="#1f2937"/><text x="1135" y="726" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<line x1="1360" y1="800" x2="200" y2="800" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="780.0" y="822.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">action: fix the slow host / tune ECN min-max on the switch — not PFC</text>
<g><title>Step 8</title><circle cx="1330" cy="776" r="16" fill="#1f2937"/><text x="1330" y="782" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g>
<g><title>Note</title><rect x="60" y="880" width="1000" height="90" rx="6" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="72" y="902" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">End-to-end visibility = DTS on the card (NIC counters, CNP rates, DPA CC state) + NetQ/WJH on the switch (PFC/ECN per TC, drop reasons).</text>
<text x="72" y="920" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Exam framing: DTS is a DOCA *service* (container on the Arm); DOCA Telemetry is the *library* applications use to publish into it.</text>
<text x="72" y="938" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Check it is running: crictl ps | grep -i telemetry · exact config paths/ports are release-specific — verify in the DTS guide.</text>
<g><title>Legend</title><rect x="1110" y="890" width="430" height="82" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="916" x2="1184" y2="916" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1198" y="922" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Management / telemetry</text>
<line x1="1124" y1="946" x2="1184" y2="946" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1198" y="952" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (BGP / EVPN / REST / Ansible)</text>
</g>
</svg>
