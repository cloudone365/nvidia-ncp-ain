<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1076" width="100%" role="img">
<title>BlueField-3 internals: one card, three personalities</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1076" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">BlueField-3 internals: one card, three personalities</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">A ConnectX-7 NIC the host sees, a 16-core Arm server in the data path, and a management plane that works when both are down</text>
<g><title>BlueField-3 (PCI 15b3:a2dc · /dev/mst/mt41692_pciconf0)</title><rect x="270" y="140" width="1060" height="810" rx="12" fill="#e9ddff" fill-opacity="0.3" stroke="#7a3fd1" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="286" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">BlueField-3 (PCI 15b3:a2dc · /dev/mst/mt41692_pciconf0)</text>
<g><title>Host (DGX/HGX)</title>
<rect x="40" y="385" width="170" height="170" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="125" y="438" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Host</text>
<text x="125" y="463" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">(DGX/HGX)</text>
<text x="125" y="493" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">mlx5_0</text>
<text x="125" y="515" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ens3f0np0</text>
</g>
<g><title>SN5600 leaf</title>
<rect x="1390" y="385" width="170" height="170" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1475" y="438" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">SN5600</text>
<text x="1475" y="463" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">leaf</text>
<text x="1475" y="493" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Spectrum-4</text>
<text x="1475" y="515" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">400G / port</text>
</g>
<g><title>DDR5</title>
<rect x="300" y="190" width="210" height="110" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="405" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">DDR5</text>
<text x="405" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">16–32 GB (SKU)</text>
<text x="405" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Arm OS + tables</text>
</g>
<g><title>Arm: 16× Cortex-A78</title>
<rect x="590" y="190" width="420" height="110" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="800" y="237" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Arm: 16× Cortex-A78</text>
<text x="800" y="267" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Ubuntu BSP + DOCA: OVS, HBN, DTS</text>
</g>
<g><title>Accelerators</title>
<rect x="1090" y="190" width="210" height="110" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1195" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Accelerators</text>
<text x="1195" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">IPsec / TLS crypto</text>
<text x="1195" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">compression</text>
</g>
<g><title>PCIe Gen5 x16</title>
<rect x="300" y="370" width="210" height="200" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="405" y="429" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">PCIe Gen5 x16</text>
<text x="405" y="458" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">≈ 63 GB/s per</text>
<text x="405" y="481" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">direction</text>
<text x="405" y="503" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">PFs + SR-IOV VFs</text>
<text x="405" y="525" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">PCIe switch (SKU)</text>
</g>
<g><title>ConnectX-7 engine + embedded eSwitch</title>
<rect x="590" y="370" width="420" height="200" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="800" y="427" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">ConnectX-7 engine</text>
<text x="800" y="452" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">+ embedded eSwitch</text>
<text x="800" y="482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">RoCEv2 · GPUDirect RDMA · DDP</text>
<text x="800" y="504" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">PFC / ECN / CNP · flow steering</text>
<text x="800" y="526" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ASAP² switchdev flow offload</text>
</g>
<g><title>Ports p0 / p1</title>
<rect x="1090" y="370" width="210" height="200" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1195" y="429" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Ports p0 / p1</text>
<text x="1195" y="458" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">1×400G or</text>
<text x="1195" y="481" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">2×200G (SKU)</text>
<text x="1195" y="503" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Ethernet or IB</text>
<text x="1195" y="525" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">(LINK_TYPE_P1)</text>
</g>
<g><title>DPA (Data Path Accelerator)</title>
<rect x="590" y="640" width="420" height="110" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="800" y="676" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">DPA (Data Path Accelerator)</text>
<text x="800" y="706" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">16 RISC-V cores · 256 threads</text>
<text x="800" y="728" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Spectrum-X CC · DOCA DPA kernels</text>
</g>
<g><title>RShim (PCIe or USB)</title>
<rect x="300" y="790" width="320" height="140" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="460" y="830" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">RShim (PCIe or USB)</text>
<text x="460" y="859" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">/dev/rshim0/boot</text>
<text x="460" y="882" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">console · misc</text>
<text x="460" y="904" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">tmfifo_net0 .1 ↔ .2</text>
</g>
<g><title>BMC + 1GbE OOB</title>
<rect x="640" y="790" width="320" height="140" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="800" y="830" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">BMC + 1GbE OOB</text>
<text x="800" y="859" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Redfish / IPMI, SOL</text>
<text x="800" y="882" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">BFB push via Redfish</text>
<text x="800" y="904" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">oob_net0 → Arm SSH</text>
</g>
<g><title>eMMC / NVMe + UART</title>
<rect x="980" y="790" width="320" height="140" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1140" y="830" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">eMMC / NVMe + UART</text>
<text x="1140" y="859" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">BSP root filesystem</text>
<text x="1140" y="882" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">BOOT_MODE 0 = RShim</text>
<text x="1140" y="904" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">BOOT_MODE 1 = eMMC</text>
</g>
