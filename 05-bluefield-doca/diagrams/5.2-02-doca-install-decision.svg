<line x1="410" y1="480" x2="470" y2="530" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="490.0" y="500.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">develop</text>
<g><title>Step 3</title><circle cx="330" cy="505" r="16" fill="#1f2937"/><text x="330" y="511" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>/etc/init.d/openibd restart (or reboot) → verify ofed_info -s · ibstat Active · modinfo mlx5_core · mlxfwmanager --query</title><rect x="120" y="690" width="480" height="90" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="360.0" y="730.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">/etc/init.d/openibd restart (or reboot) → verify</text>
<text x="360.0" y="748.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">ofed_info -s · ibstat Active · modinfo mlx5_core · mlxfwmanager --query</text>
</g>
<line x1="190" y1="640" x2="300" y2="690" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="470" y1="640" x2="400" y2="690" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>Step 4</title><circle cx="330" cy="665" r="16" fill="#1f2937"/><text x="330" y="671" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<g><title>bfb-install --bfb DOCA_x.y_BSP_a.b_Ubuntu.bfb upgrades BSP + DOCA + firmware together</title><rect x="1060" y="420" width="420" height="90" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1270.0" y="460.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">bfb-install --bfb DOCA_x.y_BSP_a.b_Ubuntu.bfb</text>
<text x="1270.0" y="478.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">upgrades BSP + DOCA + firmware together</text>
</g>
<line x1="1270" y1="370" x2="1270" y2="420" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>Step 2</title><circle cx="1300" cy="395" r="16" fill="#1f2937"/><text x="1300" y="401" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<g><title>Enable services from NGC HBN (kubelet pod spec in /etc/kubelet.d/) · DTS</title><rect x="1060" y="560" width="420" height="90" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1270.0" y="600.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Enable services from NGC</text>
<text x="1270.0" y="618.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">HBN (kubelet pod spec in /etc/kubelet.d/) · DTS</text>
</g>
<line x1="1270" y1="510" x2="1270" y2="560" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>Step 3</title><circle cx="1300" cy="535" r="16" fill="#1f2937"/><text x="1300" y="541" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>verify: cat /etc/mlnx-release matches host major.minor crictl ps | grep -E 'hbn|telemetry'</title><rect x="1060" y="690" width="420" height="90" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1270.0" y="730.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">verify: cat /etc/mlnx-release matches host major.minor</text>
<text x="1270.0" y="747.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">crictl ps | grep -E 'hbn|telemetry'</text>
</g>
<line x1="1270" y1="650" x2="1270" y2="690" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>Step 4</title><circle cx="1300" cy="670" r="16" fill="#1f2937"/><text x="1300" y="676" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<g><title>Compatibility gate host DOCA = BFB DOCA (major.minor)</title><rect x="640" y="560" width="320" height="110" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="800.0" y="593.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Compatibility gate</text>
<text x="800.0" y="611.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">host DOCA = BFB DOCA (major.minor)</text>
<text x="800.0" y="633.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">firmware ≥ matrix minimum</text>
<text x="800.0" y="648.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">never host ahead of card</text>
</g>
