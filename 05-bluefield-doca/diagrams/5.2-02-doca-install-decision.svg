<text x="330.0" y="454.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">dpkg -i doca-host_&lt;ver&gt;.deb &amp;&amp; apt update  (repo only!)</text>
</g>
<line x1="330" y1="370" x2="330" y2="420" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
