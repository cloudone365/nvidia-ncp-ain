<g><title>doca-ofed drivers + MFT + OVS, no SDK</title><rect x="60" y="530" width="260" height="110" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="190.0" y="569.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">doca-ofed</text>
<text x="190.0" y="589.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">drivers + MFT + OVS, no SDK</text>
<text x="190.0" y="613.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">production GPU hosts (= MLNX_OFED)</text>
</g>
<g><title>doca-all / doca-networking + SDK libs, samples, services runtime</title><rect x="340" y="530" width="260" height="110" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="470.0" y="571.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">doca-all / doca-networking</text>
<text x="470.0" y="589.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">+ SDK libs, samples, services runtime</text>
<text x="470.0" y="611.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">dev / validation hosts</text>
</g>
