<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="100%" role="img">
<title>DOCA installation decision flow: which profile, where, verify</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1010" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">DOCA installation decision flow: which profile, where, verify</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">The doca-host package only adds the repository; a profile meta-package does the real install; the Arm is updated by BFB</text>
<g><title>Where is DOCA going?</title>
<rect x="600" y="145" width="400" height="80" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="800" y="192" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Where is DOCA going?</text>
</g>
<g><title>GPU / compute host (x86)</title>
<rect x="80" y="275" width="560" height="90" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="360" y="312" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">GPU / compute host (x86)</text>
<text x="360" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">needs RoCE / IB drivers + tools</text>
</g>
<g><title>Add the repo (doca-host .deb / .rpm)</title>
<rect x="80" y="415" width="560" height="95" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="360" y="454" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Add the repo (doca-host .deb / .rpm)</text>
<text x="360" y="484" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">dpkg -i doca-host_*.deb; apt update</text>
</g>
<g><title>doca-ofed</title>
<rect x="40" y="570" width="210" height="140" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="145" y="609" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">doca-ofed</text>
<text x="145" y="638" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">drivers + MFT</text>
<text x="145" y="660" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">+ OVS, no SDK</text>
<text x="145" y="682" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">production GPU</text>
</g>
<g><title>doca-networking</title>
<rect x="265" y="570" width="210" height="140" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="370" y="609" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">doca-networking</text>
<text x="370" y="638" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">drivers + Flow,</text>
<text x="370" y="660" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">DPA, RDMA libs</text>
<text x="370" y="682" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">DOCA net apps</text>
</g>
<g><title>doca-all</title>
<rect x="490" y="570" width="210" height="140" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="595" y="609" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">doca-all</text>
<text x="595" y="638" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">everything +</text>
<text x="595" y="660" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SDK + samples</text>
<text x="595" y="682" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">dev / validation</text>
</g>
<g><title>Load + verify</title>
<rect x="40" y="770" width="660" height="110" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="370" y="806" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Load + verify</text>
<text x="370" y="836" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">/etc/init.d/openibd restart (or reboot)</text>
<text x="370" y="858" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ofed_info -s · ibstat · mlxfwmanager --query</text>
</g>
<g><title>BlueField Arm</title>
<rect x="1000" y="275" width="560" height="90" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1280" y="312" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">BlueField Arm</text>
<text x="1280" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">needs BSP + DOCA + services</text>
</g>
<g><title>bfb-install the matching BFB</title>
<rect x="1000" y="415" width="560" height="110" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1280" y="451" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">bfb-install the matching BFB</text>
<text x="1280" y="481" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">upgrades BSP + DOCA + firmware together</text>
<text x="1280" y="503" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">(not apt upgrade on the Arm)</text>
</g>
<g><title>Enable services from NGC</title>
<rect x="1000" y="575" width="560" height="120" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1280" y="616" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Enable services from NGC</text>
<text x="1280" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">HBN: kubelet pod spec in /etc/kubelet.d/</text>
<text x="1280" y="668" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">DTS: doca-telemetry container</text>
</g>
<g><title>Verify</title>
<rect x="1000" y="770" width="560" height="110" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1280" y="806" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Verify</text>
<text x="1280" y="836" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">cat /etc/mlnx-release</text>
<text x="1280" y="858" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">crictl ps | grep -E 'hbn|telemetry'</text>
</g>
<g><title>Compatibility gate</title>
<rect x="720" y="560" width="260" height="170" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="850" y="604" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Compatibility gate</text>
<text x="850" y="633" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">host DOCA major.minor</text>
<text x="850" y="656" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">= BFB DOCA major.minor</text>
<text x="850" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">firmware ≥ matrix min</text>
<text x="850" y="700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">never host ahead of card</text>
</g>
