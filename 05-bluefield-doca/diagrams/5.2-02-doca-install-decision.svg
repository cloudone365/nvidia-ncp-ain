</g>
<text x="60" y="840" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Gotcha: repo added, ibstat empty → no profile installed. Gotcha: apt upgrade of host DOCA ahead of the card → DPA/mlx5 feature mismatch; reinstall matching BFB.</text>
