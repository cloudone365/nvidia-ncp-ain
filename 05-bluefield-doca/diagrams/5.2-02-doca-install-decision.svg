<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">DOCA installation decision flow: which profile, where, and what to verify</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">doca-host .deb/.rpm installs only the repository; a profile meta-package does the real install; BFB replaces apt upgrade on the Arm</text>
<g><title>Where is DOCA going?</title><rect x="560" y="150" width="480" height="70" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="800.0" y="190.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Where is DOCA going?</text>
</g>
<g><title>GPU / compute host (x86) needs RoCE/IB drivers + tools</title><rect x="120" y="280" width="420" height="90" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="330.0" y="319.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">GPU / compute host (x86)</text>
<text x="330.0" y="340.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">needs RoCE/IB drivers + tools</text>
</g>
<g><title>BlueField Arm needs BSP + DOCA + services</title><rect x="1060" y="280" width="420" height="90" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1270.0" y="319.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">BlueField Arm</text>
<text x="1270.0" y="340.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">needs BSP + DOCA + services</text>
</g>
<line x1="700" y1="220" x2="330" y2="280" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="475.0" y="240.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">host</text>
