<text x="624" y="652" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<text x="650" y="658" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">(Fluent Bit, OTLP)</text>
<text x="650" y="658" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">(Fluent Bit, OTLP)</text>
<text x="650" y="636" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">expose /metrics or push</text>
<text x="650" y="636" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">expose /metrics or push</text>
<polyline points="1000,750 1380,750" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>Step 6</title><circle cx="1024" cy="726" r="16" fill="#1f2937"/>
<text x="1024" y="732" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<text x="1050" y="738" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">scrape / ingest, per rail</text>
<text x="1050" y="738" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">scrape / ingest, per rail</text>
<g><title>correlate: switch PFC tx on swp12</title>
<rect x="1100" y="780" width="452" height="64" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1326" y="806" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">correlate: switch PFC tx on swp12</text>
<text x="1326" y="828" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">↔ host rx_prio3_pause, same second</text>
</g>
<g><title>Step 7</title><circle cx="1074" cy="812" r="16" fill="#1f2937"/>
<text x="1074" y="818" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<polyline points="1380,910 200,910" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>Step 8</title><circle cx="224" cy="886" r="16" fill="#1f2937"/>
<text x="224" y="892" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g>
<text x="250" y="898" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">action: fix the slow host, or tune ECN thresholds — not PFC</text>
<text x="250" y="898" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">action: fix the slow host, or tune ECN thresholds — not PFC</text>
<g><title>DTS is a DOCA service (container on the Arm); DOCA Telemetry is the library apps publish with.</title>
<rect x="48" y="980" width="1000" height="120" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="62" y="1023" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">DTS is a DOCA service (container on the Arm); DOCA Telemetry is the library apps publish with.</text>
<text x="62" y="1045" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Check: crictl ps | grep -i telemetry · curl -s localhost:9100/metrics | grep -iE 'pfc|ecn|cnp'</text>
<text x="62" y="1067" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Config paths and the metrics port are release-specific — verify in the DTS guide.</text>
</g>
<g><title>Legend</title><rect x="1100" y="990" width="452" height="84" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
