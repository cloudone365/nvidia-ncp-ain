<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="100%" role="img">
<title>DOCA Telemetry Service (DTS): NIC counters exported from the Arm</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1120" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">DOCA Telemetry Service (DTS): NIC counters exported from the Arm</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">DTS collects on the card and exports via Prometheus, Fluent Bit or OpenTelemetry — the NIC half of the congestion story</text>
<g><title>ConnectX-7 + DPA</title>
<rect x="40.0" y="150" width="320" height="80" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="200" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">ConnectX-7 + DPA</text>
<text x="200" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">counters on the SuperNIC</text>
</g>
<line x1="200" y1="230" x2="200" y2="950" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
<g><title>DTS container (Arm)</title>
<rect x="440.0" y="150" width="320" height="80" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="600" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">DTS container (Arm)</text>
<text x="600" y="211" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">doca-telemetry</text>
</g>
<line x1="600" y1="230" x2="600" y2="950" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
