<rect x="1230.0" y="150" width="300" height="80" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1380" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">NetQ / Grafana</text>
<text x="1380" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">fleet view</text>
</g>
<line x1="1380" y1="230" x2="1380" y2="950" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
<g><title>config: dts_config.ini</title>
<rect x="410" y="262" width="380" height="64" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="600" y="288" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">config: dts_config.ini</text>
<text x="600" y="310" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">(providers, export targets)</text>
</g>
<g><title>Step 1</title><circle cx="384" cy="294" r="16" fill="#1f2937"/>
<text x="384" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<polyline points="200,410 600,410" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
