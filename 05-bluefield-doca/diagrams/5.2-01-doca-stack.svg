</g>
<line x1="1190" y1="450" x2="1190" y2="480" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<g><title>BSP (Ubuntu) + DOCA runtime</title><rect x="870" y="480" width="640" height="110" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1190.0" y="530.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">BSP (Ubuntu) + DOCA runtime</text>
