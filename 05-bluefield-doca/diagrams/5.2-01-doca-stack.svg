<text x="60" y="880" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start">Verify alignment: ofed_info -s · dpkg -l | grep doca · mlxfwmanager --query  (host)   ·   cat /etc/mlnx-release (Arm)</text>
