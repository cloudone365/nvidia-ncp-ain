<g><title>Libraries (SDK)</title><rect x="870" y="340" width="640" height="110" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1190.0" y="390.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Libraries (SDK)</text>
