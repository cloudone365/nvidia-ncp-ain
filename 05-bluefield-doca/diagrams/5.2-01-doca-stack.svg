<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">DOCA stack: drivers (DOCA-OFED) → libraries → services → applications, on host and on the DPU</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">One version number ships all layers; host DOCA major.minor should match the BFB's DOCA; firmware minimum per device in the release-notes matrix</text>
<g><title>Host (x86 GPU server) — apt install doca-ofed | doca-all</title><rect x="60" y="150" width="700" height="700" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
