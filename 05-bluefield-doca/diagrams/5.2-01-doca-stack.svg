<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">One version ties the layers together: host DOCA major.minor should match the BFB's DOCA, firmware must meet the matrix minimum</text>
