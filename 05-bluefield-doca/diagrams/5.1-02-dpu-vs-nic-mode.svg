<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1016" width="100%" role="img">
<title>DPU mode vs NIC mode: where a host packet goes</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1016" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">DPU mode vs NIC mode: where a host packet goes</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">DPU mode puts the Arm's OVS and the eSwitch FDB between host and wire; NIC mode makes the card a ConnectX-7 again</text>
<g><title>DPU mode — INTERNAL_CPU_OFFLOAD_ENGINE=0 (default)</title><rect x="40" y="140" width="740" height="760" rx="12" fill="#ffffff" fill-opacity="0.0" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="56" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">DPU mode — INTERNAL_CPU_OFFLOAD_ENGINE=0 (default)</text>
<g><title>NIC mode — INTERNAL_CPU_OFFLOAD_ENGINE=1</title><rect x="820" y="140" width="740" height="760" rx="12" fill="#ffffff" fill-opacity="0.0" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="836" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">NIC mode — INTERNAL_CPU_OFFLOAD_ENGINE=1</text>
<g><title>Host</title>
<rect x="70" y="190" width="300" height="120" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="220" y="231" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Host</text>
<text x="220" y="261" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ens3f0np0 (PF)</text>
<text x="220" y="283" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ens3f0v0 (VF)</text>
</g>
<g><title>Arm: ovs-vswitchd</title>
<rect x="420" y="190" width="330" height="220" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="585" y="259" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Arm: ovs-vswitchd</text>
<text x="585" y="288" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ovsbr1: p0 + pf0hpf</text>
<text x="585" y="311" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">pf0hpf = host PF rep</text>
<text x="585" y="333" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">pf0vfN = host VF reps</text>
<text x="585" y="355" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">p0 = uplink rep</text>
</g>
<g><title>eSwitch (switchdev) — hardware flow table</title>
<rect x="70" y="470" width="680" height="130" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="410" y="527" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">eSwitch (switchdev) — hardware flow table</text>
<text x="410" y="557" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">hit → forward at line rate · miss → send to the representor</text>
</g>
<g><title>p0 → SN5600 leaf</title>
<rect x="70" y="680" width="300" height="90" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="220" y="717" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">p0 → SN5600 leaf</text>
<text x="220" y="747" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">400G wire</text>
</g>
<polyline points="220,310 220,470" fill="none" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 1</title><circle cx="190" cy="390" r="16" fill="#1f2937"/>
<text x="190" y="396" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<polyline points="500,470 500,410" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>Step 2</title><circle cx="470" cy="440" r="16" fill="#1f2937"/>
<text x="470" y="446" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<polyline points="680,410 680,470" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>Step 3</title><circle cx="710" cy="440" r="16" fill="#1f2937"/>
<text x="710" y="446" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<polyline points="220,600 220,680" fill="none" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 4</title><circle cx="190" cy="640" r="16" fill="#1f2937"/>
<text x="190" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<text x="70" y="810" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1  host frame enters the eSwitch via the PF</text>
<text x="70" y="832" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">2  first packet misses → upcall to OVS via pf0hpf</text>
<text x="70" y="854" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">3  OVS decides, installs the rule into the eSwitch</text>
<text x="70" y="876" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">4  packets 2…N hit in hardware → p0, 0 % Arm CPU</text>
<g><title>Host</title>
<rect x="850" y="190" width="300" height="120" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="1000" y="231" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Host</text>
<text x="1000" y="261" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ens3f0np0 (PF)</text>
<text x="1000" y="283" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">VFs via SR-IOV</text>
</g>
<g><title>Arm: not in data path</title>
<rect x="1200" y="190" width="330" height="220" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="1365" y="259" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Arm: not in data path</text>
<text x="1365" y="288" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">no representors</text>
<text x="1365" y="311" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">no OVS forwarding</text>
<text x="1365" y="333" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">may be unreachable</text>
<text x="1365" y="355" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">RShim / BMC still work</text>
</g>
<g><title>ConnectX-7 engine (host owns the eSwitch)</title>
<rect x="850" y="470" width="680" height="130" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1190" y="527" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">ConnectX-7 engine (host owns the eSwitch)</text>
<text x="1190" y="557" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">DDP + DPA congestion control active (SuperNIC)</text>
</g>
<g><title>p0 → SN5600 leaf</title>
<rect x="850" y="680" width="300" height="90" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1000" y="717" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">p0 → SN5600 leaf</text>
<text x="1000" y="747" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">400G wire</text>
</g>
<polyline points="1000,310 1000,470" fill="none" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 1</title><circle cx="970" cy="390" r="16" fill="#1f2937"/>
<text x="970" y="396" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<polyline points="1000,600 1000,680" fill="none" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 2</title><circle cx="970" cy="640" r="16" fill="#1f2937"/>
<text x="970" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<text x="850" y="810" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1  host PF frame goes straight to the NIC engine</text>
<text x="850" y="832" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">2  egress p0; leaf may spray (AR), DDP reorders</text>
<text x="850" y="854" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Mode change is staged in NVRAM: power cycle the host</text>
<text x="850" y="876" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Verify: mlxconfig -q (Current column), ibdev2netdev -v</text>
<text x="48" y="948" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">Restricted (zero-trust) host = DPU mode + mlxprivhost r, run from the Arm</text>
<g><title>Legend</title><rect x="1060" y="912" width="492" height="84" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1076" y1="938" x2="1136" y2="938" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1152" y="944" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (host ↔ wire)</text>
<line x1="1076" y1="968" x2="1136" y2="968" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1152" y="974" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Slow path (upcall / rule install)</text>
</g>
</svg>
