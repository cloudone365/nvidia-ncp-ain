<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img">
<title>DPU mode vs NIC mode: where host packets go</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">DPU mode vs NIC mode: where host packets go</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">DPU mode (INTERNAL_CPU_OFFLOAD_ENGINE=0): host traffic enters the Arm's OVS via representors. NIC mode (=1): a ConnectX-7; Arm out of the path</text>
<g><title>DPU mode (embedded CPU / ECPF) — default</title><rect x="60" y="150" width="720" height="640" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="74" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">DPU mode (embedded CPU / ECPF) — default</text>
<g><title>Host ens3f0np0 (PF) · ens3f0v0 (VF)</title><rect x="90" y="200" width="300" height="80" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="240.0" y="234.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Host</text>
<text x="240.0" y="254.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">ens3f0np0 (PF) · ens3f0v0 (VF)</text>
</g>
<g><title>Host sees a NIC; no representors, no OVS</title><rect x="430" y="200" width="320" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="590.0" y="234.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Host sees</text>
<text x="590.0" y="254.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">a NIC; no representors, no OVS</text>
</g>
<g><title>Arm side (Ubuntu, switchdev) </title><rect x="90" y="330" width="660" height="230" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="420.0" y="401.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Arm side (Ubuntu, switchdev)</text>
<text x="420.0" y="447.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">pf0hpf ← host PF representor     pf0vf0…N ← VF representors</text>
<text x="420.0" y="465.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">ovsbr1: p0 + pf0hpf (+ pf0vfN)     ovsbr2: p1 + pf1hpf</text>
<text x="420.0" y="483.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">hw-offload=true: first packet → ovs-vswitchd, rule → eswitch (ASAP²)</text>
<text x="420.0" y="501.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">ovs-appctl dpctl/dump-flows type=offloaded  ← proof</text>
</g>
<line x1="240" y1="280" x2="240" y2="330" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 1</title><circle cx="205" cy="305" r="16" fill="#1f2937"/><text x="205" y="311" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><title>p0 (wire, 400G) to SN5600 leaf</title><rect x="90" y="610" width="300" height="70" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="240.0" y="639.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">p0 (wire, 400G)</text>
<text x="240.0" y="659.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">to SN5600 leaf</text>
</g>
<g><title>HBN / firewall / telemetry see every host packet</title><rect x="430" y="610" width="320" height="70" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="590.0" y="639.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">HBN / firewall / telemetry</text>
<text x="590.0" y="659.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">see every host packet</text>
</g>
<line x1="240" y1="560" x2="240" y2="610" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 3</title><circle cx="205" cy="585" r="16" fill="#1f2937"/><text x="205" y="591" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<line x1="590" y1="560" x2="590" y2="610" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>Step 2</title><circle cx="555" cy="585" r="16" fill="#1f2937"/><text x="555" y="591" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<text x="90" y="720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">1 host PF frame arrives at pf0hpf   2 OVS/DOCA Flow decides (offloaded after 1st pkt)   3 egress p0</text>
<text x="90" y="760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Use: isolation, zero-trust, HBN, restricted host (mlxprivhost from the Arm)</text>
<g><title>NIC mode — SuperNIC personality</title><rect x="820" y="150" width="720" height="640" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="834" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">NIC mode — SuperNIC personality</text>
<g><title>Host ens3f0np0 (PF) · VFs via SR-IOV</title><rect x="850" y="200" width="300" height="80" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="1000.0" y="234.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Host</text>
<text x="1000.0" y="254.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">ens3f0np0 (PF) · VFs via SR-IOV</text>
</g>
<g><title>Host sees a ConnectX-7 NIC (mlx5_0)</title><rect x="1190" y="200" width="320" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1350.0" y="234.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Host sees</text>
<text x="1350.0" y="254.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">a ConnectX-7 NIC (mlx5_0)</text>
</g>
<g><title>Arm side: NOT in the data path </title><rect x="850" y="330" width="660" height="230" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1180.0" y="401.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Arm side: NOT in the data path</text>
<text x="1180.0" y="447.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">no representors, no OVS forwarding; Arm may be inaccessible</text>
<text x="1180.0" y="465.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">ConnectX-7 engine + DPA still active:</text>
<text x="1180.0" y="483.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">DDP out-of-order RoCE, Spectrum-X CC on DPA, RoCE AR tolerance</text>
<text x="1180.0" y="501.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">mlxconfig -q INTERNAL_CPU_OFFLOAD_ENGINE → DISABLED(1)</text>
</g>
<line x1="1000" y1="280" x2="1000" y2="610" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 1</title><circle cx="965" cy="305" r="16" fill="#1f2937"/><text x="965" y="311" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><title>Step 2</title><circle cx="965" cy="585" r="16" fill="#1f2937"/><text x="965" y="591" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<g><title>p0 (wire, 400G) to SN5600 leaf (AR + RoCE)</title><rect x="850" y="610" width="300" height="70" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1000.0" y="639.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">p0 (wire, 400G)</text>
<text x="1000.0" y="659.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">to SN5600 leaf (AR + RoCE)</text>
</g>
<g><title>RShim / BMC still work unless restricted</title><rect x="1190" y="610" width="320" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1350.0" y="639.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">RShim / BMC still work</text>
<text x="1350.0" y="659.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">unless restricted</text>
</g>
<text x="850" y="720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">1 host PF frame goes straight to the engine   2 egress p0; switch sprays, DDP reorders</text>
<text x="850" y="760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Use: Spectrum-X GPU fabric (8 SuperNICs/node); mode change needs a POWER CYCLE</text>
<g><title>Legend</title><rect x="1110" y="810" width="430" height="82" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="836" x2="1184" y2="836" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1198" y="842" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
<line x1="1124" y1="866" x2="1184" y2="866" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1198" y="872" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (BGP / EVPN / REST / Ansible)</text>
</g>
<text x="60" y="850" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Restricted host (zero-trust): DPU mode + mlxprivhost r --disable_rshim … from the Arm — host keeps its NIC, loses RShim/firmware/mlxconfig rights.</text>
</svg>
