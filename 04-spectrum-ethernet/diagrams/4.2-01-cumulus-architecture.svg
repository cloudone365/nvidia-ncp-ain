<text x="1341.0" y="710.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Spectrum ASIC (Spectrum-2/3/4)</text>
<text x="1341.0" y="733.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">L2 FDB · LPM routes · host table · ECMP groups</text>
<text x="1341.0" y="755.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ACL TCAM · VXLAN · QoS/PFC/ECN · counters</text>
<text x="1341.0" y="777.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">observe: cl-resource-query, WJH</text>
</g>
<rect x="48" y="512" width="1050" height="280" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
<text x="66" y="544" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">Forwarding paths</text>
<g><title>Hardware path (steady state)</title><rect x="70" y="566" width="430" height="80" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="285.0" y="601.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Hardware path (steady state)</text>
<text x="285.0" y="623.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">ASIC entry matched → forwarded at line rate</text>
</g>
<g><title>CPU punt path (exception)</title><rect x="70" y="674" width="430" height="80" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="285.0" y="709.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">CPU punt path (exception)</text>
<text x="285.0" y="731.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">BGP, SSH, LLDP, ARP to the switch, ASIC misses</text>
</g>
<text x="526" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Anything with a matching ASIC entry never touches the CPU.</text>
<text x="526" y="624" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Punted traffic is rate-limited (control-plane policer):</text>
<text x="526" y="654" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">tens of thousands of pps, not terabits.</text>
<text x="526" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">A route in `ip route` but not in the ASIC (table full)</text>
<text x="526" y="714" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">is software-forwarded → high CPU, slow traffic.</text>
