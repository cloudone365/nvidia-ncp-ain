<line x1="730" y1="455" x2="800" y2="435" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>Linux kernel (control-plane truth) </title><rect x="1130" y="200" width="410" height="270" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1335.0" y="291.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Linux kernel (control-plane truth)</text>
<text x="1335.0" y="339.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">netdevs: swpN, swpNsM, eth0, lo, vlanN, bondN, br_default</text>
<text x="1335.0" y="357.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">bridge FDB · neighbor table (ARP/ND)</text>
<text x="1335.0" y="375.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">RIB/FIB per VRF (from zebra) · netfilter</text>
<text x="1335.0" y="393.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">observe: ip link / bridge fdb / ip route</text>
</g>
<line x1="1060" y1="235" x2="1130" y2="235" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1095.0" y="225.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">link/addr</text>
<line x1="1060" y1="335" x2="1130" y2="335" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1095.0" y="325.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">routes</text>
<line x1="1060" y1="435" x2="1130" y2="435" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1095.0" y="425.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">rules</text>
<g><title>Step 3</title><circle cx="1095" cy="285" r="16" fill="#1f2937"/><text x="1095" y="291" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>switchd watches kernel state via netlink</title><rect x="1130" y="540" width="410" height="90" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1335.0" y="568.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">switchd</text>
<text x="1335.0" y="590.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">watches kernel state via netlink</text>
<text x="1335.0" y="616.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">programs the ASIC through the NVIDIA SDK</text>
</g>
<line x1="1335" y1="470" x2="1335" y2="540" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1425.0" y="505.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">netlink events</text>
<g><title>Step 4</title><circle cx="1290" cy="505" r="16" fill="#1f2937"/><text x="1290" y="511" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<g><title>Spectrum ASIC (Spectrum-2/3/4) </title><rect x="1130" y="690" width="410" height="110" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1335.0" y="710.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Spectrum ASIC (Spectrum-2/3/4)</text>
<text x="1335.0" y="758.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">L2 FDB · LPM routes · host table · ECMP groups</text>
<text x="1335.0" y="776.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">ACL TCAM · VXLAN · QoS/PFC/ECN · counters</text>
<text x="1335.0" y="794.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">observe: cl-resource-query, WJH</text>
</g>
<line x1="1335" y1="630" x2="1335" y2="690" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1405.0" y="660.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SDK calls</text>
<g><title>Step 5</title><circle cx="1290" cy="660" r="16" fill="#1f2937"/><text x="1290" y="666" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<g><title>Forwarding paths</title><rect x="60" y="540" width="1000" height="260" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="74" y="568" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">Forwarding paths</text>
<g><title>Hardware path (steady state) ASIC entry matched → forwarded at line rate</title><rect x="90" y="600" width="420" height="70" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="300.0" y="629.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">Hardware path (steady state)</text>
<text x="300.0" y="649.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">ASIC entry matched → forwarded at line rate</text>
</g>
<g><title>CPU punt path (exception) BGP, SSH, LLDP, ARP to the switch, ASIC misses</title><rect x="90" y="700" width="420" height="70" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="300.0" y="729.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">CPU punt path (exception)</text>
<text x="300.0" y="749.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">BGP, SSH, LLDP, ARP to the switch, ASIC misses</text>
</g>
<text x="540" y="625" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">Anything with a matching ASIC entry never touches the CPU.</text>
<text x="540" y="651" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">Punted traffic is rate-limited (control-plane policer):</text>
<text x="540" y="677" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">tens of thousands of pps, not terabits.</text>
<text x="540" y="703" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">A route in `ip route` but not in the ASIC (table full)</text>
<text x="540" y="729" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">is software-forwarded → high CPU, slow traffic.</text>
<g><title>Legend</title><rect x="48" y="820" width="430" height="82" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="62" y1="846" x2="122" y2="846" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="136" y="852" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (BGP / EVPN / REST / Ansible)</text>
<line x1="62" y1="876" x2="122" y2="876" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="136" y="882" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
</g>
<text x="520" y="845" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">1 nv set → pending revision   2 nv config apply renders files   3 daemons push state into the kernel</text>
<text x="520" y="869" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">4 switchd sees netlink changes   5 SDK programs tables; nv show reads operational state back</text>
</svg>
