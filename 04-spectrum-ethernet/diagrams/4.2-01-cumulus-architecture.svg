<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Cumulus Linux architecture: NVUE → Linux kernel / FRR → switchd → Spectrum ASIC</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Debian host; nvued renders ifupdown2 and FRR files; the kernel is the control-plane truth; switchd mirrors it into the ASIC via the SDK</text>
<g><title>Operator / Ansible nv CLI · REST :8765</title><rect x="60" y="170" width="300" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="210.0" y="204.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Operator / Ansible</text>
<text x="210.0" y="226.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">nv CLI · REST :8765</text>
</g>
<g><title>nvued (NVUE daemon) object tree, revisions</title><rect x="60" y="300" width="300" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="210.0" y="319.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">nvued (NVUE daemon)</text>
<text x="210.0" y="341.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">object tree, revisions</text>
<text x="210.0" y="367.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">pending → applied → startup</text>
<text x="210.0" y="385.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">/etc/nvue.d/startup.yaml</text>
</g>
<line x1="210" y1="250" x2="210" y2="300" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
