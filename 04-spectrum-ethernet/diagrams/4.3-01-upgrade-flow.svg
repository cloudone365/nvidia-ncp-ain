<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img">
<title>Upgrade decision flow: package upgrade vs ONIE image install + YAML restore</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Upgrade decision flow: package upgrade vs ONIE image install + YAML restore</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Same major train and release notes permit → package upgrade. Major jump, corrupted system, or notes require → ONIE install + restore</text>
<g><title>Target version vs running version?</title><rect x="520" y="136" width="560" height="76" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="800.0" y="170.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Target version vs running version?</text>
<text x="800.0" y="193.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv show system · release notes for the target</text>
</g>
<line x1="560" y1="212" x2="380" y2="296" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="1040" y1="212" x2="1220" y2="296" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="440" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">minor, notes permit</text>
<g><title>step 1</title><circle cx="470" cy="262" r="16" fill="#1f2937"/>
<text x="470" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<text x="1160" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">major / corrupt / notes say so</text>
<g><title>step 1</title><circle cx="1130" cy="262" r="16" fill="#1f2937"/>
<text x="1130" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<g><title>A · Package upgrade (in place)</title><rect x="48" y="300" width="640" height="142" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5"/>
<text x="368.0" y="334.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">A · Package upgrade (in place)</text>
<text x="368.0" y="357.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">same major train (5.9 → 5.11), release notes permit</text>
<text x="368.0" y="379.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv config save; back up YAML anyway</text>
<text x="368.0" y="401.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv action upgrade system packages to-version 5.11.0 use-vrf mgmt</text>
<text x="368.0" y="423.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">(or sudo apt update &amp;&amp; sudo apt upgrade) → reboot</text>
</g>
<g><title>B · Binary image install (ONIE)</title><rect x="912" y="300" width="640" height="142" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="1232.0" y="334.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">B · Binary image install (ONIE)</text>
<text x="1232.0" y="357.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">major jump (4.4 → 5.10), corrupted OS, or notes require it</text>
<text x="1232.0" y="379.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">1 nv config show -o yaml &gt; backup.yaml (copy it off-box!)</text>
<text x="1232.0" y="401.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">2 sudo onie-select -i &amp;&amp; sudo reboot (or NetQ LCM / ZTP)</text>
<text x="1232.0" y="423.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">3 ONIE writes a fresh image: the OS partition is wiped</text>
</g>
<line x1="368" y1="442" x2="368" y2="496" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>step 2</title><circle cx="398" cy="470" r="16" fill="#1f2937"/>
<text x="398" y="476" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<line x1="1232" y1="442" x2="1232" y2="496" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>step 2</title><circle cx="1262" cy="470" r="16" fill="#1f2937"/>
<text x="1262" y="476" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<g><title>Reboot, verify</title><rect x="48" y="500" width="640" height="96" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="368.0" y="533.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Reboot, verify</text>
<text x="368.0" y="556.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv show system → new version · switchd active</text>
<text x="368.0" y="578.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">survives: /etc, startup.yaml, users, keys, agents</text>
</g>
<g><title>Restore configuration</title><rect x="912" y="500" width="640" height="96" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1232.0" y="533.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Restore configuration</text>
<text x="1232.0" y="556.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv config replace backup.yaml → apply -y → save</text>
<text x="1232.0" y="578.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">re-add non-NVUE state: users, SSH keys, NetQ agent, cron</text>
</g>
<line x1="368" y1="596" x2="600" y2="666" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="1232" y1="596" x2="1000" y2="666" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>step 3</title><circle cx="800" cy="636" r="16" fill="#1f2937"/>
<text x="800" y="642" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
<g><title>Validate</title><rect x="440" y="670" width="720" height="96" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="800.0" y="703.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Validate</text>
<text x="800.0" y="726.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">netq check bgp | evpn | interfaces | roce · snapshot compare</text>
<text x="800.0" y="748.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">NetQ LCM: backup → upgrade → restore-on-failure → snapshot</text>
</g>
<g><title>Note</title><rect x="48" y="790" width="1040" height="90" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Single OS partition on Cumulus (unlike SONiC's multi-image GRUB). NVUE YAML is a full declarative description,</text>
<text x="64" y="850" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">so replace + apply + save recreates the switch in three commands: the backup matters more than the path.</text>
<g><title>Legend</title><rect x="1110" y="790" width="442" height="90" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="816" x2="1180" y2="816" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow-dark)"/>
<text x="1194" y="822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Decision / step</text>
<rect x="1124" y="835" width="56" height="20" rx="4" fill="#ffd9d9" stroke="#d93025" stroke-width="2"/>
<text x="1194" y="852" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Destructive (config wiped)</text>
</g>
</svg>
