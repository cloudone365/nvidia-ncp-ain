<g><title>Headroom intuition</title><rect x="48" y="762" width="1040" height="184" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="792" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Headroom (why xoff/xon are platform-computed): after it sends PAUSE the switch must absorb</text>
<text x="64" y="822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">what is already in flight ≈ 2 × cable delay × line rate + sender reaction + MTU. 100 m at 400G:</text>
<text x="64" y="852" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">5 ns/m × 100 m × 2 × 400 Gb/s ≈ 50 KB, plus 2 MTUs and NIC response ≈ 70–100 KB per lossless PG.</text>
<text x="64" y="882" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">pfcwd: queue paused &gt; detection_time → action; recovers after restoration_time (POLL_INTERVAL 100 ms).</text>
<text x="64" y="912" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Verify: show pfc counters (only PFC3 moves) · show queue counters (UC3 drops 0) · show pfcwd stats.</text>
