<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" role="img">
<title>BGP unnumbered on a leaf/spine link: IPv6 link-local session, IPv4 routes via RFC 5549</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">BGP unnumbered on a leaf/spine link: IPv6 link-local session, IPv4 routes via RFC 5549</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">No IPv4 on fabric links. RA discovers the neighbour's fe80:: address; eBGP peers per interface; IPv4 NLRI carries an IPv6 next hop</text>
<line x1="328" y1="272" x2="328" y2="830" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="1272" y1="272" x2="1272" y2="830" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="608" y1="214" x2="992" y2="214" stroke="#6b7280" stroke-width="3"/>
<text x="800" y="202" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">swp51 ↔ swp1 · 800G · no /31 planning</text>
<g><title>leaf01</title><rect x="48" y="150" width="560" height="122" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="328.0" y="185.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">leaf01</text>
<text x="328.0" y="208.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">AS 65011 · lo 10.0.0.11/32</text>
<text x="328.0" y="230.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">swp51: no IPv4 address, IPv6 link-local fe80::1 (auto)</text>
<text x="328.0" y="252.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv set vrf default router bgp neighbor swp51 remote-as external</text>
</g>
<g><title>spine01</title><rect x="992" y="150" width="560" height="122" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1272.0" y="185.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">spine01</text>
<text x="1272.0" y="208.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">AS 65000 · lo 10.0.0.1/32</text>
<text x="1272.0" y="230.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">swp1: no IPv4 address, IPv6 link-local fe80::2 (auto)</text>
<text x="1272.0" y="252.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv set vrf default router bgp neighbor swp1 remote-as external</text>
</g>
<text x="800" y="328" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">IPv6 Router Advertisements (every few s): each side learns the peer's fe80:: link-local</text>
<line x1="332" y1="340" x2="1268" y2="340" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<g><title>step 1</title><circle cx="298" cy="322" r="16" fill="#1f2937"/>
<text x="298" y="328" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<text x="800" y="408" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">TCP 179 over fe80::2%swp51 ↔ fe80::1%swp1 · BGP OPEN (ASN 65011 / 65000)</text>
<line x1="332" y1="420" x2="1268" y2="420" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<g><title>step 2</title><circle cx="298" cy="402" r="16" fill="#1f2937"/>
<text x="298" y="408" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<g><title></title><rect x="480" y="458" width="640" height="50" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="800.0" y="489.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">remote-as external → accept any ASN ≠ mine (eBGP); 'internal' = same ASN</text>
</g>
<g><title>step 3</title><circle cx="456" cy="483" r="16" fill="#1f2937"/>
<text x="456" y="489" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
<text x="800" y="566" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">UPDATE: AFI 1 / SAFI 1 (IPv4 unicast) 10.0.0.11/32, next hop = fe80::1 (extended next-hop, RFC 5549)</text>
<line x1="328" y1="578" x2="1268" y2="578" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 4</title><circle cx="298" cy="560" r="16" fill="#1f2937"/>
<text x="298" y="566" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</g>
<text x="800" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">UPDATE: 10.0.0.1/32 + IPv4 prefixes from other leaves, next hop fe80::2 · l2vpn-evpn AF: Type-2/5</text>
<line x1="1272" y1="658" x2="332" y2="658" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 5</title><circle cx="1302" cy="640" r="16" fill="#1f2937"/>
<text x="1302" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
</g>
<g><title></title><rect x="90" y="706" width="476" height="60" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="328.0" y="731.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">FIB: 10.0.0.1/32 via fe80::2 dev swp51</text>
<text x="328.0" y="753.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">zebra installs IPv4 route with IPv6 nexthop</text>
</g>
<g><title>step 6</title><circle cx="66" cy="736" r="16" fill="#1f2937"/>
<text x="66" y="742" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
</g>
<g><title></title><rect x="1034" y="706" width="476" height="60" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1272.0" y="731.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">FIB: 10.0.0.11/32 via fe80::1 dev swp1</text>
<text x="1272.0" y="753.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">ECMP: one next hop per leaf-facing interface</text>
</g>
<g><title>step 6</title><circle cx="1534" cy="736" r="16" fill="#1f2937"/>
<text x="1534" y="742" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
</g>
<g><title>Why and how to observe</title><rect x="48" y="850" width="1060" height="128" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="878" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Why: every fabric link has IDENTICAL config (no addresses, no neighbour ASN), so templates are trivial.</text>
<text x="64" y="904" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Observe: nv show vrf default router bgp neighbor (Remote-AS learned, State Established);</text>
<text x="64" y="930" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">sudo vtysh -c 'show ip bgp neighbors swp51' → 'Extended nexthop capability: advertised and received';</text>
<text x="64" y="956" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ip route → '10.0.0.1 via inet6 fe80::2 dev swp51'. Stuck in Active? Check IPv6 RA on the OTHER end.</text>
<g><title>Legend</title><rect x="1130" y="850" width="422" height="90" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1144" y1="876" x2="1200" y2="876" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1214" y="882" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (BGP / RA)</text>
<line x1="1144" y1="906" x2="1200" y2="906" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow-gray)"/>
<text x="1214" y="912" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Physical link</text>
</g>
</svg>
