<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img">
<title>cl-resource-query: Spectrum ASIC table occupancy (illustrative leaf)</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">cl-resource-query: Spectrum ASIC table occupancy (illustrative leaf)</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">The kernel/FRR RIB can hold more than the ASIC; when a table fills, new entries are CPU-forwarded or dropped while config 'looks fine'</text>
<rect x="48" y="136" width="992" height="580" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
<text x="66" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">sudo cl-resource-query   (used / max, %)</text>
<text x="68" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Host entries (/32, /128 → host table)</text>
<text x="650" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">1,250 / 16,384</text>
<rect x="666" y="196" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="196" width="22" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">8%</text>
<text x="68" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">IPv4 route entries (LPM)</text>
<text x="650" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">41,200 / 81,920</text>
<rect x="666" y="250" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="250" width="146" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">50%</text>
<text x="68" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IPv6 route entries (LPM)</text>
<text x="650" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">120 / 16,384</text>
<rect x="666" y="304" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="304" width="3" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">1%</text>
<text x="68" y="376" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ECMP next hops (members)</text>
<text x="650" y="376" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">420 / 4,096</text>
<rect x="666" y="358" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="358" width="30" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="376" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">10%</text>
<text x="68" y="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ECMP groups</text>
<text x="650" y="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">64 / 512</text>
<rect x="666" y="412" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="412" width="36" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">12%</text>
<text x="68" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">MAC entries (bridge FDB)</text>
<text x="650" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">12,500 / 40,960</text>
<rect x="666" y="466" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="466" width="89" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">31%</text>
<text x="68" y="538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Ingress ACL entries (TCAM)</text>
<text x="650" y="538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">310 / 2,048</text>
<rect x="666" y="520" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="520" width="44" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">15%</text>
<text x="68" y="592" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Egress ACL entries (TCAM)</text>
<text x="650" y="592" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">16 / 1,024</text>
<rect x="666" y="574" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="574" width="5" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="592" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">2%</text>
<text x="68" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Total routes</text>
<text x="650" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">41,320 / 98,304</text>
<rect x="666" y="628" width="290" height="24" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="666" y="628" width="122" height="24" rx="5" fill="#9ccc3c"/>
<text x="968" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">42%</text>
<text x="68" y="698" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">green &lt; 70% · orange 70–90% (NetQ TCA warning) · red ≥ 90% (table-full imminent)</text>
<g><title>What fills it</title><rect x="1060" y="136" width="492" height="134" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1306.0" y="177.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">What fills it</text>
<text x="1306.0" y="200.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">Hosts: ARP/ND neighbours, EVPN host routes</text>
<text x="1306.0" y="222.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">Routes: leaked full tables, no summarisation</text>
<text x="1306.0" y="244.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">ECMP groups: VRFs × distinct next-hop sets</text>
</g>
<g><title>Symptoms at 100%</title><rect x="1060" y="282" width="492" height="134" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="1306.0" y="323.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Symptoms at 100%</text>
<text x="1306.0" y="346.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">route in nv show … rib, traffic blackholes / CPU</text>
<text x="1306.0" y="368.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">switchd log: 'failed to add route — table full'</text>
<text x="1306.0" y="390.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">ACL apply fails; NetQ TCA event fires</text>
</g>
<g><title>Fixes (architectural)</title><rect x="1060" y="428" width="492" height="134" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5"/>
<text x="1306.0" y="469.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Fixes (architectural)</text>
<text x="1306.0" y="492.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">summarise / filter inbound routes</text>
<text x="1306.0" y="514.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">fewer VRFs &amp; VNIs per switch, L3-only designs</text>
<text x="1306.0" y="536.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv set system forwarding profile &lt;p&gt; (switchd restart)</text>
</g>
<g><title>Kernel vs ASIC</title><rect x="1060" y="574" width="492" height="136" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1306.0" y="616.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Kernel vs ASIC</text>
<text x="1306.0" y="639.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">ip route / nv show … rib = what FRR wants</text>
<text x="1306.0" y="661.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">cl-resource-query = what the ASIC holds</text>
<text x="1306.0" y="683.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">the gap between them is the problem</text>
</g>
<g><title>Reading this leaf</title><rect x="48" y="736" width="1504" height="134" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="766" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Reading this leaf: IPv4 routes at 50% is a warning — a leaf should carry fabric prefixes and tenant summaries only; somebody is leaking a full table.</text>
<text x="64" y="794" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">One ACL rule with a port range expands into many TCAM entries (310 entries from ~40 rules is typical). Trend Total routes in NetQ with a TCA.</text>
<text x="64" y="822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">LPM rows hold prefixes (longest-match lookup); host rows hold exact /32 and /128 neighbour entries; the forwarding profile sets the split.</text>
<text x="64" y="850" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Newer releases expose the same data via NVUE (nv show system forwarding resources / platform forwarding-table — verify object name).</text>
</svg>
