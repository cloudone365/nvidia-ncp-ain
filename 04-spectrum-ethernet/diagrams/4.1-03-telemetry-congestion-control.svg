<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" role="img">
<title>Telemetry-based congestion control: switch → receiving SuperNIC → sender rate adjust</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Telemetry-based congestion control: switch → receiving SuperNIC → sender rate adjust</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">DCQCN reacts to ECN marks reflected as CNPs; Spectrum-X adds in-band telemetry so the sender sets rate from measured state</text>
<line x1="220" y1="216" x2="220" y2="850" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="560" y1="216" x2="560" y2="850" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="900" y1="216" x2="900" y2="850" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="1340" y1="216" x2="1340" y2="850" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<g><title>Sender SuperNIC</title><rect x="80" y="150" width="280" height="66" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="220.0" y="178.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Sender SuperNIC</text>
<text x="220.0" y="201.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">BlueField-3 · CC engine on DPA</text>
</g>
<g><title>leaf01</title><rect x="440" y="150" width="240" height="66" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="560.0" y="178.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">leaf01</text>
<text x="560.0" y="201.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SN5600 · egress queue TC3</text>
</g>
<g><title>spine02</title><rect x="780" y="150" width="240" height="66" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="900.0" y="178.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">spine02</text>
<text x="900.0" y="201.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SN5600 · congested port</text>
</g>
<g><title>Receiver SuperNIC</title><rect x="1200" y="150" width="280" height="66" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1340.0" y="178.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Receiver SuperNIC</text>
<text x="1340.0" y="201.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">BlueField-3 · reflects telemetry</text>
</g>
<line x1="220" y1="280" x2="556" y2="280" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>step 1</title><circle cx="250" cy="256" r="16" fill="#1f2937"/>
<text x="250" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<text x="276" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">RoCE data at line rate (400G)</text>
<line x1="560" y1="340" x2="896" y2="340" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="590" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">AR-sprayed packets</text>
<g><title></title><rect x="916" y="366" width="340" height="62" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="1086.0" y="392.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">Queue build-up on egress port:</text>
<text x="1086.0" y="414.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">occupancy crosses ECN min-threshold</text>
</g>
<g><title>step 2</title><circle cx="872" cy="397" r="16" fill="#1f2937"/>
<text x="872" y="403" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<g><title>step 3</title><circle cx="930" cy="456" r="16" fill="#1f2937"/>
<text x="930" y="462" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
<text x="958" y="462" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Packet carries ECN CE mark +</text>
<text x="958" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">in-band telemetry (queue depth, link util)</text>
<line x1="900" y1="500" x2="1336" y2="500" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<line x1="1340" y1="566" x2="224" y2="566" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<g><title>step 4</title><circle cx="1310" cy="542" r="16" fill="#1f2937"/>
<text x="1310" y="548" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</g>
<rect x="631.0" y="578.8" width="298.0" height="20.8" fill="#ffffff"/>
<text x="780" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">CNP (DSCP 48, SP6 strict priority) +</text>
<rect x="643.0" y="600.8" width="274.0" height="20.8" fill="#ffffff"/>
<text x="780" y="616" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">telemetry reflected to the sender</text>
<g><title></title><rect x="70" y="630" width="350" height="50" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="245.0" y="661.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">DPA CC algorithm: rate ← f(measured state)</text>
</g>
<g><title>step 5</title><circle cx="446" cy="655" r="16" fill="#1f2937"/>
<text x="446" y="661" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
</g>
<line x1="220" y1="740" x2="556" y2="740" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>step 6</title><circle cx="250" cy="716" r="16" fill="#1f2937"/>
<text x="250" y="722" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
</g>
<rect x="271" y="706.8" width="314.0" height="20.8" fill="#ffffff"/>
<text x="276" y="722" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Reduced injection rate (per flow / QP)</text>
<line x1="900" y1="800" x2="564" y2="800" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<g><title>step 7</title><circle cx="930" cy="800" r="16" fill="#1f2937"/>
<text x="930" y="806" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
</g>
<rect x="509.0" y="812.8" width="442.0" height="20.8" fill="#ffffff"/>
<text x="730" y="828" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">PFC pause (SP3) only if the queue still reaches xoff —</text>
<rect x="585.0" y="834.8" width="290.0" height="20.8" fill="#ffffff"/>
<text x="730" y="850" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">safety net, not the primary control</text>
<g><title>Why it converges faster</title><rect x="48" y="880" width="1040" height="100" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="908" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Why faster than DCQCN alone: step 5 uses actual queue depth and link utilization, not a binary mark,</text>
<text x="64" y="934" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">so the first rate decision is close to correct. Switch: nv show interface swpN qos roce counters.</text>
<text x="64" y="960" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Host: ethtool -S &lt;if&gt; | grep -E 'cnp|ecn|pause'. Rising PFC = CC losing the race; tune ECN min/max first.</text>
<g><title>Legend</title><rect x="1110" y="880" width="442" height="90" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="906" x2="1180" y2="906" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1194" y="912" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
<line x1="1124" y1="936" x2="1180" y2="936" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="1194" y="942" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Congestion signal (ECN / CNP / PFC)</text>
</g>
</svg>
