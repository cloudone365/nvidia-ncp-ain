<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="100%" role="img">
<title>NetQ agent → server telemetry flow (port 31980) and a Lifecycle Management upgrade job</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1060" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">NetQ agent → server telemetry flow (port 31980) and a Lifecycle Management upgrade job</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">The agent polls NVUE/FRR/Linux state and streams changes; LCM uses SSH credentials, backs up, upgrades, snapshots, restores on failure</text>
<line x1="200" y1="214" x2="200" y2="940" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="520" y1="214" x2="520" y2="940" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="900" y1="214" x2="900" y2="940" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="1340" y1="214" x2="1340" y2="940" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<g><title>leaf01</title><rect x="60" y="140" width="280" height="74" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="200.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">leaf01</text>
<text x="200.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Cumulus Linux</text>
</g>
<g><title>netq-agent (on leaf01)</title><rect x="380" y="140" width="280" height="74" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="520.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">netq-agent (on leaf01)</text>
<text x="520.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">netq config add server …</text>
</g>
<g><title>NetQ server 10.10.0.100</title><rect x="740" y="140" width="320" height="74" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="900.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">NetQ server 10.10.0.100</text>
<text x="900.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Kafka → Cassandra</text>
</g>
<g><title>Operator</title><rect x="1200" y="140" width="280" height="74" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1340.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Operator</text>
<text x="1340.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">netq CLI / UI</text>
</g>
<line x1="200" y1="290" x2="516" y2="290" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 1</title><circle cx="226" cy="248" r="16" fill="#1f2937"/>
<text x="226" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<rect x="245" y="238.8" width="354.0" height="20.8" fill="#ffffff"/>
<text x="250" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">poll per service: NVUE / FRR / ip &amp; bridge,</text>
<rect x="245" y="260.8" width="290.0" height="20.8" fill="#ffffff"/>
<text x="250" y="276" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">sensors, RoCE counters, WJH records</text>
<line x1="520" y1="370" x2="896" y2="370" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>step 2</title><circle cx="546" cy="328" r="16" fill="#1f2937"/>
<text x="546" y="334" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<rect x="565" y="318.8" width="274.0" height="20.8" fill="#ffffff"/>
<text x="570" y="334" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">TCP 31980 (mgmt VRF): heartbeat +</text>
<rect x="565" y="340.8" width="282.0" height="20.8" fill="#ffffff"/>
<text x="570" y="356" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">state deltas each polling interval</text>
<g><title></title><rect x="700" y="392" width="600" height="40" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1000.0" y="418.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">agent Fresh; Kafka → processors → Cassandra, keyed by hostname + time</text>
</g>
<g><title>step 3</title><circle cx="678" cy="412" r="16" fill="#1f2937"/>
<text x="678" y="418" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
<line x1="1340" y1="500" x2="904" y2="500" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 4</title><circle cx="926" cy="458" r="16" fill="#1f2937"/>
<text x="926" y="464" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</g>
<rect x="945" y="448.8" width="138.0" height="20.8" fill="#ffffff"/>
<text x="950" y="464" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">netq check bgp ·</text>
<rect x="945" y="470.8" width="370.0" height="20.8" fill="#ffffff"/>
<text x="950" y="486" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">netq show roce-counters leaf01 swp1 around 1h</text>
<line x1="900" y1="560" x2="1336" y2="560" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 5</title><circle cx="926" cy="540" r="16" fill="#1f2937"/>
<text x="926" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
</g>
<rect x="945" y="530.8" width="450.0" height="20.8" fill="#ffffff"/>
<text x="950" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">validation result / time-series answer (json available)</text>
<rect x="48" y="590" width="1504" height="364" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="61" y="602.8" width="770.0" height="20.8" fill="#ffffff"/>
<text x="66" y="618" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5f6b7a" text-anchor="start">LCM job: netq lcm upgrade cl-image name Upgrade-Leafs cl-version 5.11.0 hostnames leaf01,leaf02</text>
<rect x="61" y="624.8" width="554.0" height="20.8" fill="#ffffff"/>
<text x="66" y="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5f6b7a" text-anchor="start">order leaf01,leaf02 run-restore-on-failure run-snapshot-before-after</text>
<line x1="1340" y1="700" x2="904" y2="700" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 6</title><circle cx="926" cy="680" r="16" fill="#1f2937"/>
<text x="926" y="686" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
</g>
<rect x="945" y="670.8" width="402.0" height="20.8" fill="#ffffff"/>
<text x="950" y="686" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">netq lcm add credentials · add cl-image · upgrade</text>
<line x1="900" y1="790" x2="204" y2="790" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>step 7</title><circle cx="226" cy="748" r="16" fill="#1f2937"/>
<text x="226" y="754" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
</g>
<rect x="245" y="738.8" width="522.0" height="20.8" fill="#ffffff"/>
<text x="250" y="754" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">SSH: back up config (nv config show -o yaml) · snapshot 'before'</text>
<rect x="245" y="760.8" width="242.0" height="20.8" fill="#ffffff"/>
<text x="250" y="776" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">copy image · install · reboot</text>
<line x1="200" y1="870" x2="896" y2="870" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>step 8</title><circle cx="226" cy="828" r="16" fill="#1f2937"/>
<text x="226" y="834" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
</g>
<rect x="245" y="818.8" width="538.0" height="20.8" fill="#ffffff"/>
<text x="250" y="834" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">agent reconnects → snapshot 'after' → compare BGP/EVPN/interfaces;</text>
<rect x="245" y="840.8" width="290.0" height="20.8" fill="#ffffff"/>
<text x="250" y="856" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">mismatch + restore flag → roll back</text>
<g><title></title><rect x="700" y="896" width="640" height="40" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1020.0" y="922.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">next host in 'order' (protects MLAG pairs) · netq lcm show upgrade-jobs cl-image</text>
</g>
<g><title>step 9</title><circle cx="678" cy="916" r="16" fill="#1f2937"/>
<text x="678" y="922" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
</g>
<text x="48" y="990" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">Rotten agent = steps 2–3 broken (usually missing 'vrf mgmt'); every later result is stale.</text>
<g><title>Legend</title><rect x="1110" y="966" width="442" height="90" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="992" x2="1180" y2="992" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1194" y="998" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (CLI / API)</text>
<line x1="1124" y1="1022" x2="1180" y2="1022" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1194" y="1028" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Management / telemetry</text>
</g>
</svg>
