<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img">
<title>VLAN-aware bridge br_default, SVIs with VRR, LACP bonds and an MLAG pair</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">VLAN-aware bridge br_default, SVIs with VRR, LACP bonds and an MLAG pair</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">One bridge carries all VLANs; access ports untagged (PVID), trunks tagged; SVI vlanN routes; clagd syncs MAC/LACP over the peerlink</text>
<line x1="588" y1="196" x2="1012" y2="196" stroke="#e07b00" stroke-width="4"/>
<line x1="588" y1="220" x2="1012" y2="220" stroke="#e07b00" stroke-width="4"/>
<text x="800" y="184" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">peerlink bond: swp49, swp50</text>
<line x1="592" y1="262" x2="1008" y2="262" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<text x="800" y="290" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">clagd over peerlink.4094 (IPv6 LL): MAC + LACP sync</text>
<line x1="150" y1="300" x2="190" y2="520" stroke="#e07b00" stroke-width="4"/>
<rect x="114.0" y="383.8" width="42.0" height="20.8" fill="#ffffff"/>
<text x="156" y="399" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">swp5</text>
<line x1="190" y1="300" x2="246" y2="520" stroke="#e07b00" stroke-width="4"/>
<rect x="222" y="383.8" width="42.0" height="20.8" fill="#ffffff"/>
<text x="227" y="399" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">swp6</text>
<line x1="480" y1="300" x2="560" y2="520" stroke="#e07b00" stroke-width="4"/>
<rect x="521" y="383.8" width="42.0" height="20.8" fill="#ffffff"/>
<text x="526" y="399" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">swp1</text>
<line x1="1080" y1="300" x2="660" y2="520" stroke="#e07b00" stroke-width="4"/>
<rect x="900" y="383.8" width="42.0" height="20.8" fill="#ffffff"/>
<text x="905" y="399" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">swp1</text>
<line x1="1200" y1="300" x2="994" y2="520" stroke="#e07b00" stroke-width="4"/>
<rect x="1116" y="383.8" width="58.0" height="20.8" fill="#ffffff"/>
<text x="1121" y="399" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">swp2s0</text>
<line x1="1450" y1="300" x2="1382" y2="520" stroke="#e07b00" stroke-width="4"/>
<rect x="1426" y="383.8" width="42.0" height="20.8" fill="#ffffff"/>
<text x="1431" y="399" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">swp3</text>
<g><title>leaf01 (MLAG primary, prio 1000)</title><rect x="48" y="150" width="540" height="150" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="318.0" y="188.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">leaf01 (MLAG primary, prio 1000)</text>
<text x="318.0" y="211.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">br_default: VLAN 10, 20, 30</text>
<text x="318.0" y="233.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">vlan10 10.1.10.1/24 · VRR 10.1.10.254 / 00:00:5e:00:01:0a</text>
<text x="318.0" y="255.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">vlan20 10.1.20.1/24</text>
<text x="318.0" y="277.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">mlag mac 44:38:39:BE:EF:AA · backup 192.168.200.12 (mgmt)</text>
</g>
<g><title>leaf02 (MLAG secondary, prio 32768)</title><rect x="1012" y="150" width="540" height="150" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1282.0" y="188.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">leaf02 (MLAG secondary, prio 32768)</text>
<text x="1282.0" y="211.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">br_default: VLAN 10, 20, 30</text>
<text x="1282.0" y="233.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">vlan10 10.1.10.2/24 · VRR 10.1.10.254 / 00:00:5e:00:01:0a</text>
<text x="1282.0" y="255.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">vlan20 10.1.20.2/24</text>
<text x="1282.0" y="277.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">mlag mac 44:38:39:BE:EF:AA · backup 192.168.200.11 (mgmt)</text>
</g>
<g><title>storage01</title><rect x="48" y="520" width="340" height="96" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5"/>
<text x="218.0" y="552.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">storage01</text>
<text x="218.0" y="575.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">bond1 LACP (swp5, swp6)</text>
<text x="218.0" y="597.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">access VLAN 20, lacp-rate fast</text>
</g>
<g><title>server01 (dual-attached)</title><rect x="436" y="520" width="340" height="96" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="606.0" y="552.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">server01 (dual-attached)</text>
<text x="606.0" y="575.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">bond0 LACP · 10.1.10.10/24</text>
<text x="606.0" y="597.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">leaf side: bond1, mlag id 1 on both peers</text>
</g>
<g><title>host-trunk</title><rect x="824" y="520" width="340" height="96" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="994.0" y="552.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">host-trunk</text>
<text x="994.0" y="575.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">swp2s0 trunk VLAN 10,20</text>
<text x="994.0" y="597.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">tagged frames; native VLAN 1 untagged</text>
</g>
<g><title>legacy-host</title><rect x="1212" y="520" width="340" height="96" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="1382.0" y="552.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">legacy-host</text>
<text x="1382.0" y="575.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">swp3 access VLAN 10</text>
<text x="1382.0" y="597.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">untagged frames (PVID 10)</text>
</g>
<g><title>bridge VLAN table</title><rect x="48" y="650" width="600" height="226" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">nv show bridge domain br_default vlan (illustrative)</text>
<text x="64" y="710" font-family="'DejaVu Sans Mono', 'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">VLAN   Flags  Member ports</text>
<text x="64" y="740" font-family="'DejaVu Sans Mono', 'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">1      PVID   swp2s0        ← native</text>
<text x="64" y="770" font-family="'DejaVu Sans Mono', 'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">10     PVID   swp3, bond1   ← access</text>
<text x="64" y="800" font-family="'DejaVu Sans Mono', 'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">10,20         swp2s0        ← tagged</text>
<text x="64" y="830" font-family="'DejaVu Sans Mono', 'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">20     PVID   storage bond  ← access</text>
<g><title>VRR and MLAG rules</title><rect x="664" y="650" width="640" height="226" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="680" y="680" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">VRR (active-active): both leaves own 10.1.10.254 + virtual</text>
<text x="680" y="705" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">MAC; whichever leaf the host bond hashes to answers.</text>
<text x="680" y="730" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">VRRP would be active-standby.</text>
<text x="680" y="755" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">MLAG: same mlag mac and bond mlag id on both peers;</text>
<text x="680" y="780" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">priorities differ (lower = primary); backup IP = the</text>
<text x="680" y="805" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">OTHER peer's eth0, in vrf mgmt.</text>
<text x="680" y="830" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">GPU RoCE ports are NOT MLAG'd: each SuperNIC</text>
<text x="680" y="855" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">single-attaches to a rail leaf.</text>
<g><title>Legend</title><rect x="1320" y="650" width="232" height="90" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1334" y1="676" x2="1390" y2="676" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1404" y="682" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Ethernet link</text>
<line x1="1334" y1="706" x2="1390" y2="706" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1404" y="712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">clagd sync</text>
</g>
</svg>
