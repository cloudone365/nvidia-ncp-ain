<text x="870.0" y="347.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">EVPN, VRFs, RoCE profile</text>
</g>
<g><title>leaf02 (sim)</title><rect x="1000" y="300" width="200" height="60" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1100.0" y="323.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">leaf02 (sim)</text>
<text x="1100.0" y="347.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">EVPN, VRFs, RoCE profile</text>
</g>
