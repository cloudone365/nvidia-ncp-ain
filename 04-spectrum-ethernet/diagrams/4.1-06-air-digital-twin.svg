<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">NVIDIA Air (DSX Air) digital-twin workflow: validate the control plane before hardware</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Same Cumulus/SONiC/NetQ images, same NVUE YAML and Ansible — no Spectrum ASIC, so RoCE / AR / PFC / WJH data-plane behaviour is not reproduced</text>
<g><title>Git repository templates + host_vars</title><rect x="60" y="170" width="260" height="90" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="190.0" y="198.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Git repository</text>
<text x="190.0" y="220.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">templates + host_vars</text>
<text x="190.0" y="246.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">rendered/ NVUE YAML per switch</text>
</g>
<g><title>CI runner Ansible + Air SDK/API</title><rect x="400" y="170" width="260" height="90" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="530.0" y="198.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">CI runner</text>
<text x="530.0" y="220.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Ansible + Air SDK/API</text>
<text x="530.0" y="246.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">ansible-playbook --check --diff</text>
</g>
<g><title>NVIDIA Air simulation (hosted)</title><rect x="730" y="140" width="810" height="330" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="744" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">NVIDIA Air simulation (hosted)</text>
