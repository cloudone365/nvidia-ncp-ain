</g>
<g><title>server02 (Ubuntu)</title><rect x="1000" y="400" width="200" height="50" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="1100.0" y="429.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">server02 (Ubuntu)</text>
</g>
<line x1="870" y1="250" x2="870" y2="300" stroke="#6b7280" stroke-width="2.5"/>
