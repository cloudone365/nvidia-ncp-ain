<text x="1198" y="867" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Management / telemetry</text>
<line x1="1124" y1="891" x2="1184" y2="891" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1198" y="897" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
</g>
<text x="60" y="835" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">1 config CLI / config_db.json → CONFIG_DB   2 *mgrd derive APPL_DB   3 orchagent → ASIC_DB   4 syncd reads ASIC_DB   5 SAI/SDK programs the ASIC</text>
</svg>
