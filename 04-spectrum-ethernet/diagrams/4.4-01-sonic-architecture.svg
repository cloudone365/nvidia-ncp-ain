<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">SONiC architecture: containers around Redis databases, SAI, Spectrum ASIC</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Every daemon reads/writes tables in Redis; orchagent (swss) turns APPL_DB intent into SAI objects in ASIC_DB; syncd calls NVIDIA's Spectrum SAI</text>
