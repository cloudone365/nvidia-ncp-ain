<text x="175.0" y="224.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">+ fpmsyncd → APPL_DB</text>
</g>
