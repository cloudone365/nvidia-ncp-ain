<g><title>Spectrum ASIC (SN2000 – SN5000) </title><rect x="840" y="700" width="700" height="100" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1190.0" y="724.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Spectrum ASIC (SN2000 – SN5000)</text>
<text x="1190.0" y="772.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">L2/L3/VXLAN tables · PFC/ECN/buffers · WJH</text>
<text x="1190.0" y="790.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">SAI = vendor-neutral C API; NVIDIA supplies the Spectrum implementation</text>
</g>
<line x1="1190" y1="640" x2="1190" y2="700" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1280.0" y="670.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SDK → hardware</text>
<g><title>Step 5</title><circle cx="1150" cy="670" r="16" fill="#1f2937"/><text x="1150" y="676" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<g><title>Note</title><rect x="60" y="700" width="700" height="100" rx="6" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="72" y="722" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Troubleshooting rule: 'route exists but does not forward' → name the whiteboard it is missing from.</text>
<text x="72" y="740" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">APPL_DB has it, ASIC_DB does not → orchagent rejected it (show logging orchagent).</text>
<text x="72" y="758" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">ASIC_DB has it, hardware does not → syncd/SAI failed (docker logs syncd).</text>
<g><title>Legend</title><rect x="1110" y="805" width="430" height="112" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="831" x2="1184" y2="831" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
