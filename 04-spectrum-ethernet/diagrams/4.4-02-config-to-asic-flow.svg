<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="100%" role="img">
<title>From config_db.json to the ASIC: one static route's journey through SONiC</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1040" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">From config_db.json to the ASIC: one static route's journey through SONiC</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">config load (merge, live) vs config reload (rebuild, restarts swss/syncd). Each hop leaves a table you can inspect</text>
<line x1="150" y1="214" x2="150" y2="890" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="410" y1="214" x2="410" y2="890" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="670" y1="214" x2="670" y2="890" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="930" y1="214" x2="930" y2="890" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="1190" y1="214" x2="1190" y2="890" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="1440" y1="214" x2="1440" y2="890" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<g><title>Operator</title><rect x="48" y="140" width="204" height="74" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="150.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Operator</text>
<text x="150.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">sudo config …</text>
</g>
<g><title>CONFIG_DB (4)</title><rect x="290" y="140" width="240" height="74" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="410.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">CONFIG_DB (4)</text>
<text x="410.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">/etc/sonic/config_db.json</text>
</g>
<g><title>bgp container</title><rect x="560" y="140" width="220" height="74" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="670.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">bgp container</text>
<text x="670.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">bgpcfgd · FRR · fpmsyncd</text>
</g>
<g><title>APPL_DB (0) · swss</title><rect x="810" y="140" width="240" height="74" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="930.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">APPL_DB (0) · swss</text>
<text x="930.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">*mgrd · orchagent</text>
</g>
<g><title>ASIC_DB (1) · syncd</title><rect x="1080" y="140" width="220" height="74" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1190.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">ASIC_DB (1) · syncd</text>
<text x="1190.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Spectrum SAI</text>
</g>
<g><title>Spectrum ASIC</title><rect x="1330" y="140" width="222" height="74" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1441.0" y="172.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Spectrum ASIC</text>
<text x="1441.0" y="195.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">hardware tables</text>
</g>
<line x1="150" y1="290" x2="406" y2="290" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 1</title><circle cx="176" cy="248" r="16" fill="#1f2937"/>
<text x="176" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<rect x="195" y="238.8" width="450.0" height="20.8" fill="#ffffff"/>
<text x="200" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">config route add prefix 10.9.0.0/24 nexthop 192.168.1.1</text>
<rect x="195" y="260.8" width="242.0" height="20.8" fill="#ffffff"/>
<text x="200" y="276" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">(or config load -y file.json)</text>
<g><title></title><rect x="330" y="318" width="560" height="40" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="610.0" y="344.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">STATIC_ROUTE|default|10.9.0.0/24 written: live, not persisted</text>
</g>
<g><title>step 2</title><circle cx="308" cy="338" r="16" fill="#1f2937"/>
<text x="308" y="344" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<line x1="410" y1="428" x2="666" y2="428" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 3</title><circle cx="436" cy="386" r="16" fill="#1f2937"/>
<text x="436" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
<rect x="455" y="376.8" width="258.0" height="20.8" fill="#ffffff"/>
<text x="460" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">keyspace notification → bgpcfgd</text>
<rect x="455" y="398.8" width="274.0" height="20.8" fill="#ffffff"/>
<text x="460" y="414" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">renders the static route into FRR</text>
<line x1="670" y1="508" x2="926" y2="508" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 4</title><circle cx="696" cy="466" r="16" fill="#1f2937"/>
<text x="696" y="472" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</g>
<rect x="715" y="456.8" width="410.0" height="20.8" fill="#ffffff"/>
<text x="720" y="472" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">zebra → fpmsyncd → APPL_DB ROUTE_TABLE:10.9.0.0/24</text>
<rect x="715" y="478.8" width="314.0" height="20.8" fill="#ffffff"/>
<text x="720" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">nexthop=192.168.1.1 ifname=Ethernet248</text>
<g><title></title><rect x="800" y="538" width="700" height="40" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1150.0" y="564.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">orchagent RouteOrch: resolve next hop (NEIGH_TABLE), check CRM, build route_entry</text>
</g>
<g><title>step 5</title><circle cx="778" cy="558" r="16" fill="#1f2937"/>
<text x="778" y="564" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
</g>
<line x1="930" y1="650" x2="1186" y2="650" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 6</title><circle cx="956" cy="608" r="16" fill="#1f2937"/>
<text x="956" y="614" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
</g>
<rect x="975" y="598.8" width="322.0" height="20.8" fill="#ffffff"/>
<text x="980" y="614" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ASIC_STATE:SAI_OBJECT_TYPE_ROUTE_ENTRY:</text>
<rect x="975" y="620.8" width="306.0" height="20.8" fill="#ffffff"/>
<text x="980" y="636" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">{vr, dest 10.9.0.0/24} → next_hop OID</text>
<line x1="1190" y1="730" x2="1436" y2="730" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>step 7</title><circle cx="1216" cy="688" r="16" fill="#1f2937"/>
<text x="1216" y="694" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
</g>
<rect x="1235" y="678.8" width="290.0" height="20.8" fill="#ffffff"/>
<text x="1240" y="694" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">sai_route_api-&gt;create_route_entry()</text>
<rect x="1235" y="700.8" width="170.0" height="20.8" fill="#ffffff"/>
<text x="1240" y="716" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">via the Spectrum SDK</text>
<line x1="1440" y1="808" x2="1194" y2="808" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>step 8</title><circle cx="1216" cy="766" r="16" fill="#1f2937"/>
<text x="1216" y="772" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
</g>
<rect x="1235" y="756.8" width="258.0" height="20.8" fill="#ffffff"/>
<text x="1240" y="772" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">flex counters → COUNTERS_DB (2)</text>
<rect x="1235" y="778.8" width="210.0" height="20.8" fill="#ffffff"/>
<text x="1240" y="794" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">oper state → STATE_DB (6)</text>
<line x1="150" y1="870" x2="406" y2="870" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>step 9</title><circle cx="176" cy="828" r="16" fill="#1f2937"/>
<text x="176" y="834" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
</g>
<rect x="195" y="818.8" width="386.0" height="20.8" fill="#ffffff"/>
<text x="200" y="834" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">sudo config save -y → /etc/sonic/config_db.json</text>
<rect x="195" y="840.8" width="290.0" height="20.8" fill="#ffffff"/>
<text x="200" y="856" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">(only now does it survive a reboot)</text>
<g><title>Inspect each hop</title><rect x="48" y="912" width="1040" height="112" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="942" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Inspect: sonic-db-cli CONFIG_DB hgetall 'STATIC_ROUTE|default|10.9.0.0/24'</text>
<text x="64" y="970" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">redis-cli -n 0 hgetall 'ROUTE_TABLE:10.9.0.0/24' · redis-cli -n 1 keys '*ROUTE_ENTRY*10.9.0.0*'</text>
<text x="64" y="998" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">show ip route · crm show resources all · show logging orchagent</text>
<g><title>Legend</title><rect x="1110" y="904" width="442" height="120" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="930" x2="1180" y2="930" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1194" y="936" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (DB / FRR)</text>
<line x1="1124" y1="960" x2="1180" y2="960" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1194" y="966" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Hardware programming</text>
<line x1="1124" y1="990" x2="1180" y2="990" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1194" y="996" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Management / telemetry</text>
</g>
</svg>
