<g><title>Step 6</title><circle cx="850" cy="606" r="16" fill="#1f2937"/><text x="850" y="612" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<line x1="1150" y1="700" x2="1440" y2="700" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1295.0" y="724.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">sai_route_api-&gt;create_route_entry() via Spectrum SDK</text>
<g><title>Step 7</title><circle cx="1180" cy="676" r="16" fill="#1f2937"/><text x="1180" y="682" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<line x1="1440" y1="770" x2="1150" y2="770" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1295.0" y="794.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">flex counters → COUNTERS_DB (2); oper state → STATE_DB (6)</text>
<g><title>Step 8</title><circle cx="1410" cy="746" r="16" fill="#1f2937"/><text x="1410" y="752" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g>
<line x1="160" y1="840" x2="480" y2="840" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="320.0" y="864.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">sudo config save -y  → /etc/sonic/config_db.json (only now does it survive a reboot)</text>
<g><title>Step 9</title><circle cx="190" cy="816" r="16" fill="#1f2937"/><text x="190" y="822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">9</text></g>
<g><title>Note</title><rect x="60" y="905" width="1000" height="70" rx="6" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="72" y="927" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Inspect each hop: sonic-db-cli CONFIG_DB hgetall 'STATIC_ROUTE|default|10.9.0.0/24' · redis-cli -n 0 hgetall 'ROUTE_TABLE:10.9.0.0/24' ·</text>
<text x="72" y="945" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">redis-cli -n 1 keys '*ROUTE_ENTRY*10.9.0.0*' · show ip route · crm show resources all · show logging orchagent</text>
