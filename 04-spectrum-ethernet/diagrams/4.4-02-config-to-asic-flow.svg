<rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">From config_db.json to the ASIC: one static route's journey through SONiC</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">config load (merge, live) vs config reload (rebuild, restarts swss/syncd). Each hop leaves a table you can inspect with redis-cli / sonic-db-cli</text>
