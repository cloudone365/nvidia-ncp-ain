<text x="480.0" y="353.7" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">STATIC_ROUTE|default|10.9.0.0/24 written (immediately, not persisted)</text>
</g>
<g><title>Step 2</title><circle cx="225" cy="350" r="16" fill="#1f2937"/><text x="225" y="356" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
