<text x="160.0" y="200.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">sudo config …</text>
</g>
<g><title>CONFIG_DB (4) /etc/sonic/config_db.json</title><rect x="350" y="150" width="260" height="70" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
