<g><title>Step 3</title><circle cx="510" cy="396" r="16" fill="#1f2937"/><text x="510" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>APPL_DB (0): ROUTE_TABLE:10.9.0.0/24 nexthop=192.168.1.1 ifname=Ethernet248</title><rect x="560" y="466" width="520" height="48" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="820.0" y="493.7" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">APPL_DB (0): ROUTE_TABLE:10.9.0.0/24 nexthop=192.168.1.1 ifname=Ethernet248</text>
</g>
<g><title>Step 4</title><circle cx="535" cy="490" r="16" fill="#1f2937"/><text x="535" y="496" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<g><title>orchagent: resolve next hop (NEIGH_TABLE), check CRM, build SAI route_entry</title><rect x="560" y="536" width="520" height="48" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="820.0" y="563.7" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">orchagent: resolve next hop (NEIGH_TABLE), check CRM, build SAI route_entry</text>
</g>
<g><title>Step 5</title><circle cx="535" cy="560" r="16" fill="#1f2937"/><text x="535" y="566" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<line x1="820" y1="630" x2="1150" y2="630" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
