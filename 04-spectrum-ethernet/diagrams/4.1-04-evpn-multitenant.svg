<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Multi-tenant BGP-EVPN / VXLAN on Spectrum-X: two tenant VRFs, L2VNI + L3VNI</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Underlay: BGP unnumbered (IPv6 link-local, RFC 5549). Overlay: EVPN Type-2 (MAC/IP in L2VNI) and Type-5 (prefix in L3VNI) between VTEPs</text>
