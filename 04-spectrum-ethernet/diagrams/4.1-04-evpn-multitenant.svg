<text x="980.0" y="200.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">AS 65000 · reflects Type-2/5</text>
</g>
<text x="48" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">eBGP unnumbered, l2vpn-evpn AF:</text>
