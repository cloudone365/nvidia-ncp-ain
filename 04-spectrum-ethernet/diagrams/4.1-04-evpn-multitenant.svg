<g><title>spine01</title><rect x="480" y="150" width="280" height="64" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="620.0" y="177.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">spine01</text>
<text x="620.0" y="200.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">AS 65000 · EVPN RR-less eBGP</text>
</g>
<g><title>spine02</title><rect x="840" y="150" width="280" height="64" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
