<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Multi-tenant BGP-EVPN / VXLAN on Spectrum-X: two tenant VRFs, L2VNI + L3VNI</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Underlay: BGP unnumbered (IPv6 link-local, RFC 5549). Overlay: EVPN Type-2 (MAC/IP, L2VNI) and Type-5 (prefix, L3VNI)</text>
<line x1="620" y1="214" x2="380" y2="400" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/>
