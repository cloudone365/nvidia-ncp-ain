<rect x="495" y="531" width="610" height="25" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="800" y="548" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">green: VXLAN VNI 100200 (tenantB) — different RT, separate routing table</text>
<g><title>Note</title><rect x="560" y="585" width="480" height="140" rx="6" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="572" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">Isolation = different Route-Targets:</text>
<text x="572" y="627" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">tenantA imports only RT 65011:100100 / 65012:100100</text>
<text x="572" y="646" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">tenantB imports only RT 65011:100200 / 65012:100200</text>
<text x="572" y="665" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">leaf02 tenantB RIB never learns 10.100.1.0/24.</text>
<text x="572" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">Pure-L3 GPU fabrics skip L2VNIs: Type-5 only, no BUM.</text>
