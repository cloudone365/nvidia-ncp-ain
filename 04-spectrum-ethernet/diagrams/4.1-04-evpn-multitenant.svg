<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img">
<title>Multi-tenant BGP-EVPN / VXLAN on Spectrum-X: two tenant VRFs, L2VNI + L3VNI</title>
<defs>
