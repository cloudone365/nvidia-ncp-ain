<text x="1220.0" y="452.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">lo 10.0.0.12 · AS 65012</text>
<text x="1220.0" y="474.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">VXLAN UDP 4789 · encap/decap in ASIC</text>
</g>
