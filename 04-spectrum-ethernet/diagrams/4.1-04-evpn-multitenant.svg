<g><title>Isolation note</title><rect x="560" y="530" width="480" height="168" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="576" y="556" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Isolation = different Route-Targets:</text>
<text x="576" y="582" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">tenantA imports only RT 65011:100100 / 65012:100100</text>
<text x="576" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">tenantB imports only RT 65011:100200 / 65012:100200</text>
<text x="576" y="634" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">leaf02 tenantB RIB never learns 10.100.1.0/24.</text>
<text x="576" y="660" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">L2VNI 10100 carries Type-2 host MAC/IP routes.</text>
<text x="576" y="686" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Pure-L3 GPU fabrics skip L2VNIs: Type-5 only, no BUM.</text>
<g><title>Legend</title><rect x="560" y="716" width="480" height="150" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
