<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img">
<title>RoCE telemetry in NetQ: PFC / ECN counters, roce-config, WJH buffer drops</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">RoCE telemetry in NetQ: PFC / ECN counters, roce-config, WJH buffer drops</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Slow receiver dgx01: where each symptom appears, which direction the PFC counter moves, and which NetQ view shows it</text>
<g><title>Reading the counters</title><rect x="48" y="136" width="440" height="250" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="166" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Reading switch-port PFC counters</text>
<text x="64" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">rx on a host port = host NIC pausing the</text>
<text x="64" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">leaf → host cannot drain (slow receiver)</text>
<text x="64" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">tx on a host port = leaf pausing the host</text>
<text x="64" y="286" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">→ leaf buffers toward the destination fill</text>
<text x="64" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">rx on an uplink = spine pausing the leaf</text>
<text x="64" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ECN marked, no PFC = CC is winning</text>
<g><title>WJH record</title><rect x="48" y="406" width="440" height="160" rx="8" fill="#ffd9d9" stroke="#d93025" stroke-width="2"/></g>
<text x="64" y="436" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">WJH (only if something is lossy)</text>
<text x="64" y="466" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">leaf02 left 'lossy': 'Tail drop' 1 204 pkts,</text>
<text x="64" y="496" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">10.1.3.7 → 10.1.3.22 udp 4791, 7 s window.</text>
<text x="64" y="526" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Buffer category = PFC did not protect it.</text>
<g><title>step 4</title><circle cx="470" cy="420" r="16" fill="#1f2937"/>
<text x="470" y="426" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</g>
<g><title>many senders (all-reduce step)</title><rect x="560" y="136" width="440" height="60" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="780.0" y="161.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">many senders (all-reduce step)</text>
<text x="780.0" y="183.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">RoCEv2 UDP 4791 → 10.1.3.22</text>
</g>
<g><title>spine02 (SN5600)</title><rect x="560" y="246" width="440" height="60" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="780.0" y="271.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">spine02 (SN5600)</text>
<text x="780.0" y="293.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">RoCE lossless</text>
</g>
<g><title>leaf01 (SN5600)</title><rect x="520" y="400" width="520" height="116" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="780.0" y="431.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">leaf01 (SN5600)</text>
<text x="780.0" y="454.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">swp12 (to dgx01): PFC rx ↑ · ECN marked ↑</text>
<text x="780.0" y="476.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">swp61 (uplink): PFC tx ↑ (spine02 sees rx)</text>
<text x="780.0" y="498.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">netq show roce-counters leaf01 swp12 | swp61</text>
</g>
<g><title>dgx01 SuperNIC (swp12)</title><rect x="560" y="640" width="440" height="80" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="780.0" y="664.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">dgx01 SuperNIC (swp12)</text>
<text x="780.0" y="686.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">slow receiver · host: ethtool -S</text>
<text x="780.0" y="708.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">tx_prio3_pause ↑ (it is sending PAUSE)</text>
</g>
<line x1="720" y1="196" x2="720" y2="242" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<line x1="720" y1="306" x2="720" y2="396" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<line x1="720" y1="516" x2="720" y2="636" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<line x1="880" y1="640" x2="880" y2="520" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<g><title>step 1</title><circle cx="910" cy="590" r="16" fill="#1f2937"/>
<text x="910" y="596" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<text x="930" y="596" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="start">PFC prio 3</text>
<g><title>step 2</title><circle cx="1060" cy="430" r="16" fill="#1f2937"/>
<text x="1060" y="436" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<line x1="880" y1="400" x2="880" y2="310" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<g><title>step 3</title><circle cx="910" cy="360" r="16" fill="#1f2937"/>
<text x="910" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
<text x="930" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="start">PFC prio 3</text>
<rect x="1100" y="136" width="452" height="592" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1118" y="166" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#5f6b7a" text-anchor="start">NetQ views</text>
<g><title>netq show roce-config</title><rect x="1118" y="182" width="416" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1326.0" y="222.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">netq show roce-config</text>
<text x="1326.0" y="245.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">mode · PFC prio · ECN min/max · trust</text>
</g>
<g><title>netq check roce</title><rect x="1118" y="290" width="416" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1326.0" y="330.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">netq check roce</text>
<text x="1326.0" y="353.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">flags the one leaf left 'lossy'</text>
</g>
<g><title>netq show roce-counters</title><rect x="1118" y="398" width="416" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1326.0" y="438.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">netq show roce-counters</text>
<text x="1326.0" y="461.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">&lt;host&gt; &lt;port&gt; [ingress | egress | pool]</text>
</g>
<g><title>netq show wjh-drop buffer</title><rect x="1118" y="506" width="416" height="90" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="1326.0" y="546.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">netq show wjh-drop buffer</text>
<text x="1326.0" y="569.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">Tail drop · WRED · PFC-WD + 5-tuple</text>
</g>
<g><title>netq add tca …</title><rect x="1118" y="614" width="416" height="90" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1326.0" y="654.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">netq add tca …</text>
<text x="1326.0" y="677.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">alert on PFC pause / ECN rate thresholds</text>
</g>
<text x="48" y="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">① dgx01 cannot drain → it pauses leaf01</text>
<text x="48" y="626" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">② leaf01 queue grows → ECN marks; CNPs slow senders</text>
<text x="48" y="652" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">③ ingress PG fills → leaf01 pauses spine02</text>
<text x="48" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">④ any lossy hop → WJH buffer drop</text>
<text x="48" y="778" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Workflow for 'job X is slow': netq check roce → netq show roce-counters on the suspect leaf's host ports</text>
<text x="48" y="804" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">(rx pause = slow host) and uplinks (rx pause = spine congestion) → correlate with netq show events type roce</text>
<text x="48" y="830" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">and netq show wjh-drop buffer → fix the slow host or the ECN thresholds before touching PFC.</text>
<g><title>Legend</title><rect x="1100" y="752" width="452" height="90" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1114" y1="778" x2="1170" y2="778" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1184" y="784" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
<line x1="1114" y1="808" x2="1170" y2="808" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="1184" y="814" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Congestion signal (PFC / ECN)</text>
</g>
</svg>
