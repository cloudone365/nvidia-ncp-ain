<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="100%" role="img">
<title>Troubleshooting ladder: link → LLDP → bridge → L3 → ASIC → counters/WJH → cl-support</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1050" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Troubleshooting ladder: link → LLDP → bridge → L3 → ASIC → counters/WJH → cl-support</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Start at rung 1 and verify each rung before moving on; the symptom usually tells you which rung the exam means</text>
<g><title>1  Link</title><rect x="48" y="136" width="300" height="84" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="198.0" y="185.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">1  Link</text>
</g>
<g><title></title><rect x="372" y="136" width="1180" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="962.0" y="173.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv show interface swpN link · counters · transceiver · mlxlink -d &lt;dev&gt; -m</text>
<text x="962.0" y="195.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">admin/oper, speed, FEC, autoneg, CRC — mismatched FEC/speed is the #1 cause of a down 400G/800G link</text>
</g>
<line x1="198" y1="220" x2="198" y2="236" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>2  LLDP / cabling</title><rect x="48" y="238" width="300" height="84" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="198.0" y="287.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">2  LLDP / cabling</text>
</g>
<g><title></title><rect x="372" y="238" width="1180" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="962.0" y="275.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv show interface swpN lldp</text>
<text x="962.0" y="297.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">are you plugged into what the design says (rail n → leaf n)?</text>
</g>
<line x1="198" y1="322" x2="198" y2="338" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>3  Bridge / VLAN / MLAG</title><rect x="48" y="340" width="300" height="84" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="198.0" y="389.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">3  Bridge / VLAN / MLAG</text>
</g>
<g><title></title><rect x="372" y="340" width="1180" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="962.0" y="377.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv show bridge domain br_default vlan · mac-table · bridge fdb show · nv show mlag consistency-checker</text>
<text x="962.0" y="399.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">VLAN present, MAC not learned, link up → this rung, not routing</text>
</g>
<line x1="198" y1="424" x2="198" y2="440" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>4  L3</title><rect x="48" y="442" width="300" height="84" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="198.0" y="491.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">4  L3</text>
</g>
<g><title></title><rect x="372" y="442" width="1180" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="962.0" y="479.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv show vrf &lt;v&gt; router rib ipv4 · router bgp neighbor · ip neigh · nv show interface vlanN</text>
<text x="962.0" y="501.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">session Active? IPv6 RA / neighbour on the OTHER end; wrong VRF?</text>
</g>
<line x1="198" y1="526" x2="198" y2="542" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>5  ASIC</title><rect x="48" y="544" width="300" height="84" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="198.0" y="593.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">5  ASIC</text>
</g>
<g><title></title><rect x="372" y="544" width="1180" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="962.0" y="581.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">sudo cl-resource-query · systemctl status switchd · journalctl -u switchd</text>
<text x="962.0" y="603.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">route in RIB but not forwarding → table full / switchd restart</text>
</g>
<line x1="198" y1="628" x2="198" y2="644" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>6  Counters / drops</title><rect x="48" y="646" width="300" height="84" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="198.0" y="695.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">6  Counters / drops</text>
</g>
<g><title></title><rect x="372" y="646" width="1180" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="962.0" y="683.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv show interface swpN counters (deltas) · qos roce counters (PFC/ECN) · netq show wjh-drop</text>
<text x="962.0" y="705.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">WJH gives the drop REASON; PFC rx on a host port = slow host, rx on an uplink = spine pausing you</text>
</g>
<line x1="198" y1="730" x2="198" y2="746" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>7  Escalate</title><rect x="48" y="748" width="300" height="84" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="198.0" y="797.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">7  Escalate</text>
</g>
<g><title></title><rect x="372" y="748" width="1180" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="962.0" y="785.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">sudo cl-support → /var/support/cl_support_&lt;host&gt;_&lt;date&gt;.txz</text>
<text x="962.0" y="807.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">collect while the problem is live; some ASIC counters are not retained</text>
</g>
<g><title>Decision rule</title><rect x="48" y="870" width="1000" height="130" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="902" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Decision rule: at each rung, clean → climb to the next; failing → fix it here before going higher.</text>
<text x="64" y="930" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Fix the lowest failing rung first: a clean rung 1–2 before BGP work saves you chasing an MTU/FEC</text>
<text x="64" y="958" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">problem as a routing problem. Rungs 6–7 feed escalation with evidence, not guesses.</text>
<g><title>Legend</title><rect x="1070" y="870" width="482" height="150" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="1084" y="885" width="56" height="20" rx="4" fill="#ffe9cc" stroke="#e07b00" stroke-width="2"/>
<text x="1154" y="902" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">physical / Ethernet</text>
<rect x="1084" y="915" width="56" height="20" rx="4" fill="#fff5cc" stroke="#c9a400" stroke-width="2"/>
<text x="1154" y="932" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">software state</text>
<rect x="1084" y="945" width="56" height="20" rx="4" fill="#ffd9d9" stroke="#d93025" stroke-width="2"/>
<text x="1154" y="962" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">drops</text>
<line x1="1084" y1="986" x2="1140" y2="986" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow-dark)"/>
<text x="1154" y="992" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">rung clean → next rung</text>
</g>
</svg>
