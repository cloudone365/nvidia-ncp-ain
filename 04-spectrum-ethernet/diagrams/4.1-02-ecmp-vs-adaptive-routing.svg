<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Left: two elephant flows hash to one spine link. Right: per-packet spraying; SuperNIC DDP writes each packet to its final address</text>
