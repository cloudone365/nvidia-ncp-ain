<line x1="580" y1="580" x2="440" y2="484" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="570.0" y="522.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">flow B</text>
<text x="420" y="672" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="middle">Result: 50–60% of paper bandwidth; one slow collective = slow job (tail latency)</text>
