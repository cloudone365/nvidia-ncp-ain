<text x="1340.0" y="628.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">receiver: DDP places out-of-order</text>
</g>
<g><title>step 4</title><circle cx="1508" cy="611" r="16" fill="#1f2937"/>
<text x="1508" y="617" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</g>
<text x="1180" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a9c8a" text-anchor="middle">Result: all uplinks busy, no reorder buffer, no go-back-N</text>
<g><title>Steps</title><rect x="60" y="724" width="1100" height="232" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2"/></g>
<text x="78" y="756" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">Steps (right-hand side)</text>
<g><title>step 1</title><circle cx="98" cy="794" r="16" fill="#1f2937"/>
<text x="98" y="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
</g>
<text x="126" y="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">SuperNIC sends a RoCE message as many packets; each carries the virtual address it belongs to.</text>
<g><title>step 2</title><circle cx="98" cy="838" r="16" fill="#1f2937"/>
<text x="98" y="844" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</g>
<text x="126" y="844" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">leaf01 forwards EVERY packet to the least-loaded uplink (queue depth + utilization threshold, default 70%).</text>
<g><title>step 3</title><circle cx="98" cy="882" r="16" fill="#1f2937"/>
<text x="98" y="888" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</g>
<text x="126" y="888" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Packets of one flow reach the far leaf over different spines, out of order; a classic NIC calls this loss.</text>
<g><title>step 4</title><circle cx="98" cy="926" r="16" fill="#1f2937"/>
<text x="98" y="932" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</g>
<text x="126" y="932" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">The receiving SuperNIC's DDP engine writes each packet to its offset in GPU/host memory; done when all arrive.</text>
