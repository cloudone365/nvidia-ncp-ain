<g><title>Step 2</title><circle cx="1160" cy="330" r="16" fill="#1f2937"/><text x="1160" y="336" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<g><title>Step 2</title><circle cx="1290" cy="340" r="16" fill="#1f2937"/><text x="1290" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<g><title>BlueField-3 SuperNIC</title><rect x="860" y="580" width="250" height="60" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="985.0" y="603.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">BlueField-3 SuperNIC</text>
<text x="985.0" y="627.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">sender: packets carry VA offset</text>
</g>
<g><title>BlueField-3 SuperNIC</title><rect x="1230" y="580" width="260" height="60" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1360.0" y="603.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">BlueField-3 SuperNIC</text>
<text x="1360.0" y="627.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">receiver: DDP places out-of-order</text>
</g>
<line x1="990" y1="580" x2="1110" y2="484" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 1</title><circle cx="1030" cy="530" r="16" fill="#1f2937"/><text x="1030" y="536" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<line x1="1210" y1="484" x2="1330" y2="580" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 3</title><circle cx="1290" cy="530" r="16" fill="#1f2937"/><text x="1290" y="536" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>Step 4</title><circle cx="1510" cy="610" r="16" fill="#1f2937"/><text x="1510" y="616" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<text x="1180" y="672" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a9c8a" text-anchor="middle">Result: all uplinks busy, no reorder buffer, no go-back-N</text>
<g><title>Steps (right-hand side)</title><rect x="60" y="730" width="1480" height="220" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2"/></g>
<text x="74" y="758" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">Steps (right-hand side)</text>
<text x="90" y="790" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1  SuperNIC sends a RoCE message as many packets; each carries the virtual address it belongs to (RDMA write semantics).</text>
<text x="90" y="820" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">2  leaf01 forwards EVERY packet independently to the least-loaded uplink (queue depth + link-utilization-threshold, default 70%).</text>
<text x="90" y="850" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">3  Packets of one flow arrive at the far leaf over different spines, out of order; a classic NIC would treat this as loss.</text>
<text x="90" y="880" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">4  The receiving SuperNIC's DDP engine writes each packet straight to its offset in GPU/host memory and completes once all are present.</text>
<g><title>Legend</title><rect x="1180" y="745" width="360" height="112" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1194" y1="771" x2="1254" y2="771" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
