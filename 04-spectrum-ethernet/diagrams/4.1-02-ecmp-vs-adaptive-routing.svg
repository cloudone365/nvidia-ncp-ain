<text x="420" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="middle">Result: 50–60% of paper bandwidth; one slow collective = slow job (tail latency)</text>
