<text x="1180.0" y="637.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">multi-image GRUB via sonic-installer; warm/fast reboot</text>
</g>
