<text x="630.0" y="809.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">the Spectrum-X reference architecture</text>
</g>
<g><title></title><rect x="952" y="752" width="600" height="80" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5"/>
<text x="1252.0" y="787.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">multi-vendor / hyperscaler operations;</text>
<text x="1252.0" y="809.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">an orchestrator writes config_db.json</text>
</g>
<text x="48" y="870" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">Same silicon, same ONIE install path; the difference is where state lives and how you change it.</text>
