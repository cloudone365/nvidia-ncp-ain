<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Cumulus Linux vs NVIDIA SONiC on the same Spectrum switch</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Both NVIDIA-supported. Cumulus: integrated, transactional NVUE, one-line RoCE. SONiC: containerised, open, immediate config, assembled RoCE</text>
<g><title>Cumulus Linux (SN5600)</title><rect x="60" y="140" width="720" height="640" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="74" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">Cumulus Linux (SN5600)</text>
<g><title>NVIDIA SONiC (SN5600)</title><rect x="820" y="140" width="720" height="640" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="834" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">NVIDIA SONiC (SN5600)</text>
<g><title>Config model</title><rect x="90" y="185" width="660" height="84" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="420.0" y="221.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Config model</text>
<text x="420.0" y="245.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">NVUE: nv set → pending → apply → save; revisions, rollback, replace/patch, REST :8765</text>
</g>
<g><title>Config model</title><rect x="850" y="185" width="660" height="84" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1180.0" y="221.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Config model</text>
<text x="1180.0" y="245.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">config CLI / config_db.json → CONFIG_DB immediately; config save to persist; load (merge) vs reload (restart)</text>
</g>
<g><title>Where state lives</title><rect x="90" y="283" width="660" height="84" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="420.0" y="319.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Where state lives</text>
<text x="420.0" y="343.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">Linux kernel + FRR files; switchd mirrors kernel → ASIC via SDK</text>
</g>
<g><title>Where state lives</title><rect x="850" y="283" width="660" height="84" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1180.0" y="319.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Where state lives</text>
<text x="1180.0" y="343.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">Redis: CONFIG_DB(4) → APPL_DB(0) → ASIC_DB(1); orchagent + syncd/SAI; STATE_DB(6), COUNTERS_DB(2)</text>
</g>
<g><title>RoCE</title><rect x="90" y="381" width="660" height="84" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="420.0" y="417.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">RoCE</text>
<text x="420.0" y="441.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv set qos roce mode lossless (one profile: DSCP map, PFC SP3, ECN, buffers, ETS, CNP)</text>
</g>
<g><title>RoCE</title><rect x="850" y="381" width="660" height="84" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1180.0" y="417.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">RoCE</text>
<text x="1180.0" y="441.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">assemble DSCP_TO_TC, TC_TO_PG, PORT_QOS_MAP pfc_enable, BUFFER_PG/PROFILE, WRED, SCHEDULER, PFC_WD</text>
</g>
<g><title>Adaptive routing / EVPN-MH / MLAG</title><rect x="90" y="479" width="660" height="84" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="420.0" y="515.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Adaptive routing / EVPN-MH / MLAG</text>
<text x="420.0" y="539.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">full: nv set router adaptive-routing, EVPN multihoming, MLAG, VRR</text>
</g>
<g><title>Adaptive routing / EVPN-MH / MLAG</title><rect x="850" y="479" width="660" height="84" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1180.0" y="515.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Adaptive routing / EVPN-MH / MLAG</text>
<text x="1180.0" y="539.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">EVPN VXLAN yes; AR platform/release dependent; MC-LAG community; MH limited — verify</text>
</g>
