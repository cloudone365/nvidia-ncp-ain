<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Cumulus Linux vs NVIDIA SONiC on the same Spectrum switch</text>
<text x="48" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Both NVIDIA-supported. Cumulus: integrated, transactional NVUE, one-line RoCE. SONiC: containerised, open, immediate config</text>
<g><title>Cumulus Linux (SN5600)</title><rect x="330" y="136" width="600" height="50" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="630.0" y="168.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Cumulus Linux (SN5600)</text>
</g>
<g><title>NVIDIA SONiC (SN5600)</title><rect x="952" y="136" width="600" height="50" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="1252.0" y="168.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">NVIDIA SONiC (SN5600)</text>
</g>
<g><title>Config model</title><rect x="48" y="200" width="270" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="183.0" y="246.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Config model</text>
</g>
<g><title></title><rect x="330" y="200" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="630.0" y="235.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">NVUE: nv set → pending → apply → save</text>
<text x="630.0" y="257.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">revisions, rollback, replace/patch, REST :8765</text>
</g>
<g><title></title><rect x="952" y="200" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1252.0" y="235.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">config CLI / config_db.json → CONFIG_DB immediately</text>
<text x="1252.0" y="257.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">config save to persist; load (merge) vs reload (restart)</text>
</g>
<g><title>Where state lives</title><rect x="48" y="290" width="270" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="183.0" y="336.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Where state lives</text>
</g>
<g><title></title><rect x="330" y="290" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="630.0" y="325.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">Linux kernel + FRR files;</text>
<text x="630.0" y="347.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">switchd mirrors kernel → ASIC via SDK</text>
</g>
<g><title></title><rect x="952" y="290" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1252.0" y="325.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">Redis: CONFIG_DB(4) → APPL_DB(0) → ASIC_DB(1)</text>
<text x="1252.0" y="347.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">orchagent + syncd/SAI; STATE_DB(6), COUNTERS_DB(2)</text>
</g>
<g><title>RoCE</title><rect x="48" y="380" width="270" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="183.0" y="426.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">RoCE</text>
</g>
<g><title></title><rect x="330" y="380" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="630.0" y="415.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">nv set qos roce mode lossless — one profile:</text>
<text x="630.0" y="437.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">DSCP map, PFC SP3, ECN, buffers, ETS, CNP</text>
</g>
<g><title></title><rect x="952" y="380" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1252.0" y="415.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">assemble DSCP_TO_TC, TC_TO_PG, PORT_QOS_MAP pfc_enable,</text>
<text x="1252.0" y="437.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">BUFFER_PG/PROFILE, WRED, SCHEDULER, PFC_WD</text>
</g>
<g><title>AR / EVPN-MH / MLAG</title><rect x="48" y="470" width="270" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="183.0" y="516.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">AR / EVPN-MH / MLAG</text>
</g>
<g><title></title><rect x="330" y="470" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="630.0" y="505.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">full: nv set router adaptive-routing,</text>
<text x="630.0" y="527.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">EVPN multihoming, MLAG, VRR</text>
</g>
<g><title></title><rect x="952" y="470" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1252.0" y="505.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">EVPN VXLAN yes; AR platform/release dependent;</text>
<text x="1252.0" y="527.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">MC-LAG community; MH limited — verify</text>
</g>
<g><title>Images</title><rect x="48" y="560" width="270" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="183.0" y="606.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Images</text>
</g>
<g><title></title><rect x="330" y="560" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="630.0" y="595.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">single partition; ONIE reinstall or apt;</text>
<text x="630.0" y="617.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">NetQ LCM</text>
</g>
<g><title></title><rect x="952" y="560" width="600" height="80" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="1252.0" y="595.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">multi-image GRUB via sonic-installer;</text>
<text x="1252.0" y="617.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">warm / fast reboot</text>
</g>
