<text x="330" y="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">TCP 31980 · vrf mgmt on switches (no vrf on hosts) · state + counters + WJH</text>
<g><title>NetQ on-premises server (standalone VM or 3-node cluster: 1 master + 2 workers, cluster-vip)</title><rect x="60" y="160" width="900" height="340" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="74" y="188" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">NetQ on-premises server (standalone VM or 3-node cluster: 1 master + 2 workers, cluster-vip)</text>
<g><title>Kubernetes netq install … full</title><rect x="90" y="210" width="250" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="215.0" y="239.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Kubernetes</text>
