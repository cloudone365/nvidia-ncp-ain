<text x="485.0" y="239.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Kafka</text>
<text x="485.0" y="259.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">ingest / message bus</text>
</g>
<g><title>Cassandra (time series) every state change, forever-ish</title><rect x="630" y="210" width="300" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="780.0" y="239.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Cassandra (time series)</text>
<text x="780.0" y="259.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">every state change, forever-ish</text>
</g>
<g><title>Validation engine netq check *</title><rect x="90" y="310" width="250" height="70" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="215.0" y="339.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Validation engine</text>
<text x="215.0" y="359.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">netq check *</text>
</g>
