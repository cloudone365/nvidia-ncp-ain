<text x="1050" y="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">31443 (cloud model only)</text>
<g><title>Note</title><rect x="1010" y="540" width="530" height="120" rx="6" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="1022" y="562" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Sizing (verify current guide): standalone ≈ 16 vCPU / 64 GB / 500 GB SSD;</text>
<text x="1022" y="580" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">OPTA lighter. Several hundred to low thousands of devices per server.</text>
<text x="1022" y="598" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Fresh = recent heartbeat; Rotten = stale → fix before trusting netq check.</text>
