<text x="408.0" y="430.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Kafka</text>
<text x="408.0" y="453.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ingest / message bus</text>
</g>
<line x1="506" y1="435" x2="546" y2="435" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>Stream processors</title><rect x="550" y="400" width="196" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="648.0" y="430.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Stream processors</text>
<text x="648.0" y="453.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">normalise, detect events</text>
</g>
<line x1="746" y1="435" x2="786" y2="435" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<g><title>Cassandra</title><rect x="790" y="400" width="196" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="888.0" y="430.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Cassandra</text>
<text x="888.0" y="453.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">time series</text>
</g>
<text x="70" y="386" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">Ingest pipeline — all of it runs as pods on the bundled Kubernetes (netq install … full)</text>
<line x1="888" y1="400" x2="888" y2="348" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="900" y="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">queries</text>
<rect x="1032" y="136" width="520" height="380" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1050" y="166" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5f6b7a" text-anchor="start">Cloud-hosted alternative</text>
<g><title>NetQ Cloud (NVIDIA-hosted backend)</title><rect x="1056" y="184" width="472" height="80" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1292.0" y="219.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">NetQ Cloud (NVIDIA-hosted backend)</text>
<text x="1292.0" y="242.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">UI, validation, events — same features</text>
</g>
<line x1="1292" y1="396" x2="1292" y2="268" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1308" y="336" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">HTTPS / TLS outbound</text>
<g><title>OPTA (On-Premises Telemetry Aggregator)</title><rect x="1056" y="400" width="472" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1292.0" y="435.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">OPTA (On-Premises Telemetry Aggregator)</text>
<text x="1292.0" y="458.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">VM on site; agents point here on 31443</text>
</g>
<line x1="158" y1="640" x2="168.0" y2="474" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<line x1="398" y1="640" x2="180.0" y2="474" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<line x1="638" y1="640" x2="192.0" y2="474" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
