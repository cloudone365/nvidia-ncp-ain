<text x="158.0" y="670.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">leaf01</text>
<text x="158.0" y="693.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Cumulus · netq-agent</text>
</g>
<g><title>leaf02</title><rect x="288" y="640" width="220" height="70" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="398.0" y="670.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">leaf02</text>
<text x="398.0" y="693.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Cumulus · netq-agent</text>
</g>
<g><title>spine01</title><rect x="528" y="640" width="220" height="70" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="638.0" y="670.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">spine01</text>
<text x="638.0" y="693.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SONiC · netq-agent</text>
</g>
<g><title>dgx01</title><rect x="768" y="640" width="220" height="70" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="878.0" y="670.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">dgx01</text>
<text x="878.0" y="693.1" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Ubuntu host · netq-agent</text>
</g>
<path d="M 988 675 L 1292 675 L 1292 484" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1306" y="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">cloud model: agents → OPTA</text>
<text x="1306" y="624" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">TCP 31443 (TLS)</text>
<text x="48" y="748" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">On-prem: agents → TCP 31980; vrf mgmt on switches, no vrf on hosts.</text>
<text x="48" y="772" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">Each agent streams state deltas + counters + WJH, plus a heartbeat (Fresh / Rotten).</text>
<g><title>Sizing</title><rect x="48" y="806" width="1000" height="80" rx="8" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="64" y="836" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Sizing (verify current guide): standalone ≈ 16 vCPU / 64 GB / 500 GB SSD; OPTA lighter.</text>
<text x="64" y="862" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Several hundred to low thousands of devices per server. Fix Rotten agents before trusting netq check.</text>
