<text x="750.0" y="739.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">Ubuntu host · netq-agent</text>
</g>
<line x1="750" y1="680" x2="520" y2="500" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
