<text x="1275.0" y="419.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">NetQ Cloud (NVIDIA-hosted backend)</text>
