<text x="1000" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Revision store</text>
<text x="1000" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">pending changesets</text>
</g>
<line x1="1000" y1="230" x2="1000" y2="1030" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
