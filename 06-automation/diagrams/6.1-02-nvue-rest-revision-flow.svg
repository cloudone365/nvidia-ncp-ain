<text x="600" y="211" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">https://leaf01:8765</text>
</g>
<line x1="600" y1="230" x2="600" y2="1030" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
