<text x="200" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">curl · Ansible httpapi</text>
</g>
<line x1="200" y1="230" x2="200" y2="1030" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5 5"/>
<g><title>nvued</title>
