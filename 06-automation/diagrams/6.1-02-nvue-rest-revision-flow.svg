<rect x="0" y="0" width="1600" height="1200" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">NVUE REST revision flow: create → PATCH → apply → poll → save</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Writes only land inside a revision; nvidia.nvue, NetQ LCM profiles and Air all drive this sequence on port 8765</text>
<g><title>Client</title>
<rect x="40.0" y="150" width="320" height="80" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
