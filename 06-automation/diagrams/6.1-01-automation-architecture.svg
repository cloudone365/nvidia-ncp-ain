<line x1="1078" y1="956" x2="1138" y2="956" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1154" y="962" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Management / telemetry</text>
<line x1="1078" y1="986" x2="1138" y2="986" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1154" y="992" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
</g>
