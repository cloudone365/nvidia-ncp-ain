<text x="612" y="441" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<text x="656" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">pass / fail gates</text>
<text x="656" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">pass / fail gates</text>
<text x="656" y="462" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" text-anchor="start" aria-hidden="true">the next stage</text>
<text x="656" y="462" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">the next stage</text>
<g><title>1  render per-switch NVUE YAML from templates + vars</title>
<rect x="48" y="840" width="1000" height="196" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="62" y="888" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1  render per-switch NVUE YAML from templates + vars</text>
<text x="62" y="910" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">2  push: REST revision (nvidia.nvue, httpapi) or SSH + nv config replace</text>
<text x="62" y="932" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">3  diff against applied: empty diff → no apply, task reports ok</text>
<text x="62" y="954" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">4  apply: ifupdown2 / FRR reload, kernel state updated</text>
<text x="62" y="976" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">5  switchd mirrors kernel state into the ASIC (AR on ≤5.12 restarts it)</text>
<text x="62" y="998" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">6  netq-agent streams state to NetQ · 7  netq check gates the pipeline / revert</text>
</g>
