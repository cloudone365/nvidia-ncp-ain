<g><title>Step 1</title><circle cx="390" cy="200" r="16" fill="#1f2937"/><text x="390" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><title>leaf01 (Cumulus Linux 5.x)</title><rect x="800" y="140" width="740" height="500" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="814" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">leaf01 (Cumulus Linux 5.x)</text>
<g><title>nvued — NVUE API https://leaf01:8765/nvue_v1/</title><rect x="830" y="190" width="320" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="990.0" y="219.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">nvued — NVUE API</text>
<text x="990.0" y="239.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">https://leaf01:8765/nvue_v1/</text>
<text x="990.0" y="263.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">POST /revision → PATCH objects → apply</text>
</g>
<g><title>sshd + nv CLI nv config replace / diff / apply</title><rect x="1190" y="190" width="320" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1350.0" y="219.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">sshd + nv CLI</text>
<text x="1350.0" y="239.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">nv config replace / diff / apply</text>
<text x="1350.0" y="263.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">same object tree, same revisions</text>
</g>
<line x1="740" y1="215" x2="830" y2="215" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="785.0" y="205.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">REST :8765</text>
<g><title>Step 2</title><circle cx="785" cy="245" r="16" fill="#1f2937"/><text x="785" y="251" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<line x1="740" y1="250" x2="1190" y2="250" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1085.0" y="270.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SSH :22 (scp YAML)</text>
<g><title>Revision (pending) → nv config apply → applied rev N → nv config save → startup.yaml </title><rect x="830" y="320" width="680" height="70" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1170.0" y="350.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">Revision (pending) → nv config apply → applied rev N → nv config save → startup.yaml</text>
</g>
<line x1="990" y1="280" x2="990" y2="320" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<line x1="1350" y1="280" x2="1350" y2="320" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>Step 3</title><circle cx="1170" cy="300" r="16" fill="#1f2937"/><text x="1170" y="306" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<g><title>ifupdown2 · FRR · kernel rendered files, netlink state</title><rect x="830" y="420" width="320" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="990.0" y="449.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">ifupdown2 · FRR · kernel</text>
<text x="990.0" y="469.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">rendered files, netlink state</text>
</g>
<g><title>switchd → Spectrum SDK programs the ASIC</title><rect x="1190" y="420" width="320" height="70" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1350.0" y="449.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">switchd → Spectrum SDK</text>
<text x="1350.0" y="469.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">programs the ASIC</text>
</g>
<line x1="990" y1="390" x2="990" y2="420" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<line x1="1150" y1="455" x2="1190" y2="455" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<g><title>Step 4</title><circle cx="1170" cy="410" r="16" fill="#1f2937"/><text x="1170" y="416" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<g><title>Spectrum-4 ASIC (SN5600) VLANs, EVPN, RoCE profile, adaptive routing live here</title><rect x="830" y="530" width="680" height="80" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1170.0" y="564.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Spectrum-4 ASIC (SN5600)</text>
<text x="1170.0" y="585.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">VLANs, EVPN, RoCE profile, adaptive routing live here</text>
</g>
<line x1="1350" y1="490" x2="1350" y2="530" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><title>Step 5</title><circle cx="1380" cy="510" r="16" fill="#1f2937"/><text x="1380" y="516" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<g><title>NetQ server netq check bgp|evpn|interfaces|roce</title><rect x="420" y="420" width="320" height="120" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="580.0" y="456.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">NetQ server</text>
<text x="580.0" y="478.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">netq check bgp|evpn|interfaces|roce</text>
<text x="580.0" y="504.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">validation + snapshot before/after</text>
<text x="580.0" y="520.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">json → CI gate (failedNodeCount)</text>
</g>
<polyline points="1170,640 1170,662 770,662 770,500 740,500" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<rect x="833" y="640" width="273" height="23" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="970" y="655" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">netq-agent → 31980 (state, counters)</text>
<g><title>Step 6</title><circle cx="800" cy="600" r="16" fill="#1f2937"/><text x="800" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<line x1="580" y1="420" x2="580" y2="290" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<rect x="589" y="345" width="202" height="23" rx="5" fill="#ffffff" fill-opacity="0.92"/>
<text x="690" y="360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">result gates the next step</text>
<g><title>Step 7</title><circle cx="545" cy="355" r="16" fill="#1f2937"/><text x="545" y="361" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<g><title>NVIDIA Air twin same YAML, same playbook</title><rect x="60" y="420" width="300" height="120" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="210.0" y="456.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">NVIDIA Air twin</text>
<text x="210.0" y="478.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">same YAML, same playbook</text>
<text x="210.0" y="504.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">control-plane validation</text>
<text x="210.0" y="520.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">spun up/down by CI via API</text>
</g>
<line x1="360" y1="480" x2="420" y2="480" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<g><title>Note</title><rect x="60" y="680" width="700" height="170" rx="6" fill="#fff5cc" stroke="#c9a400" stroke-width="1.5"/></g>
<text x="72" y="702" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">1 render per-switch YAML from templates + vars (reviewable device diff)</text>
<text x="72" y="720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">2 push: REST revision (nvidia.nvue) or SSH nv config replace (recommended for full configs)</text>
<text x="72" y="738" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">3 nv config diff is the idempotency test: empty diff → no apply, no 'changed'</text>
<text x="72" y="756" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">4 apply renders ifupdown2/FRR files; switchd mirrors kernel state into the ASIC</text>
<text x="72" y="774" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">5 AR / breakout applies may restart switchd (≤5.12): serial: 1, async/poll</text>
<text x="72" y="792" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">6–7 NetQ validates operational state; a failed check blocks the rollout (or triggers git revert)</text>
<g><title>Legend</title><rect x="1110" y="740" width="430" height="112" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1124" y1="766" x2="1184" y2="766" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1198" y="772" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (BGP / EVPN / REST / Ansible)</text>
<line x1="1124" y1="796" x2="1184" y2="796" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1198" y="802" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Management / telemetry</text>
<line x1="1124" y1="826" x2="1184" y2="826" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="1198" y="832" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (RoCE / Ethernet)</text>
</g>
</svg>
