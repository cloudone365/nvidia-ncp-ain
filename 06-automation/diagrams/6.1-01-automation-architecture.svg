<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img">
<title>Automation architecture: git → Ansible → NVUE API → revision → switchd → ASIC, NetQ loop</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Automation architecture: git → Ansible → NVUE API → revision → switchd → ASIC, NetQ loop</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Declarative NVUE YAML is the contract; Ansible is the transport; NetQ closes the loop by validating operational state, not configuration</text>
<g><title>Git repository source of truth</title><rect x="60" y="170" width="300" height="120" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="210.0" y="198.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Git repository</text>
<text x="210.0" y="220.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">source of truth</text>
<text x="210.0" y="246.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">templates/*.yaml.j2</text>
<text x="210.0" y="262.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">host_vars / group_vars</text>
<text x="210.0" y="278.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">rendered/&lt;switch&gt;.yaml</text>
</g>
<g><title>Ansible controller ansible-playbook --check --diff</title><rect x="420" y="170" width="320" height="120" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="580.0" y="198.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Ansible controller</text>
<text x="580.0" y="220.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">ansible-playbook --check --diff</text>
<text x="580.0" y="246.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">template → nv config replace + diff</text>
<text x="580.0" y="262.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">or nvidia.nvue.* modules (REST)</text>
<text x="580.0" y="278.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">Vault for secrets</text>
</g>
