<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="100%" role="img">
<title>Automation architecture: git → Ansible → NVUE → ASIC, NetQ loop</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1060" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Automation architecture: git → Ansible → NVUE → ASIC, NetQ loop</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">NVUE YAML is the contract, Ansible is the transport, NetQ closes the loop by validating operational state</text>
<g><title>Git repository</title>
<rect x="48" y="190" width="320" height="180" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="208" y="239" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Git repository</text>
<text x="208" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">source of truth</text>
<text x="208" y="291" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">templates/*.j2</text>
<text x="208" y="313" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">host_vars/ group_vars/</text>
<text x="208" y="335" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">rendered/&lt;sw&gt;.yaml</text>
</g>
<g><title>Ansible controller</title>
<rect x="440" y="190" width="320" height="180" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="600" y="250" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Ansible controller</text>
<text x="600" y="279" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ansible-playbook</text>
<text x="600" y="302" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">--check --diff</text>
<text x="600" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">httpapi (REST) or ssh</text>
</g>
<g><title>NVIDIA Air twin</title>
<rect x="48" y="500" width="320" height="160" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="208" y="561" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">NVIDIA Air twin</text>
<text x="208" y="591" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">same YAML, same playbook</text>
<text x="208" y="613" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">control plane only</text>
</g>
<g><title>NetQ server</title>
<rect x="440" y="500" width="320" height="160" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="600" y="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">NetQ server</text>
<text x="600" y="579" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">netq check bgp|evpn|</text>
<text x="600" y="602" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">interfaces|roce json</text>
<text x="600" y="624" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">→ CI gate</text>
</g>
<g><title>leaf01 — Cumulus Linux 5.x</title><rect x="900" y="170" width="652" height="640" rx="12" fill="#ffffff" fill-opacity="0.0" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 6"/></g>
<text x="916" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5f6b7a" text-anchor="start">leaf01 — Cumulus Linux 5.x</text>
<g><title>nvued (NVUE API)</title>
<rect x="930" y="220" width="280" height="130" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1070" y="266" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">nvued (NVUE API)</text>
<text x="1070" y="296" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">HTTPS :8765</text>
<text x="1070" y="318" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">/nvue_v1/…</text>
</g>
<g><title>sshd :22 + nv CLI</title>
<rect x="1250" y="220" width="280" height="130" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1390" y="266" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">sshd :22 + nv CLI</text>
<text x="1390" y="296" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv is a client of</text>
<text x="1390" y="318" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">the same nvued</text>
</g>
<g><title>Revisions: pending → apply → applied</title>
<rect x="930" y="400" width="600" height="110" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1230" y="447" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Revisions: pending → apply → applied</text>
<text x="1230" y="477" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">nv config save → /etc/nvue.d/startup.yaml</text>
</g>
<g><title>Linux renderers</title>
<rect x="930" y="560" width="280" height="110" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="1070" y="607" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Linux renderers</text>
<text x="1070" y="637" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ifupdown2 · FRR · kernel</text>
</g>
<g><title>switchd</title>
<rect x="1250" y="560" width="280" height="110" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1390" y="607" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">switchd</text>
<text x="1390" y="637" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">kernel state → SDK</text>
</g>
<g><title>Spectrum-4 ASIC: VLAN, EVPN, RoCE, AR</title>
