<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="100%" role="img">
<title>CI/CD pipeline for fabric config: gates and rollback</title>
<defs>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1010" fill="#ffffff"/>
<text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">CI/CD pipeline for fabric config: gates and rollback</text>
<text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5f6b7a" text-anchor="start">Each stage either produces a reviewable artefact or gates the next; git revert + declarative replace is the rollback</text>
<g><title>1  Commit / PR</title>
<rect x="48" y="150" width="300" height="84" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="70" y="199" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">1  Commit / PR</text>
</g>
<g><title>feature branch edits host_vars or templates; the PR starts the pipeline</title>
<rect x="390" y="150" width="1010" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="412" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">feature branch edits host_vars or templates; the PR starts the pipeline</text>
<text x="412" y="208" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">reviewers see the variable change</text>
</g>
<polyline points="198,234 198,260" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<polyline points="348,192 390,192" fill="none" stroke="#1f2937" stroke-width="3"/>
<g><title>2  Lint + render</title>
<rect x="48" y="260" width="300" height="84" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="70" y="309" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">2  Lint + render</text>
</g>
<g><title>ansible-lint · yamllint · render rendered/&lt;sw&gt;.yaml · yaml.safe_load must parse</title>
<rect x="390" y="260" width="1010" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="412" y="296" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ansible-lint · yamllint · render rendered/&lt;sw&gt;.yaml · yaml.safe_load must parse</text>
<text x="412" y="318" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">git diff of rendered/ shows the DEVICE change, not just the variable</text>
</g>
<polyline points="198,344 198,370" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<polyline points="348,302 390,302" fill="none" stroke="#1f2937" stroke-width="3"/>
<g><title>3  Check mode</title>
<rect x="48" y="370" width="300" height="84" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="70" y="419" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">3  Check mode</text>
</g>
<g><title>ansible-playbook --check --diff: replace + diff on each switch</title>
<rect x="390" y="370" width="1010" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="412" y="406" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ansible-playbook --check --diff: replace + diff on each switch</text>
<text x="412" y="428" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">apply skipped, pending detached; nv config history unchanged</text>
</g>
<polyline points="198,454 198,480" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<polyline points="348,412 390,412" fill="none" stroke="#1f2937" stroke-width="3"/>
<g><title>4  Simulate (Air)</title>
<rect x="48" y="480" width="300" height="84" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5"/>
<text x="70" y="529" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">4  Simulate (Air)</text>
</g>
<g><title>create a twin via the Air API → apply → netq check bgp / evpn / interfaces</title>
<rect x="390" y="480" width="1010" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="412" y="516" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">create a twin via the Air API → apply → netq check bgp / evpn / interfaces</text>
<text x="412" y="538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">control plane only: no RoCE / AR / PFC behaviour in a twin</text>
</g>
<polyline points="198,564 198,590" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<polyline points="348,522 390,522" fill="none" stroke="#1f2937" stroke-width="3"/>
<g><title>5  Deploy (merge)</title>
<rect x="48" y="590" width="300" height="84" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="70" y="639" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">5  Deploy (merge)</text>
</g>
<g><title>serial: 1 (or a canary group) · replace → diff → apply → save</title>
<rect x="390" y="590" width="1010" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="412" y="626" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">serial: 1 (or a canary group) · replace → diff → apply → save</text>
<text x="412" y="648" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">async / poll around AR and breakout applies</text>
</g>
<polyline points="198,674 198,700" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<polyline points="348,632 390,632" fill="none" stroke="#1f2937" stroke-width="3"/>
<g><title>6  Validate</title>
<rect x="48" y="700" width="300" height="84" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="70" y="749" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">6  Validate</text>
</g>
<g><title>netq check … json → failedNodeCount == 0 · snapshot compare before / after</title>
<rect x="390" y="700" width="1010" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="412" y="736" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">netq check … json → failedNodeCount == 0 · snapshot compare before / after</text>
<text x="412" y="758" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">hardware-only proof: ib_write_bw / NCCL tests</text>
</g>
<polyline points="198,784 198,810" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<polyline points="348,742 390,742" fill="none" stroke="#1f2937" stroke-width="3"/>
<g><title>7  Rollback / drift</title>
<rect x="48" y="810" width="300" height="84" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="70" y="859" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">7  Rollback / drift</text>
</g>
<g><title>fail → git revert → re-run deploy (replace restores the old state)</title>
<rect x="390" y="810" width="1010" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="412" y="846" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">fail → git revert → re-run deploy (replace restores the old state)</text>
<text x="412" y="868" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">nightly: nv config show -o yaml vs rendered/ = drift alarm</text>
</g>
<polyline points="348,852 390,852" fill="none" stroke="#1f2937" stroke-width="3"/>
<polyline points="1400,852 1470,852 1470,192 1400,192" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="1500" y="520" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="middle" transform="rotate(-90 1500 520)">fail → revert → redeploy</text>
<text x="48" y="950" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">Secrets: Ansible Vault; API certificate: nv set system api certificate (production).</text>
<g><title>Legend</title><rect x="1100" y="914" width="452" height="84" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="1116" y1="940" x2="1176" y2="940" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="1192" y="946" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Pipeline stage order</text>
<line x1="1116" y1="970" x2="1176" y2="970" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="1192" y="976" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Failure → rollback</text>
</g>
</svg>
