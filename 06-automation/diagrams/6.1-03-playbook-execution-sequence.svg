<g><title>command: nv set … always reports changed (a light switch); the diff task is the thermostat.</title>
<rect x="48" y="1080" width="1000" height="120" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="62" y="1123" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">command: nv set … always reports changed (a light switch); the diff task is the thermostat.</text>
<text x="62" y="1145" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Guard apply with: diff.changed and not ansible_check_mode. Never become: true for nv.</text>
<text x="62" y="1167" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">REST equivalent: nvidia.nvue.config state: new → typed module (merged) → state: apply.</text>
</g>
