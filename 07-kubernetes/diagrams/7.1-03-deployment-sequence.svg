<g><title>step 6</title><circle cx="422.0" cy="570.0" r="14" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="422.0" y="575.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<text x="800.0" y="612.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-style="italic">— operator phase complete; now a user creates a network and a pod —</text>
<path d="M140.0,650.0 L400.0,650.0" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
