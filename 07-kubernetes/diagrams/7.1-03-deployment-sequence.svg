<g><title>step 8</title><circle cx="162.0" cy="690.0" r="14" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="162.0" y="695.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g>
<path d="M400.0,730.0 L1180.0,730.0" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="446.0" y="721.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5f6b7a" text-anchor="start">scheduler picks a node with the resource; kubelet calls device plugin Allocate()</text>
<path d="M1180.0,770.0 L1420.0,770.0" fill="none" stroke="#2f6fdb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1226.0" y="761.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2f6fdb" text-anchor="start">mount /dev/infiniband/* (netns exclusive)</text>
<g><title>step 9</title><circle cx="1202.0" cy="770.0" r="14" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="1202.0" y="775.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">9</text></g>
<path d="M1180.0,810.0 L1420.0,810.0" fill="none" stroke="#2f6fdb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1226.0" y="801.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2f6fdb" text-anchor="start">Multus → ipoib CNI: net1 on ibp26s0, IP 10.60.0.3</text>
<g><title>step 10</title><circle cx="1202.0" cy="810.0" r="14" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="1202.0" y="815.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">10</text></g>
<path d="M1420.0,850.0 L1460.0,850.0 L1460.0,872.0 L1420.0,872.0" fill="none" stroke="#2f6fdb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1390.0" y="865.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2f6fdb" text-anchor="end">ibstat Active/LID/Rate 400 → ib_write_bw to peer pod</text>
<g><title>step 11</title><circle cx="1442.0" cy="850.0" r="14" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="1442.0" y="855.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">11</text></g>
<g><title>Where it breaks:  step 4 kernel mismatch → CrashLoopBackOff;  step 5 selectors match nothing → Allocatable 0 / Pending;  step 9 netns shared → net1 present but /dev/infiniband empty;  step 10 wrong master → no IP.</title><rect x="48" y="905" width="1504" height="43" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/></g>
<text x="60.0" y="932.4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Where it breaks:  step 4 kernel mismatch → CrashLoopBackOff;  step 5 selectors match nothing → Allocatable 0 / Pending;  step 9 netns shared → net1 present but /dev/infiniband empty;  step 10 wrong master → no IP.</text>
