<g><title>step 7</title><circle cx="162.0" cy="650.0" r="14" fill="#2f6fdb" stroke="#ffffff" stroke-width="2"/><text x="162.0" y="655.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<path d="M140.0,690.0 L400.0,690.0" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
