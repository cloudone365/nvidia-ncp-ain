<path d="M920.0,530.0 L1180.0,530.0" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="966.0" y="521.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5f6b7a" text-anchor="start">multus, cni-plugins, ipoib-cni binaries → /opt/cni/bin; nv-ipam/whereabouts ready</text>
