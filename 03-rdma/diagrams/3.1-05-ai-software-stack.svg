<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Layered stack from PyTorch through NCCL NVSHMEM UCX to libibverbs and the ConnectX HCA on an InfiniBand or RoCE fabric"><title>Where verbs sit in the AI software stack</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Where verbs sit in the AI software stack</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Frameworks never see QPs; NCCL, NVSHMEM and UCX turn collectives and put/get into verbs work requests on the HCA</text>
<g><title>PyTorch / JAX / Megatron-LM  (torch.distributed)</title><rect x="300" y="160" width="1000" height="60" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="195.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">PyTorch / JAX / Megatron-LM  (torch.distributed)</text>
<g><title>NCCL</title><rect x="300" y="250" width="320" height="110" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="460.0" y="289.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">NCCL</text>
<text x="460.0" y="314.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">all-reduce, all-gather, reduce-scatter,</text>
<text x="460.0" y="335.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">all-to-all; ring / tree / CollNet / NVLS</text>
<g><title>NVSHMEM</title><rect x="640" y="250" width="320" height="110" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="289.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">NVSHMEM</text>
<text x="800.0" y="314.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">one-sided GPU put/get,</text>
<text x="800.0" y="335.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">symmetric heap, IBGDA</text>
<g><title>UCX / UCC (MPI, HPC-X)</title><rect x="980" y="250" width="320" height="110" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1140.0" y="289.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">UCX / UCC (MPI, HPC-X)</text>
<text x="1140.0" y="314.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">RC/DC/UD selection, rcache,</text>
<text x="1140.0" y="335.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">rendezvous vs eager</text>
<g><title>libibverbs + librdmacm  (+ mlx5dv direct verbs)</title><rect x="300" y="400" width="1000" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="440.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">libibverbs + librdmacm  (+ mlx5dv direct verbs)</text>
<text x="800.0" y="465.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_post_send(RDMA WRITE with imm / flags), ibv_poll_cq; GPUDirect RDMA via nvidia-peermem or DMA-BUF</text>
<g><title>ConnectX-7 / ConnectX-8 SuperNIC / BlueField-3 (HCA, firmware, PCC)</title><rect x="300" y="530" width="1000" height="80" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="565.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">ConnectX-7 / ConnectX-8 SuperNIC / BlueField-3 (HCA, firmware, PCC)</text>
<text x="800.0" y="590.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">QP context, MTT, doorbells, transport offload</text>
<g><title>InfiniBand: Quantum-2 / X800</title><rect x="300" y="650" width="480" height="80" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="540.0" y="685.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">InfiniBand: Quantum-2 / X800</text>
<text x="540.0" y="710.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">SM, credits, AR, SHARP</text>
<g><title>RoCE v2: Spectrum-X (Spectrum-4)</title><rect x="820" y="650" width="480" height="80" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1060.0" y="685.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">RoCE v2: Spectrum-X (Spectrum-4)</text>
<text x="1060.0" y="710.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">PFC, ECN/DCQCN, AR + SuperNIC reordering</text>
<line x1="460" y1="220" x2="460" y2="250" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="460" y1="360" x2="460" y2="400" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="800" y1="220" x2="800" y2="250" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="800" y1="360" x2="800" y2="400" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="1140" y1="220" x2="1140" y2="250" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="1140" y1="360" x2="1140" y2="400" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="800" y1="490" x2="800" y2="530" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="540" y1="610" x2="540" y2="650" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<line x1="1060" y1="610" x2="1060" y2="650" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<g><rect x="40" y="760" width="1520" height="100" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="52" y="784" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Env knobs that map straight onto QP attributes / verbs choices: NCCL_IB_HCA, NCCL_IB_GID_INDEX (sgid_index), NCCL_IB_TC (traffic_class), NCCL_IB_SL (sl),</text>
<text x="52" y="804" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">NCCL_IB_TIMEOUT (timeout), NCCL_IB_RETRY_CNT (retry_cnt), NCCL_IB_QPS_PER_CONNECTION, NCCL_IB_AR_THRESHOLD, NCCL_NET_GDR_LEVEL (GPUDirect policy).</text>
</svg>
