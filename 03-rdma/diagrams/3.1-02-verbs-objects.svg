<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Containment diagram of verbs objects: a device context holding a protection domain with memory regions, queue pairs, shared receive queue and address handles, plus completion queues and a completion channel"><title>The verbs object model: what belongs to what</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">The verbs object model: what belongs to what</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">One process, one device context; everything hangs off a Protection Domain; completions arrive through a CQ</text>
<g><title>Application process (e.g. NCCL rank, ib_write_bw)</title><rect x="40" y="150" width="1120" height="700" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="0.45"/></g>
<text x="56" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">Application process (e.g. NCCL rank, ib_write_bw)</text>
<g><title>ibv_context  —  ibv_open_device(mlx5_0): /dev/infiniband/uverbs0, doorbell page mapped</title><rect x="70" y="200" width="1060" height="620" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="0.45"/></g>
<text x="86" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">ibv_context  —  ibv_open_device(mlx5_0): /dev/infiniband/uverbs0, doorbell page mapped</text>
<g><title>Protection Domain (PD)  ibv_alloc_pd — the fence: objects from two PDs cannot be mixed</title><rect x="100" y="250" width="640" height="540" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="0.45"/></g>
<text x="116" y="280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Protection Domain (PD)  ibv_alloc_pd — the fence: objects from two PDs cannot be mixed</text>
<g><title>Memory Region (MR)</title><rect x="130" y="300" width="280" height="130" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="270.0" y="330.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Memory Region (MR)</text>
<text x="270.0" y="353.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_reg_mr(pd, buf, len, access)</text>
<text x="270.0" y="373.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">lkey (local SGEs)</text>
<text x="270.0" y="393.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">rkey (handed to peers)</text>
<text x="270.0" y="413.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">pins pages, builds MTT</text>
<g><title>Queue Pair (QP)</title><rect x="430" y="300" width="280" height="130" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="570.0" y="330.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Queue Pair (QP)</text>
<text x="570.0" y="353.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_create_qp: SQ + RQ</text>
<text x="570.0" y="373.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">QPN 24-bit, type RC/UC/UD</text>
<text x="570.0" y="393.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">state machine RESET..RTS</text>
<text x="570.0" y="413.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ordering is per QP</text>
<g><title>Shared Receive Queue (SRQ)</title><rect x="130" y="460" width="280" height="100" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="270.0" y="495.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Shared Receive Queue (SRQ)</text>
<text x="270.0" y="518.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">one RQ for many QPs</text>
<text x="270.0" y="538.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">needed by XRC; UCX/MPI use it</text>
<g><title>Address Handle (AH)</title><rect x="430" y="460" width="280" height="100" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="570.0" y="495.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Address Handle (AH)</text>
<text x="570.0" y="518.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_create_ah: DLID/DGID, SL, port</text>
<text x="570.0" y="538.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">UD destinations only</text>
<g><title>Work Requests -&gt; WQEs</title><rect x="130" y="590" width="580" height="170" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="420.0" y="640.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Work Requests -&gt; WQEs</text>
<text x="420.0" y="663.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_post_send / ibv_post_recv write a WQE into the SQ/RQ ring:</text>
<text x="420.0" y="683.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">opcode, SGE list {addr, length, lkey}, flags (SIGNALED, INLINE, FENCE),</text>
<text x="420.0" y="703.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">for RDMA: wr.rdma {remote_addr, rkey}; for UD: wr.ud {ah, remote_qpn, qkey}</text>
<text x="420.0" y="723.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">then ring the doorbell (one MMIO write)</text>
<g><title>Completion Queue (CQ)</title><rect x="770" y="300" width="340" height="160" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="940.0" y="345.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Completion Queue (CQ)</text>
<text x="940.0" y="368.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_create_cq(ctx, cqe, ...)</text>
<text x="940.0" y="388.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">HCA writes CQEs: status, opcode,</text>
<text x="940.0" y="408.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">byte_len, wr_id, imm_data</text>
<text x="940.0" y="428.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_poll_cq reads them (no syscall)</text>
<g><title>Completion Channel</title><rect x="770" y="500" width="340" height="100" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="940.0" y="535.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Completion Channel</text>
<text x="940.0" y="558.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">fd for blocking wait:</text>
<text x="940.0" y="578.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_req_notify_cq + ibv_get_cq_event</text>
<line x1="710" y1="365" x2="770" y2="365" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="740" y="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">CQEs</text>
<line x1="940" y1="500" x2="940" y2="460" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><rect x="1190" y="150" width="370" height="700" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="1202" y="174" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Creation order (Module 3.2):</text>
<text x="1202" y="194" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"> context -&gt; PD -&gt; MR, CQ -&gt; QP</text>
<text x="1202" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"> -&gt; exchange params -&gt; INIT/RTR/RTS</text>
<text x="1202" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="1202" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Rules the exam tests:</text>
<text x="1202" y="274" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- lkey in local SGEs; rkey given</text>
<text x="1202" y="294" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  to the REMOTE side for READ/</text>
<text x="1202" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  WRITE/atomics.</text>
<text x="1202" y="334" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- QP and MR must share a PD or</text>
<text x="1202" y="354" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  you get LOC_PROT_ERR.</text>
<text x="1202" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- SQ and RQ may share one CQ or</text>
<text x="1202" y="394" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  use two.</text>
<text x="1202" y="414" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- A RECV WQE must be posted before</text>
<text x="1202" y="434" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  a SEND arrives (else RNR NAK).</text>
<text x="1202" y="454" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- WRITE with immediate consumes a</text>
<text x="1202" y="474" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  RECV WQE; plain WRITE does not.</text>
<text x="1202" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="1202" y="514" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Observe: rdma resource show</text>
<text x="1202" y="534" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  pd 2 cq 3 qp 2 mr 1 ctx 1 srq 0</text>
</svg>
