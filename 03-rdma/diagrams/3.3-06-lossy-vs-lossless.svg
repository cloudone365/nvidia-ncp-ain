<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Decision flow from workload type and hardware generation to lossy, lossless or Spectrum-X RoCE profiles with the configuration consequences of each"><title>Lossy or lossless RoCE? The decision and what each choice commits you to</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Lossy or lossless RoCE? The decision and what each choice commits you to</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">NVIDIA guidance for AI training fabrics: lossless (PFC + ECN) with ECN doing the work; Spectrum-X adds adaptive routing and SuperNIC reordering</text>
<g><title>Start: RoCE v2 fabric for ...</title><rect x="560" y="150" width="480" height="70" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="190.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Start: RoCE v2 fabric for ...</text>
<g><title>NCCL training / storage with strict loss sensitivity?</title><rect x="560" y="260" width="480" height="80" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="295.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">NCCL training / storage with strict loss sensitivity?</text>
<text x="800.0" y="317.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">go-back-N retransmit collapses throughput at ~0.1 % loss</text>
<line x1="800" y1="220" x2="800" y2="260" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>Lossy RoCE  (nv set qos roce mode lossy)</title><rect x="80" y="420" width="420" height="110" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="290.0" y="450.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">Lossy RoCE  (nv set qos roce mode lossy)</text>
<text x="290.0" y="472.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ECN/DCQCN only, no PFC, SP3 in lossy pool</text>
<text x="290.0" y="492.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">relies on CX-5+ selective repeat + deep buffers</text>
<text x="290.0" y="512.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">simpler, no storm risk, multi-vendor</text>
<g><title>Lossless RoCE  (mode lossless)</title><rect x="590" y="420" width="420" height="110" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="450.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">Lossless RoCE  (mode lossless)</text>
<text x="800.0" y="472.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">PFC on SP3 + ECN on TC3 + CNP TC6 strict</text>
<text x="800.0" y="492.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">headroom from cable-length, watchdog on</text>
<text x="800.0" y="512.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">NVIDIA recommendation for training</text>
<g><title>Spectrum-X  (Spectrum-4 + BlueField-3)</title><rect x="1100" y="420" width="420" height="110" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1310.0" y="450.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">Spectrum-X  (Spectrum-4 + BlueField-3)</text>
<text x="1310.0" y="472.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">lossless profile as backstop</text>
<text x="1310.0" y="492.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">per-packet adaptive routing + DDP reordering</text>
<text x="1310.0" y="512.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">telemetry-based congestion control</text>
<line x1="640" y1="340" x2="290" y2="420" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="465.0" y="368.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1f2937" text-anchor="middle">no: mixed / tolerant / legacy NICs</text>
<line x1="800" y1="340" x2="800" y2="420" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="800.0" y="374.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1f2937" text-anchor="start">yes</text>
<line x1="960" y1="340" x2="1310" y2="420" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="1135.0" y="368.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1f2937" text-anchor="middle">yes + Spectrum-4/BF3 end to end</text>
<circle cx="760" cy="380" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="760" y="386" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<g><rect x="80" y="570" width="420" height="250" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="92" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Commits you to:</text>
<text x="92" y="613" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- ECN thresholds tuned by measurement</text>
<text x="92" y="632" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- accept rare loss: out_of_sequence,</text>
<text x="92" y="651" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  packet_seq_err &gt; 0 is normal</text>
<text x="92" y="670" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- NOT for NCCL at scale</text>
<text x="92" y="689" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- ConnectX-5 or newer</text>
<text x="92" y="708" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Watch: TC0/TC3 drops on switch,</text>
<text x="92" y="727" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">retransmit counters on NICs</text>
<g><rect x="590" y="570" width="420" height="250" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="602" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Commits you to:</text>
<text x="602" y="613" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- PFC + ECN on EVERY hop and host</text>
<text x="602" y="632" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- trust DSCP everywhere, DSCP 26/48</text>
<text x="602" y="651" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- headroom per port class (DAC vs fibre)</text>
<text x="602" y="670" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- PFC watchdog + storm alerting</text>
<text x="602" y="689" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- MTU trio 9000 / 9216 / 4096</text>
<text x="602" y="708" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Watch: rx_prio3_discards = 0 always,</text>
<text x="602" y="727" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">pfc frames small and non-growing</text>
<g><rect x="1100" y="570" width="420" height="250" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="1112" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Commits you to:</text>
<text x="1112" y="613" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- NVIDIA end-to-end (switch + SuperNIC)</text>
<text x="1112" y="632" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- same DSCP/TC/PFC foundation</text>
<text x="1112" y="651" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- nv set router adaptive-routing ...</text>
<text x="1112" y="670" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">- reordering handled in BlueField-3</text>
<text x="1112" y="689" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Gains: ECMP collisions gone,</text>
<text x="1112" y="708" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">higher effective bandwidth (NVIDIA figures)</text>
<text x="1112" y="727" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Module 4.1</text>
<text x="800" y="860" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">Whatever you choose, the application marking (NCCL_IB_TC / --tclass / cma_roce_tos = 106) is what puts traffic in the class at all.</text>
</svg>
