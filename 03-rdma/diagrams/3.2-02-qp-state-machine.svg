<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" role="img" aria-label="State diagram of an RC queue pair with RESET INIT RTR RTS SQD SQE and ERR states, the required attribute masks on each transition and what may be posted in each state"><title>RC Queue Pair state machine and the attributes each ibv_modify_qp must carry</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="960" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">RC Queue Pair state machine and the attributes each ibv_modify_qp must carry</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">RESET -&gt; INIT -&gt; RTR -&gt; RTS is the happy path; SQD/SQE/ERR are the detours. Receives from INIT, sends only in RTS</text>
<g><title>RESET</title><rect x="60" y="330" width="260" height="110" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="190.0" y="365.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1f2937" text-anchor="middle">RESET</text>
<text x="190.0" y="395.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5f6b7a" text-anchor="middle">ibv_create_qp</text>
<text x="190.0" y="421.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5f6b7a" text-anchor="middle">nothing may be posted</text>
<g><title>INIT</title><rect x="420" y="330" width="260" height="110" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="550.0" y="365.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1f2937" text-anchor="middle">INIT</text>
<text x="550.0" y="395.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5f6b7a" text-anchor="middle">post_recv ALLOWED</text>
<text x="550.0" y="421.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5f6b7a" text-anchor="middle">sends rejected</text>
<g><title>RTR</title><rect x="780" y="330" width="260" height="110" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="910.0" y="365.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1f2937" text-anchor="middle">RTR</text>
<text x="910.0" y="395.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5f6b7a" text-anchor="middle">inbound accepted</text>
<text x="910.0" y="421.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5f6b7a" text-anchor="middle">sends rejected</text>
<g><title>RTS</title><rect x="1140" y="330" width="260" height="110" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1270.0" y="365.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1f2937" text-anchor="middle">RTS</text>
<text x="1270.0" y="395.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5f6b7a" text-anchor="middle">full operation</text>
<text x="1270.0" y="421.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5f6b7a" text-anchor="middle">post_send + post_recv</text>
<line x1="320" y1="385" x2="420" y2="385" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<circle cx="370" cy="360" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="370" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<line x1="680" y1="385" x2="780" y2="385" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<circle cx="730" cy="360" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="730" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<line x1="1040" y1="385" x2="1140" y2="385" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<circle cx="1090" cy="360" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="1090" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<g><rect x="210" y="465" width="380" height="180" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="222" y="489" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">1  RESET -&gt; INIT</text>
<text x="222" y="508" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_STATE</text>
<text x="222" y="527" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_PKEY_INDEX (partition)</text>
<text x="222" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_PORT</text>
<text x="222" y="565" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_ACCESS_FLAGS</text>
<text x="222" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  (what the PEER may do to us:</text>
<text x="222" y="603" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  REMOTE_WRITE / READ / ATOMIC)</text>
<g><rect x="630" y="465" width="380" height="180" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="642" y="489" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">2  INIT -&gt; RTR</text>
<text x="642" y="508" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_AV (address vector):</text>
<text x="642" y="527" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  dlid | dgid + sgid_index, sl, tclass</text>
<text x="642" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_PATH_MTU (&lt;= min active_mtu)</text>
<text x="642" y="565" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_DEST_QPN, IBV_QP_RQ_PSN</text>
<text x="642" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  (both learned from the peer)</text>
<text x="642" y="603" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_MAX_DEST_RD_ATOMIC</text>
<text x="642" y="622" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_MIN_RNR_TIMER</text>
<g><rect x="1045" y="465" width="335" height="180" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="1057" y="489" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">3  RTR -&gt; RTS</text>
<text x="1057" y="508" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_SQ_PSN (ours)</text>
<text x="1057" y="527" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_TIMEOUT: 4.096 us x 2^n</text>
<text x="1057" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">  (14 ~ 67 ms, 18 ~ 1.07 s)</text>
<text x="1057" y="565" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_RETRY_CNT (0-7)</text>
<text x="1057" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_RNR_RETRY (7 = infinite)</text>
<text x="1057" y="603" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">IBV_QP_MAX_QP_RD_ATOMIC</text>
<g><title>SQD</title><rect x="1140" y="160" width="260" height="90" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1270.0" y="188.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937" text-anchor="middle">SQD</text>
<text x="1270.0" y="215.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">Send Queue Drain</text>
<text x="1270.0" y="238.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">re-configure path safely</text>
<line x1="1230" y1="330" x2="1230" y2="250" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="1310" y1="250" x2="1310" y2="330" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="1410" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">modify(SQD)</text>
<text x="1410" y="220" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">then modify(RTS)</text>
<g><title>SQE</title><rect x="780" y="160" width="260" height="90" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="910.0" y="188.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937" text-anchor="middle">SQE</text>
<text x="910.0" y="215.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">Send Queue Error</text>
<text x="910.0" y="238.3" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">UD/UC only; RC goes to ERR</text>
<line x1="1175" y1="330" x2="1045" y2="252" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<g><title>ERR state</title><rect x="420" y="680" width="980" height="96" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="910" y="708" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">ERR: every queued WR completes with IBV_WC_WR_FLUSH_ERR</text>
<text x="910" y="734" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="middle">entered on a fatal completion (RETRY_EXC, REM_ACCESS_ERR, RNR_RETRY_EXC) or modify(ERR)</text>
<text x="910" y="758" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">leave with modify(RESET) to reuse the QP, or ibv_destroy_qp</text>
<line x1="610" y1="440" x2="610" y2="680" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<line x1="1025" y1="440" x2="1025" y2="680" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<line x1="1390" y1="440" x2="1390" y2="680" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<line x1="420" y1="728" x2="190" y2="728" stroke="#1f2937" stroke-width="3"/>
<path d="M190,728 L190,440" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="178" y="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">modify</text>
<text x="178" y="579" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="end">(RESET)</text>
<g><rect x="40" y="800" width="1520" height="80" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="52" y="824" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Why the exam cares: the handshake is &#x27;both sides reach RTR, exchange a ready signal, then RTS&#x27; — a SEND arriving before the peer is in RTR is dropped/NAKed.</text>
<text x="52" y="844" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">RDMA CM performs 1-3 for you (rdma_create_qp -&gt; INIT; connect/accept -&gt; RTR -&gt; RTS). The network lives in the attributes: PKey, SL, MTU, LID/GID, DSCP (traffic_class),</text>
<text x="52" y="864" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">timeout/retry = how long a flow survives a link flap. Observe live state with: rdma resource show qp  (state RTS/ERR, rq-psn, sq-psn, pid).</text>
</svg>
