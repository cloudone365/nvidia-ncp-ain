<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Side by side comparison of a TCP send path with syscalls and socket buffer copies versus an RDMA path where the application posts a work request and the HCA DMAs directly from user or GPU memory to the remote buffer"><title>Data path: TCP/IP sockets vs RDMA verbs (kernel bypass + zero copy)</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Data path: TCP/IP sockets vs RDMA verbs (kernel bypass + zero copy)</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Left: every message crosses the kernel twice and is copied twice. Right: the HCA DMAs straight between registered buffers; the kernel only sets things up</text>
<g><title>TCP/IP (sockets)</title><rect x="40" y="150" width="740" height="600" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="0.45"/></g>
<text x="56" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">TCP/IP (sockets)</text>
<g><title>Application buffer (user space / GPU HBM)</title><rect x="70" y="200" width="680" height="60" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="410.0" y="235.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Application buffer (user space / GPU HBM)</text>
<g><title>Kernel: syscall send() -&gt; socket buffer (copy #1)</title><rect x="70" y="300" width="680" height="60" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="410.0" y="335.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Kernel: syscall send() -&gt; socket buffer (copy #1)</text>
<g><title>TCP/IP stack: segmentation, headers, ACK state, interrupts</title><rect x="70" y="400" width="680" height="60" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="410.0" y="435.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">TCP/IP stack: segmentation, headers, ACK state, interrupts</text>
<g><title>NIC driver ring -&gt; DMA from socket buffer (copy #2)</title><rect x="70" y="500" width="680" height="60" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="410.0" y="535.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">NIC driver ring -&gt; DMA from socket buffer (copy #2)</text>
<g><title>Wire: Ethernet frames</title><rect x="70" y="600" width="680" height="60" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="410.0" y="635.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Wire: Ethernet frames</text>
<line x1="410" y1="260" x2="410" y2="300" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="410" y1="360" x2="410" y2="400" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="410" y1="460" x2="410" y2="500" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="410" y1="560" x2="410" y2="600" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<circle cx="740" cy="330" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="740" y="336" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="740" cy="430" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="740" y="436" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="740" cy="530" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="740" y="536" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="70" y="690" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="start">Per message: 2+ copies, 2 context switches, interrupts. At 400 Gb/s x 8 GPUs the</text>
<text x="70" y="714" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="start">copies alone exceed host memory bandwidth; CPU saturates long before the link.</text>
<g><title>RDMA (verbs)</title><rect x="820" y="150" width="740" height="600" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="0.45"/></g>
<text x="836" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">RDMA (verbs)</text>
<g><title>Application buffer (user space / GPU HBM)</title><rect x="850" y="200" width="680" height="60" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1190.0" y="235.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Application buffer (user space / GPU HBM)</text>
<g><rect x="850" y="300" width="680" height="60" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1190.0" y="335.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">libibverbs: ibv_post_send = WQE + doorbell write (no syscall)</text>
<g><title>Kernel: only setup (open device, ibv_reg_mr pins pages, QP connect)</title><rect x="1225" y="392" width="305" height="76" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="8 6" fill-opacity="1.0"/></g>
<text x="1377" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Kernel: setup only</text>
<text x="1377" y="450" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">open, ibv_reg_mr (pins), connect</text>
<g><rect x="850" y="500" width="680" height="60" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1190.0" y="535.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">ConnectX-7 HCA: MTT lookup by lkey, DMA, builds packets</text>
<g><title>Wire: IB packets (LRH/BTH) or RoCE v2 (UDP 4791)</title><rect x="850" y="600" width="680" height="60" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1190.0" y="635.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Wire: IB packets (LRH/BTH) or RoCE v2 (UDP 4791)</text>
<line x1="1190" y1="260" x2="1190" y2="300" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="1190" y1="360" x2="1190" y2="500" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="1190" y1="560" x2="1190" y2="600" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<path d="M880,260 L880,500" fill="none" stroke="#76b900" stroke-width="4" marker-end="url(#arrow-green)"/>
<text x="896" y="420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#76b900" text-anchor="start">zero copy: the HCA DMAs</text>
<text x="896" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#76b900" text-anchor="start">from the app buffer itself</text>
<circle cx="1520" cy="330" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="1520" y="336" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="1520" cy="530" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="1520" y="536" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="1520" cy="630" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="1520" y="636" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="850" y="690" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1 one MMIO doorbell per message   2 HCA segments, ACKs, retries, orders</text>
<text x="850" y="714" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">3 remote HCA writes registered memory, no remote CPU. ~1 us, ~0 % CPU</text>
<g><rect x="40" y="780" width="1520" height="80" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="52" y="804" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Kernel bypass != no kernel: device open, memory registration (pinning, memlock), connection setup and error handling still use the driver.</text>
<text x="52" y="824" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Only the fast path (post, doorbell, poll CQ) bypasses it. Memory registration is slow (ms for GB) -&gt; every library caches registrations.</text>
</svg>
