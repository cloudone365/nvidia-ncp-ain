<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="100%" role="img" aria-label="Timeline of a requester sending to a responder with no posted receive, the RNR NAK with min_rnr_timer back-off and rnr_retry attempts, followed by an ACK timeout retransmission and the terminal error completions"><title>RNR NAK and transport retry timeline on an RC QP</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="980" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">RNR NAK and transport retry timeline on an RC QP</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Receiver Not Ready = the responder has no RECV WQE; ACK timeout = the packet or its ACK was lost. Both end in a CQE error if retries run out</text>
<g><title>requester (hostA)</title><rect x="160.0" y="140" width="380" height="64" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="350.0" y="167.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">requester (hostA)</text>
<text x="350.0" y="192.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">rnr_retry 7 / 0, retry_cnt 7, timeout 14</text>
<g><title>responder (hostB)</title><rect x="1060.0" y="140" width="380" height="64" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1250.0" y="167.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">responder (hostB)</text>
<text x="1250.0" y="192.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">min_rnr_timer 12 (~0.64 ms), RQ depth 2</text>
<line x1="350" y1="204" x2="350" y2="880" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="1250" y1="204" x2="1250" y2="880" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 6"/>
<text x="70" y="360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">RNR case</text>
<line x1="350" y1="250" x2="1250" y2="250" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="364" y="241" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="500" fill="#2f6fdb" text-anchor="start">WRITE_WITH_IMM #2  (PSN 102) — RQ has no RECV WQE</text>
<circle cx="320" cy="250" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="320" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<line x1="1250" y1="294" x2="350" y2="294" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="364" y="285" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="500" fill="#d93025" text-anchor="start">RNR NAK (AETH syndrome: RNR, timer = min_rnr_timer) — packet is NOT stored</text>
<circle cx="320" cy="294" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="320" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<g><rect x="170" y="328" width="360" height="40" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="182" y="352" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">wait min_rnr_timer (0.64 ms), rnr_retry -= 1</text>
<circle cx="140" cy="348" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="140" y="354" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<g><rect x="1070" y="328" width="360" height="40" rx="6" fill="#e4f1cc" stroke="#76b900" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="1082" y="352" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">app polls CQE #1, posts a new RECV</text>
<line x1="350" y1="394" x2="1250" y2="394" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="364" y="385" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="500" fill="#2f6fdb" text-anchor="start">retransmit PSN 102 (same data, same PSN)</text>
<circle cx="320" cy="394" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="320" y="400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<line x1="1250" y1="438" x2="350" y2="438" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="364" y="429" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="500" fill="#6b7280" text-anchor="start">ACK — rnr_retry counter resets on success</text>
<g><rect x="170" y="464" width="440" height="40" rx="6" fill="#ffd9d9" stroke="#d93025" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="182" y="488" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">rnr_retry 0 instead -&gt; IBV_WC_RNR_RETRY_EXC_ERR, QP -&gt; ERR</text>
<text x="70" y="644" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">loss / timeout</text>
<line x1="350" y1="544" x2="1250" y2="544" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="364" y="535" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="500" fill="#2f6fdb" text-anchor="start">WRITE PSN 103 ... 110 (lost on a flapping link)</text>
<circle cx="320" cy="544" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="320" y="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<g><rect x="170" y="578" width="400" height="40" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="182" y="602" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">no ACK within 4.096 us x 2^14 = 67 ms  (timeout attr)</text>
<circle cx="140" cy="598" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="140" y="604" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<line x1="350" y1="644" x2="1250" y2="644" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="364" y="635" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="500" fill="#2f6fdb" text-anchor="start">retransmit from PSN 103 (go-back-N), retry_cnt -= 1  (7 tries x 67 ms ~ 0.5 s; NCCL: timeout 18 x 7 ~ 7+ s)</text>
<circle cx="320" cy="644" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="320" y="650" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<line x1="1250" y1="688" x2="350" y2="688" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="364" y="679" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="500" fill="#6b7280" text-anchor="start">ACK PSN 110  (or NAK PSN-seq-error if PSN != expected -&gt; resend from there)</text>
<g><rect x="170" y="714" width="360" height="40" rx="6" fill="#ffd9d9" stroke="#d93025" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="182" y="738" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">retry_cnt exhausted -&gt; IBV_WC_RETRY_EXC_ERR, QP -&gt; ERR</text>
<g><rect x="60" y="794" width="1040" height="100" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="72" y="818" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Counters (rdma statistic show link): rnr_nak_retry_err, local_ack_timeout_err, packet_seq_err, out_of_sequence, duplicate_request.</text>
<text x="72" y="837" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">RNR = application pacing (receiver slow, rx-depth small). RETRY_EXC = path problem: dead link, wrong LID/GID, MTU, PKey, no route.</text>
<text x="72" y="856" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">WR_FLUSH_ERR on later WRs is a consequence (QP already in ERR), never the root cause.</text>
<g><rect x="1130" y="794" width="430" height="112" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="1144" y="814" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5f6b7a" text-anchor="start">Legend</text>
<line x1="1144" y1="836" x2="1204" y2="836" stroke="#2f6fdb" stroke-width="4"/>
<text x="1216" y="842" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (IB / RDMA payload)</text>
<line x1="1144" y1="866" x2="1204" y2="866" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1216" y="872" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (SM MADs, REST, CM)</text>
<line x1="1144" y1="896" x2="1204" y2="896" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6"/>
<text x="1216" y="902" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Congestion / flow-control signal</text>
</svg>
