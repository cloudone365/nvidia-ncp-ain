<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>WJH pipeline: from an ASIC drop decision to a record you can read</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0" y="0" width="1600" height="960" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">WJH pipeline: from an ASIC drop decision to a record you can read</text><text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Every drop (not a sample) leaves the Spectrum ASIC with reason, ports, timestamp and headers; one consumer owns the channel</text><g><title>Spectrum ASIC  (SN5600 leaf)</title><rect x="48" y="150" width="420" height="420" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="258.0" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">Spectrum ASIC  (SN5600 leaf)</text>
</g>
<g><title>Forwarding pipeline</title><rect x="70" y="200" width="376" height="140" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="86" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Forwarding pipeline</text>
<text x="86" y="255" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">parse -&gt; L2 lookup -&gt; L3 lookup</text>
<text x="86" y="275" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">-&gt; ACL -&gt; tunnel -&gt; QoS / buffer</text>
<text x="86" y="295" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">-&gt; egress</text>
</g>
<g><title>Drop / congestion decision</title><rect x="70" y="360" width="376" height="190" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="86" y="386" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Drop / congestion decision</text>
<text x="86" y="415" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">packet discarded, or queue / latency</text>
<text x="86" y="435" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">threshold crossed</text>
<text x="86" y="455" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ASIC attaches: reason code, ingress</text>
<text x="86" y="475" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">+ egress port, timestamp, header copy</text>
<text x="86" y="495" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">(optionally truncated payload)</text>
</g>
<g><title>Step 1</title><circle cx="70" cy="360" r="16" fill="#1f2937"/><text x="70" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<g><title>Drop categories (trigger groups)</title><rect x="500" y="150" width="420" height="420" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="516" y="177" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Drop categories (trigger groups)</text>
<text x="516" y="206" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">L1      link training / oper down /</text>
<text x="516" y="224" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">        admin down</text>
<text x="516" y="242" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">L2      VLAN, STP, loopback filter;</text>
<text x="516" y="260" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">        bad SMAC (zero/mcast/=DMAC); MLAG</text>
<text x="516" y="278" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Router  unicast route miss, blackhole,</text>
<text x="516" y="296" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">        TTL exceeded, unresolved neighbor</text>
<text x="516" y="314" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Tunnel  VXLAN decap error, tunnel down</text>
<text x="516" y="332" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ACL     ingress/egress port or router</text>
<text x="516" y="350" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">        ACL (+ rule id)</text>
<text x="516" y="368" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Buffer  tail drop, WRED, TC congestion</text>
<text x="516" y="386" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">        threshold, latency threshold</text>
<text x="516" y="404" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">        (the PFC / RoCE home)</text>
<text x="516" y="422" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">severity: Error (broken) / Warning</text>
<text x="516" y="440" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  (config, capacity) / Notice</text>
<text x="516" y="458" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  (expected, e.g. ACL deny)</text>
</g>
<g><title>WJH service on the switch</title><rect x="48" y="620" width="420" height="200" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="64" y="647" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">WJH service on the switch</text>
<text x="64" y="677" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv-wjh.service (5.18+), earlier</text>
<text x="64" y="697" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">what-just-happened.service</text>
<text x="64" y="717" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">reads the ASIC drop channel,</text>
<text x="64" y="737" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">aggregates per polling-interval (5-300 s),</text>
<text x="64" y="757" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">scoped by channels + triggers + drop-filters</text>
</g>
<g><title>Step 2</title><circle cx="48" cy="620" r="16" fill="#1f2937"/><text x="48" y="626" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<line x1="258" y1="570" x2="258" y2="620" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)" fill="none"/>
<g><title>Local consumers</title><rect x="560" y="620" width="360" height="200" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="576" y="647" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Local consumers</text>
<text x="576" y="676" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv show system wjh packet-buffer</text>
<text x="576" y="694" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv show system wjh aggregate-buffer</text>
<text x="576" y="712" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv show system wjh l1-buffer</text>
<text x="576" y="730" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv-wjh-cli poll --data drops</text>
<text x="576" y="748" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">  (or: aggregates | l1)</text>
<text x="576" y="766" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv action export ... -&gt; .pcap</text>
</g>
<g><title>Step 3</title><circle cx="560" cy="620" r="16" fill="#1f2937"/><text x="560" y="626" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<line x1="468" y1="720" x2="560" y2="720" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)" fill="none"/>
<g><title>NetQ path  (fleet-wide search)</title><rect x="980" y="150" width="570" height="260" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="996" y="177" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">NetQ path  (fleet-wide search)</text>
<text x="996" y="206" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">1. nv set system wjh state disabled ; nv config apply</text>
<text x="996" y="224" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">2. netq config add agent wjh</text>
<text x="996" y="242" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">3. netq config restart agent</text>
<text x="996" y="260" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">netq-agent reads the channel instead of nv-wjh and ships</text>
<text x="996" y="278" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">records to the NetQ server (mgmt VRF, TCP 31980 - verify)</text>
<text x="996" y="296" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">netq show wjh-drop buffer dst-port 4791 between now and 1h</text>
<text x="996" y="314" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">'NetQ shows nothing' = local service still owns the channel</text>
</g>
<g><title>Step 4</title><circle cx="980" cy="150" r="16" fill="#1f2937"/><text x="980" y="156" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<path d="M468,680 L520,680 L520,588 L950,588 L950,280 L980,280" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)" fill="none"/>
<g><title>Streaming export</title><rect x="980" y="450" width="570" height="120" rx="10" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5"/>
<text x="996" y="477" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Streaming export</text>
<text x="996" y="506" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Kafka / gRPC / OpenTelemetry (gNMI) collectors;</text>
<text x="996" y="524" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">exact config differs per release - verify in docs</text>
<text x="996" y="542" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">exam: know that export beyond NetQ exists</text>
</g>
<g><title>Step 5</title><circle cx="980" cy="450" r="16" fill="#1f2937"/><text x="980" y="456" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<path d="M950,500 L980,500" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)" fill="none"/>
<g><title>One consumer rule</title><rect x="980" y="620" width="570" height="200" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="996" y="647" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">One consumer rule</text>
<text x="996" y="676" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">the ASIC drop channel has exactly one reader:</text>
<text x="996" y="694" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">local nv-wjh  OR  netq-agent (wjh), never both.</text>
<text x="996" y="712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Same idea as a serial console: two readers,</text>
<text x="996" y="730" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">one of them sees nothing.</text>
<text x="996" y="748" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Counters (nv show interface swpX counters) still</text>
<text x="996" y="766" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">work either way - they are a different path.</text>
</g>
<g><title>Legend</title><rect x="1190" y="850" width="360" height="54" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<line x1="1206" y1="876" x2="1260" y2="876" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1274" y="881" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">WJH record flow</text>
</g>
<text x="48" y="880" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start" xml:space="preserve">1 ASIC decides and annotates   2 service collects and aggregates   3 read locally   4 or hand the channel to NetQ   5 or stream out</text></svg>
