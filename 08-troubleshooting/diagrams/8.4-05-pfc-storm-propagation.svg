<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>PFC storm propagation, hop by hop</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">PFC storm propagation, hop by hop</text><text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">One receiver that stops draining priority 3 can pause an entire lossless class across the pod within milliseconds</text><g><title>dgx-02  mlx5_2</title><rect x="60" y="500" width="300" height="150" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="210.0" y="528" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">dgx-02  mlx5_2</text>
<text x="210.0" y="558" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">NIC / driver hung, RX ring full</text>
<text x="210.0" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">keeps sending PFC pause (pri 3)</text>
<text x="210.0" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">at line rate - never XON</text>
</g>
<g><title>leaf-r2-01 (SN5600)</title><rect x="460" y="500" width="300" height="150" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="610.0" y="528" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">leaf-r2-01 (SN5600)</text>
<text x="610.0" y="558" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">swp2 -&gt; dgx-02: Tx stops on TC3</text>
<text x="610.0" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">egress queue TC3 fills</text>
<text x="610.0" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">xoff threshold on swp1, swp49 hit</text>
</g>
<g><title>spine-01</title><rect x="860" y="500" width="300" height="150" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1010.0" y="528" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">spine-01</text>
<text x="1010.0" y="558" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">swp12 -&gt; leaf-r2-01 paused</text>
<text x="1010.0" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">its TC3 queue fills for ALL</text>
<text x="1010.0" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">flows that hash to that uplink</text>
</g>
<g><title>leaf-r0-01 .. leaf-r7-01</title><rect x="1260" y="500" width="290" height="150" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1405.0" y="528" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">leaf-r0-01 .. leaf-r7-01</text>
<text x="1405.0" y="558" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">uplinks to spine-01 paused</text>
<text x="1405.0" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">their host ports pause</text>
<text x="1405.0" y="594" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">every DGX on priority 3</text>
</g>
<g><title>dgx-01  mlx5_2</title><rect x="460" y="720" width="300" height="110" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="610.0" y="747" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">dgx-01  mlx5_2</text>
<text x="610.0" y="776" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">innocent sender on swp1</text>
<text x="610.0" y="794" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">paused: NCCL stalls, 'error 12'</text>
</g>
<line x1="460" y1="540" x2="364" y2="540" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)" fill="none"/>
<line x1="860" y1="540" x2="764" y2="540" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)" fill="none"/>
<line x1="1260" y1="540" x2="1164" y2="540" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)" fill="none"/>
<path d="M360,600 L460,600" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Step 1</title><circle cx="410" cy="570" r="16" fill="#1f2937"/><text x="410" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<path d="M760,600 L860,600" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Step 3</title><circle cx="810" cy="570" r="16" fill="#1f2937"/><text x="810" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<path d="M1160,600 L1260,600" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Step 4</title><circle cx="1210" cy="570" r="16" fill="#1f2937"/><text x="1210" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<path d="M610,650 L610,720" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Step 2</title><circle cx="640" cy="685" r="16" fill="#1f2937"/><text x="640" y="691" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<text x="410" y="626" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#d93025" text-anchor="middle">PFC XOFF</text><text x="410" y="643" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#d93025" text-anchor="middle">pri 3</text>
<text x="810" y="626" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#d93025" text-anchor="middle">PFC XOFF</text><text x="810" y="643" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#d93025" text-anchor="middle">pri 3</text>
<text x="1210" y="626" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#d93025" text-anchor="middle">PFC XOFF</text><text x="1210" y="643" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#d93025" text-anchor="middle">pri 3</text>
<text x="660" y="700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#d93025" text-anchor="start" xml:space="preserve">XOFF to the host</text>
<g><title>Why it spreads (buffer math)</title><rect x="60" y="150" width="720" height="310" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<text x="76" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Why it spreads (buffer math)</text>
<text x="76" y="209" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">PFC is per-priority, per-hop, and reactive: a port sends XOFF when its ingress</text>
<text x="76" y="229" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">buffer for that priority crosses the xoff threshold, and the peer must stop within</text>
<text x="76" y="249" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">the pause quanta. The headroom (cable-length dependent: nv set qos roce cable-length)</text>
<text x="76" y="269" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">absorbs in-flight bytes, so nothing is dropped - by design, nothing is dropped.</text>
<text x="76" y="289" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">That is the trap: if the receiver never resumes (XON), back-pressure walks upstream</text>
<text x="76" y="309" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">one hop per buffer-fill, and since the spine queue serves many flows, every leaf</text>
<text x="76" y="329" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">behind it is paused for traffic that is not even destined to the stuck node.</text>
<text x="76" y="349" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ECN cannot help: it marks packets to slow senders over ~ms RTTs; a storm is us-scale.</text>
<text x="76" y="369" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Normal back-pressure: Tx pause rises and falls with job phases.</text>
<text x="76" y="389" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Storm: pause counter climbs continuously with the link idle, throughput 0.</text>
</g>
<g><title>How you see it, per hop</title><rect x="820" y="150" width="730" height="310" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="836" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">How you see it, per hop</text>
<text x="836" y="208" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">netq &lt;leaf&gt; show roce-counters       Tx PFC Pause(pri3) climbing on one host port</text>
<text x="836" y="226" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">nv show interface swp2 counters --view=pause   two samples 10 s apart, link idle:</text>
<text x="836" y="244" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">                                     delta &gt; 0 while idle = storm signature</text>
<text x="836" y="262" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">netq show wjh-drop buffer             'Port TC congestion threshold crossed' TC 3</text>
<text x="836" y="280" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">netq show wjh-drop l1                 oper-down / training events if the NIC reset</text>
<text x="836" y="298" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">host: mlnx_qos -i &lt;if&gt; ; ethtool -S | grep pause ; dmesg (mlx5 timeout / reset)</text>
<text x="836" y="316" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">spine: Rx PFC pause on the downlink from the sick leaf</text>
<text x="836" y="334" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Fix: isolate the port (nv set interface swp2 link state down), reset the NIC /</text>
<text x="836" y="352" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">driver, then re-enable; consider PFC watchdog / pause-storm protection (verify</text>
<text x="836" y="370" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">availability per release) so the switch drops instead of propagating.</text>
</g>
<g><title>Legend</title><rect x="860" y="720" width="520" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<line x1="876" y1="746" x2="930" y2="746" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="944" y="751" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">RoCE data direction (priority 3)</text>
<line x1="876" y1="776" x2="930" y2="776" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="944" y="781" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">PFC XOFF pause frames (walk upstream)</text>
</g>
<text x="60" y="870" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start" xml:space="preserve">1 stuck NIC pauses its leaf   2 leaf pauses its other hosts   3 leaf pauses the spine   4 spine pauses every other leaf</text></svg>
