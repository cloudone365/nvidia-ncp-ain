<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>perftest client/server exchange and what the columns mean</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">perftest client/server exchange and what the columns mean</text><text x="48" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">ib_write_bw: TCP carries only the connection parameters; every measured byte is an RDMA WRITE over the fabric</text><g><title>dgx-07  client</title><rect x="130" y="140" width="400" height="70" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="330.0" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">dgx-07  client</text>
<text x="330.0" y="198" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">ib_write_bw -d mlx5_1 -i 1 -F -a -q 4 10.0.1.8</text>
</g>
<g><title>dgx-08  server</title><rect x="630" y="140" width="400" height="70" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
<text x="830.0" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">dgx-08  server</text>
<text x="830.0" y="198" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">ib_write_bw -d mlx5_1 -i 1 -F -a -q 4</text>
</g>
<line x1="330" y1="210" x2="330" y2="940" stroke="#6b7280" stroke-width="2" fill="none"/>
<line x1="830" y1="210" x2="830" y2="940" stroke="#6b7280" stroke-width="2" fill="none"/>
<g><title>Step 1</title><circle cx="90" cy="275" r="16" fill="#1f2937"/><text x="90" y="281" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g>
<path d="M830,261 L890,261 L890,289 L834,289" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" fill="none"/>
<rect x="126" y="235" width="686" height="19" fill="#ffffff"/><text x="130" y="249" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">server listens on TCP 18515 (-p); allocates PD, MR of -s bytes (or 2 B..8 MB with -a), CQ, -q QPs</text>
<g><title>Step 2</title><circle cx="90" cy="357" r="16" fill="#1f2937"/><text x="90" y="363" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g>
<line x1="334" y1="357" x2="826" y2="357" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)" fill="none"/>
<rect x="126" y="317" width="670" height="19" fill="#ffffff"/><text x="130" y="331" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">TCP connect: exchange QPN, PSN, LID (IB) or GID index -x (RoCE), rkey, buffer VA, path MTU</text>
<g><title>Step 3</title><circle cx="90" cy="439" r="16" fill="#1f2937"/><text x="90" y="445" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g>
<line x1="334" y1="439" x2="826" y2="439" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)" fill="none"/>
<rect x="126" y="399" width="650" height="19" fill="#ffffff"/><text x="130" y="413" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">QP state machine on both ends: RESET -&gt; INIT -&gt; RTR -&gt; RTS  (or rdma_cm does it with -R)</text>
<g><title>Step 4</title><circle cx="90" cy="521" r="16" fill="#1f2937"/><text x="90" y="527" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text></g>
<line x1="334" y1="521" x2="826" y2="521" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)" fill="none"/>
<rect x="126" y="481" width="681" height="19" fill="#ffffff"/><text x="130" y="495" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">RDMA WRITE x -n iterations (or for -D seconds), -s bytes each, tx-depth WRITEs posted ahead</text>
<g><title>Step 5</title><circle cx="90" cy="603" r="16" fill="#1f2937"/><text x="90" y="609" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<line x1="334" y1="603" x2="826" y2="603" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)" fill="none"/>
<rect x="126" y="563" width="698" height="19" fill="#ffffff"/><text x="130" y="577" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">... thousands of WRITEs; no server CPU involved; the server HCA places data straight into the MR</text>
<g><title>Step 6</title><circle cx="90" cy="685" r="16" fill="#1f2937"/><text x="90" y="691" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g>
<path d="M330,671 L270,671 L270,699 L326,699" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" fill="none"/>
<rect x="126" y="645" width="600" height="19" fill="#ffffff"/><text x="130" y="659" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">client polls its CQ: each completion = one WRITE acknowledged by the remote HCA</text>
<g><title>Step 7</title><circle cx="90" cy="767" r="16" fill="#1f2937"/><text x="90" y="773" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">7</text></g>
<line x1="334" y1="767" x2="826" y2="767" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)" fill="none"/>
<rect x="126" y="727" width="661" height="19" fill="#ffffff"/><text x="130" y="741" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">TCP sync 'done'; both sides compute BW = bytes / wall time and MsgRate = iterations / time</text>
<g><title>Step 8</title><circle cx="90" cy="849" r="16" fill="#1f2937"/><text x="90" y="855" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">8</text></g>
<line x1="334" y1="849" x2="826" y2="849" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)" fill="none"/>
<rect x="126" y="809" width="701" height="19" fill="#ffffff"/><text x="130" y="823" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">-b bidirectional repeats 4-6 both ways; --use_cuda=N places the MR in GPU memory (GPUDirect)</text>
<g><title>ib_write_bw output columns</title><rect x="1060" y="140" width="490" height="380" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1076" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">ib_write_bw output columns</text>
<text x="1076" y="203" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">#bytes       message size (-s, or 2..8M with -a)</text>
<text x="1076" y="223" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">#iterations  WRITEs completed (-n) or in -D s</text>
<text x="1076" y="243" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">BW peak      best sliding-window Gb/s</text>
<text x="1076" y="263" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">BW average   total bytes / total time</text>
<text x="1076" y="283" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">             (compare to 400 for NDR; ~392 OK,</text>
<text x="1076" y="303" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">             ~196 = 2X/HDR, ~350 = PCIe/GDR)</text>
<text x="1076" y="323" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">MsgRate      millions of WRITEs per second;</text>
<text x="1076" y="343" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">             small -s is CPU/PCIe bound, not link</text>
</g>
<g><title>ib_write_lat output columns</title><rect x="1060" y="550" width="490" height="270" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="1076" y="580" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">ib_write_lat output columns</text>
<text x="1076" y="613" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">t_min / t_max   best and worst one-way us</text>
<text x="1076" y="633" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">t_typical       median (the number to quote)</text>
<text x="1076" y="653" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">t_avg, t_stdev  mean and spread</text>
<text x="1076" y="673" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">99% / 99.9%     tail: host jitter if t_typical</text>
<text x="1076" y="693" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">                is fine (C-states, IRQs, -F)</text>
<text x="1076" y="713" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">NDR expect ~1.0-1.3 us; RoCE ~1.5-2.5 us</text>
<text x="1076" y="733" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">half round-trip of a ping-pong WRITE</text>
</g>
<g><title>Legend</title><rect x="1060" y="838" width="490" height="114" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<line x1="1076" y1="864" x2="1130" y2="864" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1144" y="869" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">TCP control exchange / QP setup</text>
<line x1="1076" y1="894" x2="1130" y2="894" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="1144" y="899" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">RDMA data (what is measured)</text>
<line x1="1076" y1="924" x2="1130" y2="924" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="10 5 2 5" marker-end="url(#arrow-purple)"/>
<text x="1144" y="929" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Options that change the data path</text>
</g></svg>
