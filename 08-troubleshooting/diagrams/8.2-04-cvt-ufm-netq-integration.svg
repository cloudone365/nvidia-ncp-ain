<text x="640" y="715" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a3fd1" text-anchor="start" xml:space="preserve">validated plan + cable inventory become UFM's reference topology / snapshot</text>
