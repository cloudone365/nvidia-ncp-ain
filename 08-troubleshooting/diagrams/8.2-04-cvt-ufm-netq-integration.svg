<text x="700" y="462" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start" xml:space="preserve">UFM Fabric Health re-runs ibdiagnet on schedule</text>
