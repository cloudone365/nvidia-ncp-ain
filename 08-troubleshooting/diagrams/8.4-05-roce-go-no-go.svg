<text x="906" y="205" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">PASS: &gt;= 97% of link rate per pair</text>
<text x="906" y="225" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">FAIL: Module 8.1 / 8.3 on the slow rail</text>
