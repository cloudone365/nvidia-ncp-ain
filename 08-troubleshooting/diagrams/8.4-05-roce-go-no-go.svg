<text x="906" y="375" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">FAIL: TC column; host DSCP / PFC end to end</text>
