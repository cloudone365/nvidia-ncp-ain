<g><title>Step 5</title><circle cx="80" cy="810" r="16" fill="#1f2937"/><text x="80" y="816" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<g><title>load: ib_write_bw -R -D 60 -q 4 all rails</title><rect x="890" y="150" width="640" height="120" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5"/>
