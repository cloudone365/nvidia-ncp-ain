<line x1="1300" y1="578" x2="350" y2="578" stroke="#2f6fdb" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
<line x1="1300" y1="596" x2="350" y2="596" stroke="#2f6fdb" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
<line x1="1300" y1="614" x2="350" y2="614" stroke="#2f6fdb" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
<g><title>OSFP module</title><rect x="430" y="520" width="220" height="120" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="540.0" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">OSFP module</text>
<text x="540.0" y="574" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">Rx power per lane [dBm]</text>
<text x="540.0" y="592" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">temp, Vcc, LOS</text>
<text x="540.0" y="610" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">(-m / DOM)</text>
</g>
<g><title>Fiber / DAC</title><rect x="730" y="520" width="220" height="120" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="840.0" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">Fiber / DAC</text>
<text x="840.0" y="574" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">MPO ferrule, 4+4 fibers</text>
<text x="840.0" y="592" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">or 8 copper pairs</text>
<text x="840.0" y="610" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">bend radius, length</text>
</g>
<g><title>Far-end module</title><rect x="1030" y="520" width="220" height="120" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5"/>
<text x="1140.0" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">Far-end module</text>
<text x="1140.0" y="574" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">Tx power per lane [dBm]</text>
<text x="1140.0" y="592" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">bias current [mA]</text>
<text x="1140.0" y="610" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">its temp</text>
</g>
<g><title>Far-end port</title><rect x="1300" y="200" width="250" height="460" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/>
<text x="1425.0" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" xml:space="preserve">Far-end port</text>
</g>
