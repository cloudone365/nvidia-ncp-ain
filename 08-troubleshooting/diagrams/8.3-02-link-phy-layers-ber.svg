<text x="1336" y="276" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Link layer</text>
<text x="1336" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">same view from</text>
<text x="1336" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">the other side</text>
</g>
<g><title>RS-FEC encoder</title><rect x="1320" y="380" width="210" height="110" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/>
<text x="1336" y="406" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">RS-FEC encoder</text>
<text x="1336" y="434" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">adds 30 parity</text>
<text x="1336" y="452" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">symbols per 514</text>
</g>
<g><title>SerDes Tx, 4 lanes</title><rect x="1320" y="520" width="210" height="120" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5"/>
<text x="1336" y="546" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">SerDes Tx, 4 lanes</text>
<text x="1336" y="574" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">PAM4 drivers</text>
<text x="1336" y="592" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">pre-emphasis</text>
</g>
<text x="660" y="505" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2f6fdb" text-anchor="start" xml:space="preserve">4 lanes  (link Width 4x; two lanes lit = Width 2x = 'Could be 4X')</text>
<g><title>Error source</title><rect x="430" y="690" width="280" height="100" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="446" y="712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Hot module (near [-5..80] C ceiling):</text>
<text x="446" y="730" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ALL lanes drift; BER rises with load</text>
<text x="446" y="748" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">and fixes itself at night</text>
</g>
<line x1="550" y1="690" x2="550" y2="640" stroke="#d93025" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Error source</title><rect x="730" y="690" width="280" height="100" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="746" y="712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Dirty / scratched ferrule, bent fiber:</text>
<text x="746" y="730" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ONE lane low Rx power, one lane raw</text>
<text x="746" y="748" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">BER 100-1000x its siblings</text>
</g>
<line x1="850" y1="690" x2="850" y2="640" stroke="#d93025" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Error source</title><rect x="1030" y="690" width="280" height="100" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="1046" y="712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Far-end Tx lane dying:</text>
<text x="1046" y="730" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">low Rx here, normal Rx there;</text>
<text x="1046" y="748" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">check far end -m Tx power</text>
</g>
<line x1="1150" y1="690" x2="1150" y2="640" stroke="#d93025" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Error source</title><rect x="48" y="690" width="300" height="100" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5"/>
<text x="64" y="712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Host SerDes / PCIe slot / firmware:</text>
<text x="64" y="730" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">ALL lanes bad in -l PH loopback too</text>
<text x="64" y="748" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">-&gt; port, not cable</text>
</g>
<line x1="168" y1="690" x2="168" y2="640" stroke="#d93025" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
<g><title>Reading the numbers (mlxlink -c)</title><rect x="430" y="150" width="820" height="240" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5"/>
<text x="446" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Reading the numbers (mlxlink -c)</text>
<text x="446" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Raw Physical BER (per lane) = errors / bits BEFORE FEC. 2E-10 .. 1E-8 is normal on PAM4.</text>
<text x="446" y="225" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">      FEC budget ends around 1E-6 .. 1E-5 pre-FEC (worse = codewords with 16+ bad symbols).</text>
<text x="446" y="244" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Effective Physical BER = errors AFTER FEC. Targets: 1E-12 (Ethernet spec floor) to 1E-15 (healthy NDR).</text>
<text x="446" y="263" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">      '15E-255' means none observed in the window.</text>
<text x="446" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Effective Physical Errors = uncorrectable codewords; must stay 0 / flat. In the link layer they</text>
<text x="446" y="301" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">      surface as Symbol Errors = perfquery SymbolErrorCounter = retransmits = NCCL 'error 12'.</text>
<text x="446" y="320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">--rx_fec_histogram = codewords binned by corrected symbols 0..15; high bins = FEC near its limit.</text>
<text x="446" y="339" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">At 400 Gb/s, BER 1E-12 is ~1 bit error every 2.5 s; 1E-15 is one every ~40 min.</text>
<text x="446" y="358" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">      Judge a rate over a window, never a total since boot.</text>
</g>
<g><title>Legend</title><rect x="48" y="810" width="400" height="84" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<line x1="64" y1="836" x2="118" y2="836" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<text x="132" y="841" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Lane (PAM4 serial stream)</text>
<line x1="64" y1="866" x2="118" y2="866" stroke="#d93025" stroke-width="4" marker-end="url(#arrow-red)"/>
<text x="132" y="871" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" xml:space="preserve">Where the error is born</text>
</g>
<text x="480" y="850" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start" xml:space="preserve">One lane bad = connector / fiber lane / far-end Tx lane.   All lanes bad = module heat, cable length or type, firmware, or the port itself.</text></svg>
