<text x="1125" y="426" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<path d="M1290,590 L1290,630 L165,630 L165,392" fill="none" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="200" y="665" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="start">step 5 &#x27;isolate port&#x27; = SubnSet(PortInfo) PortState Down on IB1/2 -&gt; link goes down, NCCL job on gpu04 loses its path (deliberately)</text>
<g><rect x="40" y="700" width="1000" height="150" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="52" y="724" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Pull side (no push needed): GET /ufmRest/app/events?severity=Critical, GET /ufmRest/app/alarms,</text>
<text x="52" y="744" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Prometheus scraping http://&lt;ufm&gt;:9001/csv/... or the Prometheus endpoint (release-specific).</text>
<text x="52" y="764" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Example policy: &#x27;Symbol error rate exceeded threshold&#x27; -&gt; Critical, threshold N/period, actions: alarm + SNMP + isolate.</text>
<text x="52" y="784" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Resetting counters hides evidence; the event history survives a reset — read app/events, not the live counter.</text>
