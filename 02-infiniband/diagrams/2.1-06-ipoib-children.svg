<text x="574" y="765" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5f6b7a" text-anchor="start">Legend</text>
<line x1="574" y1="787" x2="634" y2="787" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/>
<text x="646" y="793" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Control plane (SM MADs, REST, CM)</text>
<line x1="574" y1="817" x2="634" y2="817" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6"/>
<text x="646" y="823" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Congestion / flow-control signal</text>
