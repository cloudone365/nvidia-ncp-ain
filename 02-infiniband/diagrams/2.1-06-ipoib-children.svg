<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="One HCA port with a PKey table feeding ib0 and two child interfaces ib0.8a01 and ib0.8a10, each bound to a partition multicast group created by the SM"><title>IPoIB child interfaces: one netdev per partition on one HCA port</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">IPoIB child interfaces: one netdev per partition on one HCA port</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">The host asserts full membership (0x8xxx) in create_child; the SM decides what the PKey table actually contains</text>
<g><title>gpu01 (Linux host)</title><rect x="60" y="170" width="420" height="560" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="0.45"/></g>
<text x="76" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">gpu01 (Linux host)</text>
<g><title>ib0  (parent, PKey 0xffff)</title><rect x="90" y="230" width="360" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="270.0" y="270.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">ib0  (parent, PKey 0xffff)</text>
<text x="270.0" y="293.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">10.0.0.1/24  datagram mode  MTU 4092</text>
<g><title>ib0.8a01  (child, PKey 0x8a01)</title><rect x="90" y="350" width="360" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="270.0" y="380.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">ib0.8a01  (child, PKey 0x8a01)</text>
<text x="270.0" y="403.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">echo 0x8a01 &gt; /sys/class/net/ib0/create_child</text>
<text x="270.0" y="423.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">10.1.0.1/24  carrier: UP</text>
<g><title>ib0.8a10  (child, PKey 0x8a10 asked)</title><rect x="90" y="470" width="360" height="90" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="270.0" y="500.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">ib0.8a10  (child, PKey 0x8a10 asked)</text>
<text x="270.0" y="523.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SM granted 0x0a10 (limited) -&gt; still UP</text>
<text x="270.0" y="543.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">10.16.0.11/24</text>
<g><title>ib0.8a02  (child, PKey 0x8a02 asked)</title><rect x="90" y="590" width="360" height="110" rx="10" fill="#ffd9d9" stroke="#d93025" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="270.0" y="630.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">ib0.8a02  (child, PKey 0x8a02 asked)</text>
<text x="270.0" y="653.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">gpu01 not in partition nlp</text>
<text x="270.0" y="673.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">SM never programmed 0x?a02 -&gt; NO-CARRIER</text>
<g><title>mlx5_0 port 1 PKey table</title><rect x="560" y="300" width="300" height="280" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="710.0" y="393.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">mlx5_0 port 1 PKey table</text>
<text x="710.0" y="418.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">index 0: 0xffff</text>
<text x="710.0" y="439.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">index 1: 0x8a01</text>
<text x="710.0" y="460.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">index 2: 0x0a10</text>
<text x="710.0" y="481.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">index 3..127: 0x0000</text>
<text x="710.0" y="502.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">(pkey_tbl_len 128)</text>
<line x1="450" y1="275" x2="560" y2="275" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="450" y1="395" x2="560" y2="395" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="450" y1="515" x2="560" y2="515" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>
<line x1="450" y1="645" x2="560" y2="560" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<text x="470" y="670" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="start">lookup fails</text>
<g><title>SM: partitions.conf</title><rect x="1000" y="170" width="540" height="190" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1270.0" y="228.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">SM: partitions.conf</text>
<text x="1270.0" y="253.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">Default=0x7fff, ipoib, mtu=5, rate=17 : ALL=full ;</text>
<text x="1270.0" y="274.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">vision=0x0a01, ipoib : &lt;gpu01 port GUID&gt;=full, ... ;</text>
<text x="1270.0" y="295.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">storage=0x0a10, ipoib, sl=2, defmember=limited :</text>
<text x="1270.0" y="316.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">   &lt;stor01 GUID&gt;=full, &lt;gpu01 GUID&gt;, ... ;</text>
<line x1="1000" y1="300" x2="860" y2="400" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="930.0" y="334.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#6b7280" text-anchor="middle">SubnSet(PKeyTable) every sweep / SIGHUP</text>
<circle cx="930" cy="350" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="930" y="356" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<g><title>Multicast groups created by &#x27;ipoib&#x27; flag</title><rect x="1000" y="420" width="540" height="160" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1270.0" y="475.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Multicast groups created by &#x27;ipoib&#x27; flag</text>
<text x="1270.0" y="498.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">MGID ff12:401b:&lt;pkey&gt;::ffff:ffff per partition</text>
<text x="1270.0" y="518.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">MLID 0xC000+ ; MFT programmed in switches</text>
<text x="1270.0" y="538.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">ARP/ND broadcast rides this group — without it no ping</text>
<line x1="1000" y1="500" x2="862" y2="500" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="930" y="530" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">IPoIB joins via SA</text>
<text x="930" y="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">MCMemberRecord</text>
<circle cx="930" cy="500" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="930" y="506" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<g><rect x="1000" y="620" width="540" height="110" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="1012" y="644" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Verify: cat /sys/class/infiniband/mlx5_0/ports/1/pkeys/*</text>
<text x="1012" y="664" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">        ip -br link show ib0.8a01   (UP vs NO-CARRIER)</text>
<text x="1012" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Reload:  kill -HUP $(pidof opensm)  — no restart needed</text>
