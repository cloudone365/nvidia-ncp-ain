<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Four compute hosts in two tenant partitions and one storage partition; arrows show which pairs may exchange packets based on full or limited PKey membership"><title>Partitions: two tenants plus a shared storage PKey with limited membership</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Partitions: two tenants plus a shared storage PKey with limited membership</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Full &lt;-&gt; full and full &lt;-&gt; limited can talk; limited &lt;-&gt; limited is dropped by the receiving HCA (PortRcvConstraintErrors)</text>
<g><rect x="40" y="150" width="1520" height="600" rx="18" fill="none" stroke="#1a9c8a" stroke-width="2" stroke-dasharray="8 6" fill-opacity="1.0"/></g>
<text x="56" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a9c8a" text-anchor="start">Partition storage=0x0a10, ipoib, sl=2, mtu=5 : stor01=full, every compute host limited (defmember=limited)</text>
<g><rect x="70" y="520" width="580" height="215" rx="14" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" fill-opacity="1.0"/></g>
<text x="80" y="545" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2f6fdb" text-anchor="start">Partition vision=0x0a01, defmember=full, ipoib, sl=0</text>
<g><rect x="950" y="520" width="580" height="215" rx="14" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" fill-opacity="1.0"/></g>
<text x="960" y="545" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2f6fdb" text-anchor="start">Partition nlp=0x0a02, defmember=full, ipoib, sl=0</text>
<g><title>vis01</title><rect x="100" y="560" width="220" height="130" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="210.0" y="588.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">vis01</text>
<text x="210.0" y="613.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">PKey table:</text>
<text x="210.0" y="634.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0xffff (default, full)</text>
<text x="210.0" y="655.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x8a01 vision full</text>
<text x="210.0" y="676.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x0a10 storage LIMITED</text>
<g><title>vis02</title><rect x="400" y="560" width="220" height="130" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="510.0" y="588.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">vis02</text>
<text x="510.0" y="613.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">PKey table:</text>
<text x="510.0" y="634.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0xffff (default, full)</text>
<text x="510.0" y="655.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x8a01 vision full</text>
<text x="510.0" y="676.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x0a10 storage LIMITED</text>
<g><title>nlp01</title><rect x="980" y="560" width="220" height="130" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1090.0" y="588.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">nlp01</text>
<text x="1090.0" y="613.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">PKey table:</text>
<text x="1090.0" y="634.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0xffff (default, full)</text>
<text x="1090.0" y="655.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x8a02 nlp full</text>
<text x="1090.0" y="676.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x0a10 storage LIMITED</text>
<g><title>nlp02</title><rect x="1280" y="560" width="220" height="130" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1390.0" y="588.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">nlp02</text>
<text x="1390.0" y="613.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">PKey table:</text>
<text x="1390.0" y="634.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0xffff (default, full)</text>
<text x="1390.0" y="655.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x8a02 nlp full</text>
<text x="1390.0" y="676.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x0a10 storage LIMITED</text>
<g><title>stor01</title><rect x="690" y="200" width="220" height="120" rx="10" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="234.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">stor01</text>
<text x="800.0" y="259.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">PKey table:</text>
<text x="800.0" y="280.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0xffff</text>
<text x="800.0" y="301.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">0x8a10 storage FULL</text>
<line x1="210" y1="560" x2="800" y2="320" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
<line x1="510" y1="560" x2="800" y2="320" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
<line x1="1090" y1="560" x2="800" y2="320" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
<line x1="1390" y1="560" x2="800" y2="320" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
<text x="800" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#2f6fdb" text-anchor="middle">limited &lt;-&gt; full on 0x0a10: every compute host reaches storage</text>
<line x1="320" y1="625" x2="400" y2="625" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
<text x="360" y="718" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2f6fdb" text-anchor="middle">full &lt;-&gt; full on 0x8a01: allowed</text>
<line x1="1200" y1="625" x2="1280" y2="625" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
<text x="1240" y="718" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2f6fdb" text-anchor="middle">full &lt;-&gt; full on 0x8a02: allowed</text>
<line x1="620" y1="640" x2="980" y2="640" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)" marker-start="url(#arrow-red)"/>
<text x="800" y="622" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#d93025" text-anchor="middle">limited &lt;-&gt; limited on 0x0a10: DROPPED</text>
<text x="800" y="668" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#d93025" text-anchor="middle">no shared tenant key: no path at all</text>
<g><rect x="40" y="765" width="1040" height="110" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="52" y="789" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">PKey field (BTH, 16 bits): bit 15 = membership (1 full, 0 limited); bits 14..0 = partition number (0x0001-0x7ffe; 0x7fff = default).</text>
<text x="52" y="809" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Host writes 0x8a10 to create_child (asserts full); SM grants 0x0a10 (limited) -&gt; kernel matches on the low 15 bits, interface still comes up.</text>
<text x="52" y="829" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Table size: pkey_tbl_len (128 on ConnectX). Mismatch counter: PortRcvConstraintErrors on the receiving port.</text>
<text x="52" y="849" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Check what the SM granted: cat /sys/class/infiniband/mlx5_0/ports/1/pkeys/*</text>
<g><rect x="1130" y="740" width="420" height="142" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="1144" y="760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5f6b7a" text-anchor="start">Legend</text>
<line x1="1144" y1="782" x2="1204" y2="782" stroke="#2f6fdb" stroke-width="4"/>
<text x="1216" y="788" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Data plane (IB / RDMA payload)</text>
<line x1="1144" y1="812" x2="1204" y2="812" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6"/>
<text x="1216" y="818" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Congestion / flow-control signal</text>
<rect x="1144" y="831" width="60" height="22" rx="5" fill="#e4f1cc" stroke="#76b900" stroke-width="2"/>
<text x="1216" y="848" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">compute host (tenant)</text>
<rect x="1144" y="861" width="60" height="22" rx="5" fill="#d9f3f0" stroke="#1a9c8a" stroke-width="2"/>
<text x="1216" y="878" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">storage server</text>
</svg>
