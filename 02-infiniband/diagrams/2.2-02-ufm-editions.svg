<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Nested stack of UFM Telemetry, UFM Enterprise and UFM Cyber-AI editions with the capabilities each layer adds"><title>UFM editions: Telemetry is a subset of Enterprise, which is a subset of Cyber-AI</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">UFM editions: Telemetry is a subset of Enterprise, which is a subset of Cyber-AI</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Pick the edition by the operational question you need answered</text>
<g><rect x="120" y="160" width="1360" height="640" rx="16" fill="#e9ddff" stroke="#7a3fd1" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="140" y="195" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#7a3fd1" text-anchor="start">UFM Cyber-AI  (appliance)</text>
<text x="140" y="225" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">+ ML models on telemetry history: link-failure prediction, cable degradation trend, anomaly detection</text>
<text x="140" y="247" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">+ security analytics (unexpected topology change), capacity analytics, long-term retention</text>
<g><rect x="200" y="290" width="1200" height="480" rx="14" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="220" y="325" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2f6fdb" text-anchor="start">UFM Enterprise  (software, Docker or appliance)</text>
<text x="220" y="355" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">+ Subnet Manager (MLNXSM) with HA, AR, SHARP AM, PKey management, QoS settings</text>
<text x="220" y="377" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">+ Fabric discovery, Network Map, Managed/Logical Elements, firmware management, topology compare</text>
<text x="220" y="399" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">+ Events &amp; alarms with thresholds -&gt; SNMP / syslog / email / script / port isolation</text>
<text x="220" y="421" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">+ REST API (/ufmRest), Web UI, RBAC/LDAP, HA with Pacemaker + DRBD</text>
<g><rect x="280" y="480" width="1040" height="260" rx="12" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="300" y="515" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#6b7280" text-anchor="start">UFM Telemetry  (container, stand-alone)</text>
<text x="300" y="545" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">High-frequency port counter collection from switches and HCAs via PM MADs</text>
<text x="300" y="567" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">CSV / Prometheus export over HTTP (port 9001) for Grafana, NetQ-style dashboards</text>
<text x="300" y="589" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">NO Subnet Manager, NO UI — works alongside an SM that runs elsewhere</text>
<g><rect x="300" y="640" width="1000" height="80" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="312" y="664" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Exam mapping:  &#x27;runs without an SM&#x27; -&gt; Telemetry   |   &#x27;single pane of glass, REST, HA&#x27; -&gt; Enterprise   |   &#x27;predictive / anomaly analytics&#x27; -&gt; Cyber-AI</text>
<text x="312" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Licensing: per managed node; evaluation mode expires. Appliances ship with the licence tied to the hardware.</text>
</svg>
