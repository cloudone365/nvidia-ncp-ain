<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="Three SM locations (switch-embedded, host opensm, UFM) connected to one fabric with SMInfo polling and election rules"><title>Subnet Manager redundancy: where SMs run and how the master is elected</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Subnet Manager redundancy: where SMs run and how the master is elected</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Highest priority wins; tie -&gt; lowest port GUID. Standbys poll the master; the data plane keeps forwarding on programmed LFTs</text>
<g><title>InfiniBand subnet</title><rect x="530" y="420" width="540" height="150" rx="18" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800" y="480" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">InfiniBand subnet (one LID space, 16-bit)</text>
<text x="800" y="510" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">2 x QM9700, 4 hosts; LFTs written by the master</text>
<text x="800" y="540" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">forwarding continues even if every SM dies</text>
<g><title>ib-sw-01 embedded SM (MLNX-OS)</title><rect x="60" y="170" width="400" height="150" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="260.0" y="219.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">ib-sw-01 embedded SM (MLNX-OS)</text>
<text x="260.0" y="244.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">ib sm ; ib sm sm-priority 13</text>
<text x="260.0" y="265.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">GUID 0x0c42a10300e4f3a0</text>
<text x="260.0" y="286.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">state: MASTER</text>
<g><title>ufm01 UFM Enterprise SM</title><rect x="600" y="170" width="400" height="150" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="800.0" y="219.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">ufm01 UFM Enterprise SM</text>
<text x="800.0" y="244.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">sm_priority = 15 (gv.cfg)</text>
<text x="800.0" y="265.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">GUID 0xb83fd20300aa0001</text>
<text x="800.0" y="286.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">state: NOT ACTIVE (not yet started)</text>
<g><title>gpu01 host opensm</title><rect x="1140" y="170" width="400" height="150" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1340.0" y="219.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">gpu01 host opensm</text>
<text x="1340.0" y="244.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">sm_priority 12 (opensm.conf)</text>
<text x="1340.0" y="265.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">GUID 0xb83fd203001a2b3c</text>
<text x="1340.0" y="286.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="middle">state: STANDBY</text>
<line x1="260" y1="320" x2="640" y2="430" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="430" y="398" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#6b7280" text-anchor="end">programs LFTs / PKeys</text>
<line x1="800" y1="320" x2="800" y2="420" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<line x1="1340" y1="320" x2="960" y2="430" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="1170" y="410" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#6b7280" text-anchor="start">discovers but does not program</text>
<path d="M260,170 L260,140 L1340,140 L1340,170" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
<text x="800" y="132" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle">SMInfo polling in both directions: master -&gt; standby, standby -&gt; master (sminfo_polling_timeout x polling_retry_number)</text>
<circle cx="260" cy="156" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="260" y="162" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<g><rect x="60" y="620" width="700" height="230" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="72" y="644" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">Election rules (SMInfo attribute exchanged during sweeps):</text>
<text x="72" y="666" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">1. Highest sm_priority (0-15) becomes MASTER.</text>
<text x="72" y="688" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">2. Tie -&gt; lowest port GUID wins.</text>
<text x="72" y="710" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">3. Master lost (polls time out) -&gt; best standby runs discovery, takes over,</text>
<text x="72" y="732" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">   reuses LIDs from guid2lid / lid_matrix cache -&gt; hitless for existing QPs.</text>
<text x="72" y="754" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">4. master_sm_priority / sticky master can stop a returning high-priority SM</text>
<text x="72" y="776" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">   from pre-empting (verify in current docs for your release).</text>
<g><rect x="800" y="620" width="752" height="230" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="812" y="644" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">States you read in sminfo / show ib sm / UFM:</text>
<text x="812" y="666" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">DISCOVERING  sweeping, has not decided yet</text>
<text x="812" y="688" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">MASTER       owns the subnet, programs routing</text>
<text x="812" y="710" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">STANDBY      another SM has higher priority; ready to take over</text>
<text x="812" y="732" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">NOT ACTIVE   process up, not participating</text>
<text x="812" y="754" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="812" y="776" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="start">sminfo: sm lid 1 sm guid 0x0c42a1.. priority 13 state 3 SMINFO_MASTER</text>
</svg>
