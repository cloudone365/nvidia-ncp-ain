<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="InfiniBand five-layer model mapped to OSI with the LRH, GRH, BTH header fields and the layer that owns LID, GID, PKey and QPN"><title>InfiniBand layers vs OSI, and where each identifier lives</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">InfiniBand layers vs OSI, and where each identifier lives</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Packet on the wire (left to right) and the layer that owns each header field</text>
<text x="48" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5f6b7a" text-anchor="start">OSI</text>
<text x="300" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5f6b7a" text-anchor="start">InfiniBand layer</text>
<text x="800" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5f6b7a" text-anchor="start">Header fields it owns (bit widths)</text>
<g><title>L5-7 Application</title><rect x="48" y="150" width="220" height="100" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="158.0" y="205.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">L5-7 Application</text>
<g><title>Upper layers / verbs</title><rect x="300" y="150" width="460" height="100" rx="10" fill="#fff5cc" stroke="#c9a400" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="530.0" y="194.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Upper layers / verbs</text>
<text x="530.0" y="220.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">libibverbs, IPoIB, NCCL, UCX</text>
<g><title>L4 Transport</title><rect x="48" y="266" width="220" height="100" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="158.0" y="321.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">L4 Transport</text>
<g><title>Transport</title><rect x="300" y="266" width="460" height="100" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="530.0" y="299.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Transport</text>
<text x="530.0" y="325.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">Queue Pairs, RC/UC/UD, ACK/NAK,</text>
<text x="530.0" y="347.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">segmentation to path MTU</text>
<g><title>L3 Network</title><rect x="48" y="382" width="220" height="100" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="158.0" y="437.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">L3 Network</text>
<g><title>Network</title><rect x="300" y="382" width="460" height="100" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="530.0" y="415.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Network</text>
<text x="530.0" y="441.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">GID routing between subnets</text>
<text x="530.0" y="463.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">(GRH, rarely used in one subnet)</text>
<g><title>L2 Data link</title><rect x="48" y="498" width="220" height="100" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="158.0" y="553.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">L2 Data link</text>
<g><title>Link</title><rect x="300" y="498" width="460" height="100" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="530.0" y="531.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Link</text>
<text x="530.0" y="557.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID forwarding in a subnet, VLs,</text>
<text x="530.0" y="579.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">credit flow control, VCRC</text>
<g><title>L1 Physical</title><rect x="48" y="614" width="220" height="100" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="158.0" y="669.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">L1 Physical</text>
<g><title>Physical</title><rect x="300" y="614" width="460" height="100" rx="10" fill="#eeeeee" stroke="#6b7280" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="530.0" y="647.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Physical</text>
<text x="530.0" y="673.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">4 lanes x 100 Gb/s PAM4 = NDR 400G</text>
<text x="530.0" y="695.9" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5f6b7a" text-anchor="middle">OSFP, FEC</text>
<g><rect x="800" y="150" width="752" height="100" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="812" y="188" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">MAD payload (SMP/GMP, 256 B) — Q_Key 32b for UD; application data</text>
<g><rect x="800" y="266" width="752" height="100" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="812" y="296" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">BTH 12 B: OpCode 8b | SE | M | Pad 2b | TVer 4b | PKey 16b | DestQP 24b | A | PSN 24b</text>
<text x="812" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">+ RETH 16 B for RDMA WRITE/READ: VA 64b | R_Key 32b | DMALen 32b   (ICRC 32b at tail)</text>
<g><rect x="800" y="382" width="752" height="100" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="812" y="412" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">GRH 40 B (optional on IB, always on RoCE): IPVer 4b | TClass 8b | FlowLabel 20b |</text>
<text x="812" y="442" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">PayLen 16b | NxtHdr 8b | HopLmt 8b | SGID 128b | DGID 128b</text>
<g><rect x="800" y="498" width="752" height="100" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="812" y="528" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">LRH 8 B: VL 4b | LVer 4b | SL 4b | LNH 2b | DLID 16b | PktLen 11b | SLID 16b</text>
<text x="812" y="558" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">VCRC 16b at tail; flow-control packets carry credits per VL</text>
<g><rect x="800" y="614" width="752" height="100" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="812" y="644" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Lane training, speed/width negotiation (ibstat: Active width 4X, Active speed 100 Gbps)</text>
<text x="812" y="674" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">symbol errors live here (SymbolErrorCounter)</text>
<text x="48" y="760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Who assigns what:</text>
<text x="48" y="788" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">GUID 64b — vendor, permanent (node, port, system image GUIDs)</text>
<text x="48" y="812" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">LID 16b — assigned by the SM per subnet; may change after a new master</text>
<text x="48" y="836" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">GID 128b = subnet prefix 64b + port GUID 64b (default fe80::/64)</text>
<text x="820" y="788" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">PKey 16b — SM via partitions.conf; checked in the BTH by every HCA</text>
<text x="820" y="812" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">QPN 24b — HCA at ibv_create_qp, unique per port</text>
<text x="820" y="836" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">SL 4b — chosen by the application; mapped to a VL at every hop</text>
</svg>
