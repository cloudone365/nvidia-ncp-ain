<g><rect x="40" y="830" width="1040" height="130" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="52" y="854" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1 SM gives sharp_am the SHARP-capable topology.  2 sharp_am programs an aggregation tree + per-job quota into the switches.</text>
<text x="52" y="874" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">3 Each GPU sends its buffer ONCE to its leaf (sharpd brokered the job with sharp_am).  4 Leaves reduce 4:1, spine reduces 2:1.</text>
<text x="52" y="894" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">5 Root multicasts the final result down the tree. Data crossing the fabric ~halves vs ring all-reduce; GPUs do no reduction math.</text>
<text x="52" y="914" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Generations: v1 Switch-IB 2, v2 Quantum (SAT streaming), v3 Quantum-2 (multi-tenant), v4 Quantum-X800 (800G).</text>
