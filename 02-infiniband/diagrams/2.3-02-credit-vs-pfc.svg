<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="100%" role="img" aria-label="Side by side comparison of InfiniBand per-VL credit flow control and Ethernet priority flow control with pause frames and headroom"><title>Link-level losslessness: InfiniBand credit-based flow control vs Ethernet PFC</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="760" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Link-level losslessness: InfiniBand credit-based flow control vs Ethernet PFC</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">IB: the transmitter may only send what the receiver has already granted. PFC: the transmitter sends until told to stop, and headroom absorbs what is in flight</text>
<g><title>InfiniBand (per VL)</title><rect x="40" y="150" width="740" height="470" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="0.45"/></g>
<text x="56" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">InfiniBand (per VL)</text>
<g><title>TX: leaf-01 port 31</title><rect x="70" y="220" width="240" height="110" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="190.0" y="260.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">TX: leaf-01 port 31</text>
<text x="190.0" y="283.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">credits available: 12</text>
<text x="190.0" y="303.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">(FCCL - FCTBS)</text>
<g><title>RX: spine-01 port 5</title><rect x="540" y="220" width="220" height="110" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="650.0" y="260.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">RX: spine-01 port 5</text>
<text x="650.0" y="283.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">VL1 buffer</text>
<text x="650.0" y="303.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">free: 12 x 64 B blocks</text>
<line x1="310" y1="250" x2="540" y2="250" stroke="#2f6fdb" stroke-width="4" marker-end="url(#arrow-blue)"/>
<line x1="540" y1="310" x2="310" y2="310" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<g><title>Ethernet RoCE (per priority, 802.1Qbb)</title><rect x="820" y="150" width="740" height="470" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5" fill-opacity="0.45"/></g>
<text x="836" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">Ethernet RoCE (per priority, 802.1Qbb)</text>
<g><title>TX: hostA ens1f0np0</title><rect x="850" y="220" width="240" height="110" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="970.0" y="260.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">TX: hostA ens1f0np0</text>
<text x="970.0" y="283.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">sends freely until</text>
<text x="970.0" y="303.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">a PAUSE arrives</text>
<g><title>RX: leaf01 swp1</title><rect x="1300" y="220" width="240" height="110" rx="10" fill="#ffe9cc" stroke="#e07b00" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1420.0" y="260.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">RX: leaf01 swp1</text>
<text x="1420.0" y="283.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">prio 3 ingress buffer</text>
<text x="1420.0" y="303.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">XOFF threshold + headroom</text>
<line x1="1090" y1="250" x2="1300" y2="250" stroke="#e07b00" stroke-width="4" marker-end="url(#arrow-orange)"/>
<line x1="1300" y1="310" x2="1090" y2="310" stroke="#d93025" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrow-red)"/>
<circle cx="425" cy="250" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="425" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="425" cy="310" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="425" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="1195" cy="250" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="1195" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="1195" cy="310" r="16" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
<text x="1195" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="70" y="362" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2f6fdb" text-anchor="start">1  data on VL1, sent only while credits &gt; 0</text>
<text x="70" y="384" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#d93025" text-anchor="start">2  flow-control packet carries FCCL per VL (periodic + on change)</text>
<text x="850" y="362" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e07b00" text-anchor="start">1  RoCE data, priority 3 (DSCP 26), sent freely</text>
<text x="850" y="384" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#d93025" text-anchor="start">2  PFC frame: pause prio 3 for N quanta (1 quantum = 512 bit-times)</text>
<text x="70" y="432" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Credit unit: 64 bytes. FCTBS (blocks sent) and FCCL (credit limit) are 12-bit.</text>
<text x="70" y="458" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">TX stops at exactly zero credits: overflow is impossible, no headroom needed.</text>
<text x="70" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Per-VL granularity: one stalled VL does not block the others on the link.</text>
<text x="70" y="510" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Cost: back-pressure spreads hop by hop (tree saturation); IB CC / PCC</text>
<text x="70" y="536" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">adds end-to-end rate control. Observe: PortXmitWait.</text>
<text x="70" y="562" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Zero configuration: the SM sets operational VLs; credits are pure hardware.</text>
<text x="70" y="588" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Loss only from bit errors or HoQ timeout (PortXmitDiscards).</text>
<text x="850" y="432" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">XOFF sent when the priority-3 buffer crosses a threshold; XON when it drains.</text>
<text x="850" y="458" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Headroom absorbs in-flight data: TX reaction time + one max frame +</text>
<text x="850" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">2 x propagation (~5 ns/m). 400G, 100 m: ~1 us x 400 Gb/s = ~50 KB.</text>
<text x="850" y="510" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Headroom too small -&gt; drops on a 'lossless' priority (rx_prio3_discards).</text>
<text x="850" y="536" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Pause propagates upstream -&gt; PFC storm; watchdog breaks it by dropping.</text>
<text x="850" y="562" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Every hop: mlnx_qos --pfc 0,0,0,1,0,0,0,0 ; nv set qos roce mode lossless</text>
<text x="850" y="588" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Keep it rare: ECN/DCQCN should slow senders before XOFF is ever reached.</text>
<g><rect x="40" y="650" width="1520" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="52" y="676" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Same goal (no drops under congestion), opposite mechanisms: IB grants before sending (proactive, per VL); PFC stops after sending (reactive, per priority).</text>
<text x="52" y="698" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Exam: &#x27;IB does not use PFC or ECN&#x27; — credits are intrinsic. &#x27;RoCE needs PFC + ECN on every hop&#x27; — losslessness is configured, and misconfiguration drops silently.</text>
</svg>
