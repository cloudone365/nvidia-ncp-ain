<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-label="A two-spine two-leaf fat tree with LFT entries for leaf-01 showing minhop load-balanced versus ftree deterministic spine selection"><title>Routing engines on a 2-level fat tree: minhop vs ftree and the LFT they write</title><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76b900"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="48" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Routing engines on a 2-level fat tree: minhop vs ftree and the LFT they write</text><text x="48" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5f6b7a">Same topology, same destination LIDs — different LFT entries on leaf-01. The LFT is a per-switch table: destination LID -&gt; output port</text>
<g><title>spine-01 QM9700</title><rect x="420" y="160" width="260" height="70" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="550.0" y="190.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">spine-01 QM9700</text>
<text x="550.0" y="213.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID 3</text>
<g><title>spine-02 QM9700</title><rect x="1000" y="160" width="260" height="70" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1130.0" y="190.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">spine-02 QM9700</text>
<text x="1130.0" y="213.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID 4</text>
<g><title>leaf-01 QM9700</title><rect x="420" y="400" width="260" height="70" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="550.0" y="430.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">leaf-01 QM9700</text>
<text x="550.0" y="453.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID 1</text>
<g><title>leaf-02 QM9700</title><rect x="1000" y="400" width="260" height="70" rx="10" fill="#dbe8ff" stroke="#2f6fdb" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1130.0" y="430.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">leaf-02 QM9700</text>
<text x="1130.0" y="453.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID 2</text>
<line x1="550" y1="400" x2="550" y2="230" stroke="#2f6fdb" stroke-width="3"/>
<line x1="550" y1="400" x2="1130" y2="230" stroke="#2f6fdb" stroke-width="3"/>
<line x1="1130" y1="400" x2="550" y2="230" stroke="#2f6fdb" stroke-width="3"/>
<line x1="1130" y1="400" x2="1130" y2="230" stroke="#2f6fdb" stroke-width="3"/>
<text x="60" y="360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">Uplinks 400G NDR:</text>
<text x="60" y="382" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">leaf port 31 -&gt; spine-01</text>
<text x="60" y="404" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">leaf port 32 -&gt; spine-02</text>
<text x="520" y="390" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">p31</text>
<text x="600" y="390" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">p32</text>
<g><title>gpu01</title><rect x="300" y="560" width="160" height="60" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="380.0" y="585.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">gpu01</text>
<text x="380.0" y="607.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID 5</text>
<line x1="380" y1="560" x2="550" y2="470" stroke="#2f6fdb" stroke-width="3"/>
<g><title>gpu02</title><rect x="520" y="560" width="160" height="60" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="600.0" y="585.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">gpu02</text>
<text x="600.0" y="607.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID 6</text>
<line x1="600" y1="560" x2="550" y2="470" stroke="#2f6fdb" stroke-width="3"/>
<g><title>gpu03</title><rect x="880" y="560" width="160" height="60" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="960.0" y="585.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">gpu03</text>
<text x="960.0" y="607.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID 7</text>
<line x1="960" y1="560" x2="1130" y2="470" stroke="#2f6fdb" stroke-width="3"/>
<g><title>gpu04</title><rect x="1100" y="560" width="160" height="60" rx="10" fill="#e4f1cc" stroke="#76b900" stroke-width="2.5" fill-opacity="1.0"/></g>
<text x="1180.0" y="585.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">gpu04</text>
<text x="1180.0" y="607.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="middle">LID 8</text>
<line x1="1180" y1="560" x2="1130" y2="470" stroke="#2f6fdb" stroke-width="3"/>
<g><rect x="60" y="660" width="700" height="190" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="72" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">leaf-01 LFT with routing_engine minhop (shortest path, balance by port load):</text>
<text x="72" y="704" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"> DLID 5 (gpu01) -&gt; port 1     DLID 6 (gpu02) -&gt; port 2</text>
<text x="72" y="724" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"> DLID 7 (gpu03) -&gt; port 31    DLID 8 (gpu04) -&gt; port 32   (alternates uplinks by LID order)</text>
<text x="72" y="744" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"> DLID 2 (leaf-02) -&gt; port 31  DLID 3 -&gt; port 31   DLID 4 -&gt; port 32</text>
<text x="72" y="764" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Works on any topology; no deadlock guarantee on non-tree wiring;</text>
<text x="72" y="784" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">which flows collide on an uplink depends on LID order, not load.</text>
<g><rect x="800" y="660" width="752" height="190" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" fill-opacity="1.0"/></g>
<text x="812" y="684" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">leaf-01 LFT with routing_engine ftree (fat-tree aware, deadlock-free, root_guid_file):</text>
<text x="812" y="704" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"> DLID 7 (gpu03) -&gt; port 31    DLID 8 (gpu04) -&gt; port 32</text>
<text x="812" y="724" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"> destinations spread across spines deterministically by position in the tree;</text>
<text x="812" y="744" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start"> every spine owns a disjoint set of destination LIDs (up/down turns only).</text>
<text x="812" y="764" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ar_ftree adds an AR group {31,32} per destination so the ASIC may pick either (Module 2.3).</text>
<text x="812" y="784" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">LFT size: 48K unicast LIDs (0x0001-0xBFFF), programmed in 64-LID blocks by SMP.</text>
<text x="60" y="270" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">Hosts on leaf-02 are reached</text>
<text x="60" y="292" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">via one of two uplinks —</text>
<text x="60" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6b7a" text-anchor="start">the engine decides which.</text>
</svg>
